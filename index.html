<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Top 10</title>
<meta name="description" content="Daily briefing of the 10 most important world stories">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="World Top 10">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1b1d21; --muted:#6b6f78; --line:#e4e0d6;
  --accent:#b4441f; --accent-soft:#f6e6de; --chip:#efece4; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --card:#1f2228; --ink:#eceae4; --muted:#9a9ea8; --line:#2e323a;
    --accent:#f08a5d; --accent-soft:#3a2a22; --chip:#2a2e35; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.date-btn{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;font:inherit}
.date-btn .d{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-btn .d svg{flex:none;opacity:.6}
.nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.oneline{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:4px 0 18px;font-size:16px}
.oneline b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.content h2.story{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:18px;line-height:1.35;margin:0;
  padding:16px 16px 6px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
.content h2.story + p{margin:-1px 0 14px;padding:0 16px 16px;background:var(--card);border:1px solid var(--line);border-top:0;
  border-radius:0 0 16px 16px;box-shadow:var(--shadow);font-size:15px}
.num{flex:none;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;min-width:1.4em}
.ht{flex:1 1 200px}
.cat{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  background:var(--chip);padding:3px 8px;border-radius:999px}
.content strong{font-weight:650}
.content h2:not(.story),.content h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 8px}
.content ul{margin:0 0 12px;padding:0 0 0 20px}
.content li{margin:4px 0}
.content > p{margin:0 0 12px}
.foot{color:var(--muted);font-size:13px;margin-top:28px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* date sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:var(--card);border-radius:20px 20px 0 0;z-index:21;
  transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet h3{margin:0;padding:16px 18px 10px;font-size:15px}
.sheet ul{list-style:none;margin:0;padding:0 8px 12px;overflow:auto}
.sheet li button{width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:10px 10px;border-radius:12px;cursor:pointer}
.sheet li button.cur{background:var(--accent-soft)}
.sheet li .sd{font-weight:650}
.sheet li .sl{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){ .sheet{left:50%;right:auto;width:480px;margin-left:-240px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="date-btn" id="dateBtn" aria-label="Choose date">
      <div class="brand">World Top 10</div>
      <div class="d"><span id="dateTxt">&nbsp;</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
    </button>
    <div class="nav">
      <button class="icon-btn" id="older" aria-label="Older briefing"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="newer" aria-label="Newer briefing"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
</header>
<main>
  <div id="one"></div>
  <article class="content" id="content"></article>
  <div class="foot" id="foot"></div>
</main>
<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-label="All briefings">
    <h3>All briefings</h3>
    <ul id="list"></ul>
  </div>
</div>
<script>
const DATA = [{"date": "2026-11-14", "line": "A tightening US blockade of Iran, a bond sell-off pushing the 10-year yield to 5%, and a shock CEO exit at Nvidia dominate a week in which markets also await Anthropic's record IPO.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US naval blockade of Iran tightens as drone clash hits Bahrain<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US CENTCOM says the blockade has turned away nearly 150 ships, and a new \"Task Force Iron Gate\" targets Iran's land and Caspian routes, though Iraq, Turkey and Pakistan are resisting. On 13 November Iran's IRGC claimed it destroyed a US radar in Bahrain; the US says it shot down two attack drones and denies any radar was lost. Qatar and Pakistan are still mediating, but Rubio called Iran's latest truce terms \"outrageous\".<br><strong>Why it matters:<\/strong> The Gulf standoff keeps oil prices elevated and risks a return to open fighting in a region carrying a large share of global energy supply.<br><strong>Sources:<\/strong> <a href=\"https://www.israelnationalnews.com/news/436040\" target=\"_blank\" rel=\"noopener\">Israel National News<\/a>, <a href=\"https://euronews.com/2026/11/13/irgc-says-it-destroyed-us-radar-in-bahrain-after-attack-on-southern-iran\" target=\"_blank\" rel=\"noopener\">Euronews<\/a>, <a href=\"https://www.cbsnews.com/live-updates/iran-war-us-trump-deal-negotiations/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US 10-year yield tops 5% as a December Fed hike is priced in<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> After hot inflation data, the 10-year Treasury yield touched 5% this week and was around 5.1% on Friday; wholesale inflation is at a near four-year high annually. Futures price a December Fed hike as fully expected, with Governor Waller reportedly open to a 50 bp move.<br><strong>Why it matters:<\/strong> Higher US rates raise borrowing costs worldwide, strengthen the dollar, and pressure equities, emerging markets and Hong Kong, whose currency is pegged to the US dollar.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://www.freepressjournal.in/business/us-bond-yield-crosses-5-as-inflation-surges-december-fed-rate-hike-fears-rattle-global-markets\" target=\"_blank\" rel=\"noopener\">Free Press Journal<\/a>, <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns amid board investigation<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia told the SEC that Huang resigned as CEO and director effective immediately, with CFO Colette Kress as interim CEO. The board had opened an investigation after Huang admitted an affair; some reports mention alleged intelligence-linked contact, which the board said it had no reason to think compromised secrets (unconfirmed). Shares closed about 13% below their 6 November level.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether and a very large weight in US indexes, so leadership turmoil moves the whole tech sector. Earnings are due soon.<br><strong>Sources:<\/strong> <a href=\"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm\" target=\"_blank\" rel=\"noopener\">SEC 8-K<\/a>, <a href=\"https://scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Anthropic nears record AI IPO<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic filed its S-1 on 26 October to list on Nasdaq as \"ANT\". Reports say the offering could raise over $100 billion at a valuation possibly above $2 trillion; the filing shows $33.2 billion revenue for nine months to September. Pricing and first-trade date (between 16 November and Thanksgiving) are not confirmed.<br><strong>Why it matters:<\/strong> It would be among the largest listings ever and a test of investor appetite for AI valuations amid the Nvidia shock.<br><strong>Sources:<\/strong> <a href=\"https://techcrunch.com/2026/10/26/anthropic-officially-files-for-its-public-debut/\" target=\"_blank\" rel=\"noopener\">TechCrunch<\/a>, <a href=\"https://www.renaissancecapital.com/IPO-Center/News/122417/ai-model-developer-anthropic-pbc-files-for-an-estimated-75-billion-ipo\" target=\"_blank\" rel=\"noopener\">Renaissance Capital<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this virus species and second-largest Ebola outbreak ever. It remains a WHO emergency; Kenya reported an imported case on 6 October, while Uganda's outbreak was declared over in August.<br><strong>Why it matters:<\/strong> Regional spread and a high fatality rate strain health systems and raise travel and containment concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">COP31 climate talks under way in Antalya without the US<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The summit opened on 9 November and runs to 20 November, with Turkey hosting and Australia leading negotiations. Finance is the central issue, amid a hot year with an exceptionally strong El Nino. The Trump administration sent no delegation after leaving the Paris Agreement.<br><strong>Why it matters:<\/strong> Climate finance outcomes shape emissions paths and adaptation funding for vulnerable countries, now without US participation.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Russia and Ukraine agree prisoner swap after Abu Dhabi talks<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The two sides agreed to a large prisoner exchange after US-mediated talks in Abu Dhabi. Ukraine also opened a case over Russia's recruitment of foreign nationals, including from Bangladesh, who say they were sent to combat.<br><strong>Why it matters:<\/strong> Humanitarian exchanges are a rare sign of channel-keeping, though no ceasefire has been reported.<br><strong>Sources:<\/strong> <a href=\"https://rightsinrussia.substack.com/p/news-of-the-week-012\" target=\"_blank\" rel=\"noopener\">Rights in Russia weekly<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hong Kong raises 2026 growth forecast to 4.8%<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The government lifted its full-year real GDP forecast to 4.8%, citing strong Q4 momentum; SCMP calls it the best growth since 2021, with external uncertainty remaining.<br><strong>Why it matters:<\/strong> It signals a firmer local recovery, though US rate rises and a strong dollar are headwinds for the HKD-pegged economy.<br><strong>Sources:<\/strong> <a href=\"https://thestandard.com.hk/news/article/348454/Night-Recap-November-13-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Oil caught between blockade and forecast surplus<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> WTI settled near $88.56 and Brent about $95.84. Traders weigh the Iran blockade against a forecast global surplus and rising US inventories.<br><strong>Why it matters:<\/strong> Energy prices feed directly into the inflation that is driving the rate-hike path.<br><strong>Sources:<\/strong> <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a>, <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Dollar near 19-month high, gold and Bitcoin slide<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The dollar hit about 19-month highs while gold fell roughly 2.5% and Bitcoin dropped to its lowest since August.<br><strong>Why it matters:<\/strong> Tightening financial conditions are hitting traditional and speculative havens alike.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,561.67 (-0.40%), Dow 52,347.55 (+0.10%), Nasdaq -0.91% on 13 Nov: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>WTI $88.56, Brent $95.84: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>US 10-year yield about 5.1%: <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/li><li>Bitcoin at lowest since August (no level confirmed): <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/li><li>USD/HKD and Hang Seng: not confirmed in sources found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Anthropic IPO pricing and first trade, possibly from 16 November.<\/li><li>Nvidia earnings and further news on its CEO search.<\/li><li>COP31 finance negotiations through 20 November; December Fed meeting and Iran-Gulf escalation or truce talks.<\/li><\/ul>"}];
const $ = id => document.getElementById(id);
const fmt = (d, opts) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", opts);
const long = d => fmt(d, {weekday:"short", day:"numeric", month:"short", year:"numeric"});
let idx = 0;

function pick() {
  const h = location.hash.slice(1);
  const i = DATA.findIndex(e => e.date === h);
  return i >= 0 ? i : 0;
}
function render() {
  if (!DATA.length) { $("content").innerHTML = '<div class="empty">No briefings yet. The first one arrives at 8:00 AM Hong Kong time.</div>'; return; }
  const e = DATA[idx];
  $("dateTxt").textContent = long(e.date) + (idx === 0 ? " · Latest" : "");
  $("one").innerHTML = e.line ? '<div class="oneline"><b>Today in one line</b></div>' : "";
  if (e.line) $("one").firstChild.append(e.line);
  $("content").innerHTML = e.html;
  $("older").disabled = idx >= DATA.length - 1;
  $("newer").disabled = idx <= 0;
  $("foot").textContent = DATA.length + " briefing" + (DATA.length > 1 ? "s" : "") + " saved on this device" + (navigator.onLine ? "" : " · offline");
  document.querySelectorAll("#list button").forEach((b, i) => b.classList.toggle("cur", i === idx));
  window.scrollTo(0, 0);
}
function go(i) {
  idx = Math.max(0, Math.min(DATA.length - 1, i));
  history.replaceState(null, "", idx === 0 ? location.pathname : "#" + DATA[idx].date);
  render();
}
$("list").innerHTML = DATA.map((e, i) =>
  '<li><button data-i="' + i + '"><span class="sd">' + long(e.date) + (i === 0 ? " · Latest" : "") + '</span><span class="sl"></span></button></li>').join("");
document.querySelectorAll("#list .sl").forEach((s, i) => s.textContent = DATA[i].line);
const toggle = on => $("sheetWrap").classList.toggle("open", on);
$("dateBtn").onclick = () => toggle(true);
$("sheetBg").onclick = () => toggle(false);
$("list").onclick = ev => { const b = ev.target.closest("button"); if (b) { toggle(false); go(+b.dataset.i); } };
$("older").onclick = () => go(idx + 1);
$("newer").onclick = () => go(idx - 1);
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(idx + 1); if (e.key === "ArrowRight") go(idx - 1); if (e.key === "Escape") toggle(false); });
window.addEventListener("hashchange", () => { idx = pick(); render(); });
addEventListener("online", render); addEventListener("offline", render);
idx = pick(); render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
