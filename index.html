are still hunting two suspects.<br><strong>Why it matters:<\/strong> It is a nightlife-safety case that has drawn attention beyond Hong Kong.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347398/Night-Recap-November-3-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Abby Choi trial: Alex Kwong collected watches and HK$1.4 million hours after she was reported missing<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The High Court heard that Alex Kwong Kong-chi retrieved luxury timepieces and HK$1.4 million in cash from a Kowloon watch dealer just hours after learning his former wife, socialite Abby Choi, had been reported missing to police.<br><strong>Why it matters:<\/strong> The evidence goes to the defendants' conduct in the days after the killing.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347398/Night-Recap-November-3-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">John Lee says Hong Kong remains a central hub for global finance<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Chief Executive John Lee said at the Global Financial Leaders' Investment Summit that Hong Kong remains a central hub for global finance.<br><strong>Why it matters:<\/strong> It restates the government's pitch to global investors.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347398/Night-Recap-November-3-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Baidu's Kunlunxin may delay Hong Kong IPO to next year<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Baidu's AI chip unit Kunlunxin may delay its Hong Kong IPO to next year while it waits for approval from Chinese securities regulators, Bloomberg reported (unconfirmed).<br><strong>Why it matters:<\/strong> It affects the city's tech-listing pipeline.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347398/Night-Recap-November-3-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Aviation academy plans low-altitude economy training centre<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hong Kong International Aviation Academy plans a low-altitude economy training centre to meet demand for specialised pilots and maintenance staff.<br><strong>Why it matters:<\/strong> It supports the government's low-altitude economy push.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347398/Night-Recap-November-3-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Hong Kong-Shenzhen Innovation and Technology Park pitched as global tech hub<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Officials described the park as a target global technology hub, speaking at a Fintech Week forum.<br><strong>Why it matters:<\/strong> It is a core project of the Northern Metropolis plan.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347398/Night-Recap-November-3-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,525.97 (3 Nov close, from the next day's report) - <a href=\"https://news.futunn.com/en/post/1003379723/hong-kong-stock-market-close-nov-4-hang-seng-index\" target=\"_blank\" rel=\"noopener\">Futu News<\/a><\/li><li>HIBOR, USD/HKD and weather: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Police hunt for the two DJ Mao case suspects.<\/li><li>Hang Seng reaction to US midterm results.<\/li><li>Continuing Abby Choi trial.<\/li><\/ul>"}}}];
const $ = id => document.getElementById(id);
const fmt = (d, opts) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", opts);
const long = d => fmt(d, {weekday:"short", day:"numeric", month:"short", year:"numeric"});
const NAMES = {world: "World", us: "US", asia: "Asia", hk: "Hong Kong"};
let idx = 0;
let ed = "world";
try { ed = localStorage.getItem("ed") || "world"; } catch (e) {}
if (!NAMES[ed]) ed = "world";
const firstLine = e => (e.ed.world || Object.values(e.ed)[0] || {}).line || "";

function pick() {
  const [d, k] = location.hash.slice(1).split("/");
  if (NAMES[k]) ed = k;
  const i = DATA.findIndex(e => e.date === d);
  return i >= 0 ? i : 0;
}
function render() {
  document.querySelectorAll("#seg button").forEach(b => {
    b.classList.toggle("on", b.dataset.k === ed);
    b.disabled = !!DATA.length && !DATA[idx].ed[b.dataset.k];
  });
  $("brand").textContent = NAMES[ed] + " Top 10";
  document.title = NAMES[ed] + " Top 10";
  if (!DATA.length) { $("content").innerHTML = '<div class="empty">No briefings yet. The first one arrives at 8:00 AM Hong Kong time.</div>'; return; }
  const e = DATA[idx];
  const b = e.ed[ed];
  $("dateTxt").textContent = long(e.date) + (idx === 0 ? " · Latest" : "");
  $("one").innerHTML = b && b.line ? '<div class="oneline"><b>Today in one line</b></div>' : "";
  if (b && b.line) $("one").firstChild.append(b.line);
  $("content").innerHTML = b ? b.html : '<div class="empty">No ' + NAMES[ed] + ' list for this day. Try World.</div>';
  $("older").disabled = idx >= DATA.length - 1;
  $("newer").disabled = idx <= 0;
  $("foot").textContent = DATA.length + " day" + (DATA.length > 1 ? "s" : "") + " saved on this device" + (navigator.onLine ? "" : " · offline");
  document.querySelectorAll("#list button").forEach((b, i) => b.classList.toggle("cur", i === idx));
}
function sync() {
  const tag = (idx === 0 ? "" : DATA[idx].date) + (ed === "world" ? "" : "/" + ed);
  history.replaceState(null, "", tag ? "#" + tag : location.pathname);
}
function go(i) {
  idx = Math.max(0, Math.min(DATA.length - 1, i));
  sync(); render(); window.scrollTo(0, 0);
}
$("seg").onclick = ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  ed = b.dataset.k;
  try { localStorage.setItem("ed", ed); } catch (e) {}
  sync(); render(); window.scrollTo(0, 0);
};
$("list").innerHTML = DATA.map((e, i) =>
  '<li><button data-i="' + i + '"><span class="sd">' + long(e.date) + (i === 0 ? " · Latest" : "") + '</span><span class="sl"></span></button></li>').join("");
document.querySelectorAll("#list .sl").forEach((s, i) => s.textContent = firstLine(DATA[i]));
const toggle = on => $("sheetWrap").classList.toggle("open", on);
$("dateBtn").onclick = () => toggle(true);
$("sheetBg").onclick = () => toggle(false);
$("list").onclick = ev => { const b = ev.target.closest("button"); if (b) { toggle(false); go(+b.dataset.i); } };
$("older").onclick = () => go(idx + 1);
$("newer").onclick = () => go(idx - 1);
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(idx + 1); if (e.key === "ArrowRight") go(idx - 1); if (e.key === "Escape") toggle(false); });
window.addEventListener("hashchange", () => { idx = pick(); render(); });
addEventListener("online", render); addEventListener("offline", render);
idx = pick();
if (DATA.length && !DATA[idx].ed[ed]) ed = "world";
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
