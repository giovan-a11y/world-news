"><span class=\"num\">8<\/span><span class=\"ht\">Sonia Gandhi's memoir \"Belonging\" goes on sale in India<\/span><span class=\"cat\">Society / Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> HarperCollins India released Sonia Gandhi's 544-page memoir on 10 November after Penguin Random House India pulled out in August over proposed editorial changes. The book covers family tragedies and Congress politics; a friend of the author said the earlier publisher backed away over criticism of the BJP and RSS.<br><strong>Why it matters:<\/strong> The release revives a political fight over free expression and gives Congress a platform as it tries to regain ground.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/10/sonia-gandhi-tells-of-love-and-loss-as-india039s-congress-fights-back\" target=\"_blank\" rel=\"noopener\">The Star<\/a>, <a href=\"https://www.khaleejtimes.com/lifestyle/books/sonia-gandhi-memoir-belonging-harpercollins-india-penguin-release-date\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Iranian delegation touts \"indirect trade\" with China at Shanghai expo<\/span><span class=\"cat\">Economy / Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> At the China International Import Expo in Shanghai, an Iranian delegation that included oil company representatives said indirect trade with China had grown since the war began, SCMP reported. SCMP also said Chinese shipyards have overtaken South Korea's in the surging LNG-carrier market (single-source: unconfirmed).<br><strong>Why it matters:<\/strong> The Iran war is reshaping Asian energy flows and sanctions risk ahead of Trump's meeting with Xi.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/china\" target=\"_blank\" rel=\"noopener\">South China Morning Post China section<\/a>, <a href=\"https://www.aljazeera.com/where/china/\" target=\"_blank\" rel=\"noopener\">Al Jazeera China<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Taiwan's exports jump nearly 60% on AI demand; Taiex rallies on intervention pledge<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Taiwan's October exports rose nearly 60% year on year on AI demand, and the Taiex posted its second-largest daily point gain after an official pledge to intervene in markets, Focus Taiwan reported on 9 November. Local election campaigning is intensifying ahead of the vote.<br><strong>Why it matters:<\/strong> Taiwan is the most concentrated beneficiary of the AI hardware boom, and swings in the Taiex now move regional sentiment.<br><strong>Sources:<\/strong> <a href=\"https://focustaiwan.tw/\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a>, <a href=\"https://www.taiwannews.com.tw/\" target=\"_blank\" rel=\"noopener\">Taiwan News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Nikkei 225 about 60,400 on 10 Nov (up about 2.7%, intraday-based report) - <a href=\"https://investinglive.com/stock-market-update/nikkei-kospi-extend-rebound-as-ai-and-chip-stocks-surge-recouping-friday-s-rout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/li><li>Kospi closed 5,239.13 on 10 Nov, up 4.39% - <a href=\"https://www.koreatimes.co.kr/economy/20261110/korean-stocks-surge-over-4-as-risk-appetite-returns\" target=\"_blank\" rel=\"noopener\">Korea Times<\/a><\/li><li>Shanghai Composite about 3,654 on 11 Nov (morning) - <a href=\"https://www.bssnews.net/business/444417\" target=\"_blank\" rel=\"noopener\">BSS/AFP<\/a><\/li><li>USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Indonesia: formal acceptance of the resignation and the succession process.<\/li><li>15-17 Nov: ASEAN summit in Manila.<\/li><li>18-19 Nov: APEC in Shenzhen.<\/li><\/ul>"}, "hk": {"line": "The government approved the Northern Link Part 2 agreement at an estimated HK$86.2 billion, as the Hang Seng edged up 0.44% and a winter tourism push takes shape.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Government approves Northern Link Part 2 agreement; combined cost HK$86.2 billion<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The government approved the Northern Link Part 2 agreement, bringing the estimated cost of the combined Main Line and Spur Line to HK$86.2 billion.<br><strong>Why it matters:<\/strong> It is a major rail project underpinning the Northern Metropolis plan.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Hang Seng rises 0.44% to 24,557.04<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed at 24,557.04 on 10 November, up 108.09 points or 0.44%. The tech index rose 1.08% to 4,084.45.<br><strong>Why it matters:<\/strong> It was a modest gain after a volatile month, though rate-hike worries remain.<br><strong>Sources:<\/strong> <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-0-44-higher-at-24-557-04-points/70485793\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Hong Kong plans its most extensive winter tourism campaign<\/span><span class=\"cat\">Economy / Culture<\/span><\/h2>\n<p><strong>What happened:<\/strong> The city plans its largest-ever WinterFest, with a New Year's Eve fireworks show themed on its 30th anniversary. A Symphony of Lights is preparing for a final bow.<br><strong>Why it matters:<\/strong> It supports tourism and retail spending into the year-end season.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Cold snap to last only days<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Observatory said the chill would last only days, with temperatures climbing back to 29 degrees next week. A cold front dropped temperatures by about 9 degrees around 9 November.<br><strong>Why it matters:<\/strong> It affects commuters and seasonal health demand.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/348005/Morning-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard morning recap<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Juror discharged in Abby Choi murder trial<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A juror was discharged from the trial of Abby Choi's murder, leaving eight panel members as proceedings entered their 34th day in the High Court.<br><strong>Why it matters:<\/strong> The case is the city's most closely followed murder trial.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Dozens rescued after Ocean Park observation tower breaks down again<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> About 40 visitors were stranded when the Ocean Park Tower stalled near its top (earlier reported 9 November recap); HKFP reported dozens rescued after it broke down again.<br><strong>Why it matters:<\/strong> Repeated failures raise safety questions at a major attraction.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347972/Night-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Housing provider apologises over fire drill for Wang Fuk Court survivors<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> A housing provider apologised over a fire drill held for Wang Fuk Court survivors.<br><strong>Why it matters:<\/strong> The insensitivity touches survivors of the Tai Po fire (single source, unconfirmed).<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Independent book fair complains after exhibitors barred<\/span><span class=\"cat\">Culture<\/span><\/h2>\n<p><strong>What happened:<\/strong> An independent book fair complained after exhibitors were barred under \"force majeure\"; it urged transparency.<br><strong>Why it matters:<\/strong> It feeds the debate over cultural space in the city.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hong Kong prepares for APEC delegates transiting to Shenzhen<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Hong Kong is preparing for delegates transiting to the APEC leaders' meeting in Shenzhen on 18-19 November.<br><strong>Why it matters:<\/strong> It brings security, traffic and business attention to the city.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">HKFP monthly national security explainer (month 76)<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> HKFP published its monthly national security explainer, the 76th (headline only).<br><strong>Why it matters:<\/strong> It tracks ongoing national-security enforcement.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 24,557.04 (10 Nov), up 0.44% - <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-0-44-higher-at-24-557-04-points/70485793\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/li><li>Hang Seng Tech 4,084.45, up 1.08%<\/li><li>Weather: temperatures to return to about 29 degrees next week (Observatory).<\/li><li>HIBOR and USD/HKD: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>18-19 Nov: APEC in Shenzhen.<\/li><li>Winter tourism campaign launch.<\/li><li>Continuing Abby Choi trial.<\/li><\/ul>"}}}, {"date": "2026-11-10", "ed": {"world": {"line": "Trump called the Iran war \"effectively over\" while keeping the Hormuz blockade, Wall Street bounced from its AI sell-off even as Nvidia sank on its CEO probe, and the COP31 climate summit opened in Turkey.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump calls the Iran war \"effectively over\" after meeting Qatar's prime minister<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> After talks in Washington with Qatar's prime minister on 9 November, Trump said he would hold off new strikes for now, after appeals from regional states, and called the war militarily effectively over, while keeping the Strait of Hormuz blockade. Iranian officials dismissed the claim as \"fake news\"; Rubio said a breakthrough was not imminent and rejected Iran's truce terms as unrealistic. US strikes on Iran's Qeshm island were confirmed earlier in the week.<br><strong>Why it matters:<\/strong> Whether pauses turn into a deal decides if one of the world's key oil routes reopens or fighting resumes.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/9/trump-calls-iran-war-effectively-over-after-talks-with-qatar-pm\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://al-monitor.com/originals/2026/11/trump-says-he-will-hold-fresh-iran-strikes-now\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.khaleejtimes.com/world/trump-meet-qatar-pm-iran-war-peace-deal-doubts\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Wall Street rebounds from AI rout as oil falls<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> US stocks rose on 9 November, with all 11 S&amp;P 500 sectors higher; the S&amp;P 500 bounced from its biggest weekly drop since April 2025 and the chip index jumped 6.9%, its best day since late July. A drop in oil prices eased inflation fears, and Morgan Stanley and UBS called the previous week's AI sell-off overdone.<br><strong>Why it matters:<\/strong> The rebound followed a sell-off triggered by fears that Democratic midterm gains could bring tougher regulation of AI and data centres.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/09/breaking-news/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / Reuters<\/a>, <a href=\"https://www.thestandard.com.hk/finance/article/347996/Wall-St-jumps-back-as-oil-slide-eases-inflation-worries-Nvidia-slumps\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Nvidia drops about 4-5% as board probes CEO Jensen Huang<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia fell roughly 4.2% to 5.6% (sources differ) to its lowest since April, after its board opened an independent investigation on 8 November into reports that Huang was targeted by a foreign intelligence effort. Huang admitted an extramarital affair; the board hired outside counsel, says it has confidence in him and has \"no reason to believe\" secrets were compromised. Claims of a link to an alleged Chinese-intelligence-linked executive are unconfirmed.<br><strong>Why it matters:<\/strong> Nvidia is the AI trade's anchor, and the probe lands nine days before its earnings.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/economy/2026/11/9/nvidia-shares-slump-amid-investigation-into-ceo-jensen-huang\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://thenextweb.com/news/nvidia-board-jensen-huang-inquiry-directors-succession\" target=\"_blank\" rel=\"noopener\">The Next Web<\/a>, <a href=\"https://fool.com/investing/2026/11/09/why-nvidia-stock-was-down-today\" target=\"_blank\" rel=\"noopener\">Motley Fool<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">COP31 climate summit opens in Antalya<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The UN climate conference opened on 9 November in Antalya, Turkey, and runs to 20 November, with a Turkey-Australia co-presidency and a focus on turning pledges into action. Climate finance sparked an early fight, UN chief Guterres told leaders to \"get serious\", and scientists warn 2026 may be among the hottest years on record. The US sent no official delegation.<br><strong>Why it matters:<\/strong> Finance for poorer countries is the central test, with the US absent.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a>, <a href=\"https://www.wam.ae/en/article/c363e0p-cop31-opens-antalya-with-hopes-turn-climate\" target=\"_blank\" rel=\"noopener\">WAM<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Anthropic set to start record IPO roadshow<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic was reported to be starting its IPO roadshow in the week of 9 November, targeting a Nasdaq debut under \"ANT\" before Thanksgiving, at a valuation talked up to around $2 trillion. Pricing details were not yet public as of that date.<br><strong>Why it matters:<\/strong> It could be among the largest listings ever and a test of AI valuations after the sell-off.<br><strong>Sources:<\/strong> <a href=\"https://www.implicator.ai/anthropic-could-start-ipo-roadshow-week-of-nov-9-putting-debut-before-thanksgiving/\" target=\"_blank\" rel=\"noopener\">Implicator.ai<\/a>, <a href=\"https://cryptobriefing.com/anthropic-ipo-mid-november-2-trillion/\" target=\"_blank\" rel=\"noopener\">Crypto Briefing<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Democratic midterm sweep reshapes US politics and tech outlook<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrats won a sweeping victory in the 3 November midterms, in reporting from Reuters, driving worries on Wall Street about regulation of AI and data centres. Canada's prime minister said Trump remains central to trade talks despite the result.<br><strong>Why it matters:<\/strong> A divided Washington changes the odds on tariffs, tech rules and spending over the next two years.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/09/breaking-news/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / Reuters<\/a>, <a href=\"https://www.bostonglobe.com/world/?p1=BGMenu_Sections\" target=\"_blank\" rel=\"noopener\">Boston Globe<\/a> (second item single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Bitcoin slides under $74,000; gold holds above $4,100<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bitcoin struggled to recover from a weekend sell-off that pushed it below $74,000, as traders priced a likely December Fed rate hike. Gold extended a recovery above $4,100.<br><strong>Why it matters:<\/strong> It shows rate-hike expectations weighing on speculative assets while gold stabilises.<br><strong>Sources:<\/strong> <a href=\"https://news.bitcoin.com/price-predictions/cathie-wood-gold-going-down-bitcoin/\" target=\"_blank\" rel=\"noopener\">Bitcoin.com<\/a>, <a href=\"https://biztoc.com/x/fde3c701edc1da19\" target=\"_blank\" rel=\"noopener\">BizToc / Yahoo Finance<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this species and still a WHO emergency.<br><strong>Why it matters:<\/strong> High fatality and regional spread risk strain health systems.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hong Kong shares dip on Fed hike worries<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng index closed 0.13% lower at 24,448.95 on 9 November after opening higher, with concern about further US rate hikes cited.<br><strong>Why it matters:<\/strong> Hong Kong's dollar peg ties its rates and markets to US policy.<br><strong>Sources:<\/strong> <a href=\"https://minkabu.jp/news/4655145\" target=\"_blank\" rel=\"noopener\">Fisco via Minkabu<\/a>, <a href=\"https://www.chinadailyhk.com/article/642415\" target=\"_blank\" rel=\"noopener\">China Daily HK / Xinhua<\/a> (single-source close, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Russia-Ukraine talks due in Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US-brokered talks between Russia and Ukraine, their first trilateral round since February, were set to open in Abu Dhabi on 10 November with envoys Witkoff and Kushner involved. No outcomes were known as of 9 November.<br><strong>Why it matters:<\/strong> A restart of negotiations could open a path toward ending the war, though gaps on territory and security guarantees remain large.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 24,448.95 (-0.13%) on 9 Nov: <a href=\"https://minkabu.jp/news/4655145\" target=\"_blank\" rel=\"noopener\">Fisco via Minkabu<\/a><\/li><li>Chip index +6.9%; S&amp;P 500 rebounded on 9 Nov (index levels not confirmed): <a href=\"https://www.staradvertiser.com/2026/11/09/breaking-news/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">Star-Advertiser / Reuters<\/a><\/li><li>Bitcoin below $74,000, gold above $4,100: <a href=\"https://news.bitcoin.com/price-predictions/cathie-wood-gold-going-down-bitcoin/\" target=\"_blank\" rel=\"noopener\">Bitcoin.com<\/a><\/li><li>Oil fell on 9 Nov; settlement levels not confirmed.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>US October inflation report on 10 November and its effect on Fed rate bets.<\/li><li>Abu Dhabi Russia-Ukraine talks and any Iran diplomacy.<\/li><li>Nvidia probe developments ahead of 17 November earnings; Anthropic roadshow.<\/li><\/ul>"}, "us": {"line": "Stocks surged as oil fell, Nvidia's board probe of its CEO deepened, and Stephen Miller took over as White House chief of staff as Massie moved to impeach Hegseth.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Wall Street rebounds sharply as oil slides<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Monday the Dow rose about 1,104 points (2.15%) to 52,389.75, the S&amp;P 500 gained about 2.3% to 7,549.94 and the Nasdaq jumped 2.74% to 25,253.14, pulling it out of correction territory. WTI crude fell about 4.2% to roughly $87. All 11 S&amp;P sectors rose, though Nvidia fell about 4.2% to its lowest since 7 April.<br><strong>Why it matters:<\/strong> The rally recovered most of the prior week's post-election AI selloff, but analysts called it fragile ahead of Tuesday's inflation data.<br><strong>Sources:<\/strong> <a href=\"https://gvwire.com/2026/11/09/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">GV Wire (AP)<\/a>, <a href=\"https://www.nst.com.my/amp/business/corporate/2026/11/1574335/wall-street-jumps-oil-slide-cools-inflation-worries-nvidia\" target=\"_blank\" rel=\"noopener\">NST / Reuters<\/a>, <a href=\"https://www.tradingnews.com/news/sp500-hirts-7517-nasdaq-jumps-578-points-dow-climbs-to-52139\" target=\"_blank\" rel=\"noopener\">Trading News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Nvidia investigates CEO Jensen Huang over alleged foreign intelligence targeting<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia's board opened an investigation into whether Huang was the target of a \"foreign intelligence effort\" after he acknowledged an extramarital affair. Shares fell sharply, with estimates of lost market value near $192 billion in one session. The company says he remains committed to the job, and Trump called him an \"honorable man\".<br><strong>Why it matters:<\/strong> The world's most valuable AI chip company faces a governance crisis ahead of its 17 November earnings.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/economy/2026/11/9/nvidia-shares-slump-amid-investigation-into-ceo-jensen-huang\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://axios.com/2026/11/08/nvidia-ceo-jensen-huang-admits-affair-board-to-launch-investigation\" target=\"_blank\" rel=\"noopener\">Axios<\/a>, <a href=\"https://www.foxcarolina.com/2026/11/09/nvidia-investigates-whether-ceo-jensen-huang-was-targeted-by-chinese-spy-with-whom-he-had-an-affair/\" target=\"_blank\" rel=\"noopener\">Fox Carolina (AP)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Massie moves to impeach Hegseth over the Iran war<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Rep. Thomas Massie filed a privileged resolution with eight articles of impeachment against Defense Secretary Pete Hegseth as the House returned after the midterms. The first articles accuse him of waging the Iran war without authorization, and others cite Yemen and Venezuela. Hegseth, in his first Pentagon briefing since May, called it a \"political spectacle\" and said US forces remain ready to strike Iran.<br><strong>Why it matters:<\/strong> House rules force a vote within days, putting Republicans on record on war powers.<br><strong>Sources:<\/strong> <a href=\"https://wjla.com/news/nation-world/defense-secretary-pete-hegseth-holds-first-pentagon-briefing-since-may-as-rep-thomas-massie-republican-kentucky-house-impeachment-vote-nears-iran-war-gop-midterm-elections-losses-president-trump-war-powers-speaker-mike-johnson\" target=\"_blank\" rel=\"noopener\">WJLA<\/a>, <a href=\"https://www.timesofisrael.com/liveblog-november-9-2026/\" target=\"_blank\" rel=\"noopener\">Times of Israel liveblog<\/a>, <a href=\"https://www.dailyrecordnews.com/ap_news/us/ap-news-in-brief-at-9-04-p-m-est/article_a4e77958-c3a5-5a7e-9fda-9720ea041a0c.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Trump says Iran war is \"militarily effectively over\" but US is \"locked and loaded\"<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> After talks with Qatar's prime minister, Trump said the war is effectively over militarily while keeping the situation at the \"status quo\" at the behest of Iran's neighbors. Reuters, citing US officials, reports he has received conflicting advice, with Vance and Witkoff backing diplomacy and Hegseth and Adm. Brad Cooper favoring a return to major combat. Cooper ordered a new Task Force Iron Gate to disrupt Iranian arms and illicit revenue flows.<br><strong>Why it matters:<\/strong> A decision between renewed strikes and talks will drive oil prices and troop risk.<br><strong>Sources:<\/strong> <a href=\"https://saudigazette.com.sa/article/666130/world/iran-war-effectively-over-trump-says-after-talks-with-qatar-pm\" target=\"_blank\" rel=\"noopener\">Saudi Gazette<\/a>, <a href=\"https://www.freepressjournal.in/world/trump-says-iran-war-is-militarily-effectively-over-but-warns-us-remains-locked-and-loaded\" target=\"_blank\" rel=\"noopener\">Free Press Journal<\/a>, <a href=\"https://www.legion.org/information-center/news/security/2026/november/five-things-to-know-nov-9-2026\" target=\"_blank\" rel=\"noopener\">American Legion summary<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Stephen Miller takes over as White House chief of staff<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Miller, the architect of Trump's mass-deportation push, replaced Susie Wiles as chief of staff on Monday after Trump announced the move on 6 November. Wiles will move to Trump's political operation. Democratic leaders including Rep. Robert Garcia and Sen. Angela Alsobrooks sharply criticized the choice.<br><strong>Why it matters:<\/strong> The shake-up comes days after Republicans lost Congress and signals a harder line on immigration and the coming oversight fights.<br><strong>Sources:<\/strong> <a href=\"https://www.ctvnews.ca/world/article/trump-replaces-susie-wiles-with-stephen-miller-as-chief-of-staff-after-gops-midterm-defeat/\" target=\"_blank\" rel=\"noopener\">CTV News<\/a>, <a href=\"https://aljazeera.com/news/2026/11/6/who-is-stephen-miller-trumps-new-white-house-chief-of-staff\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.democracynow.org/2026/11/9/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Democrats' House majority grows as Trump renews fraud claims [Politics] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democracy Now, relaying vote tallies, says Democrats can now claim 254 House seats to Republicans' 162 with 19 races yet to be decided. The Times of Israel liveblog says Trump has renewed baseless allegations of voter fraud, questioning the legitimacy of the elections.<br><strong>Why it matters:<\/strong> The scale of the Democratic win shapes oversight, funding and war-powers fights from January.<br><strong>Sources:<\/strong> <a href=\"https://www.democracynow.org/2026/11/9/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a>, <a href=\"https://www.timesofisrael.com/liveblog-november-9-2026/\" target=\"_blank\" rel=\"noopener\">Times of Israel liveblog<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">FDA orders vision-loss warning on GLP-1 weight-loss and diabetes drugs<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> The FDA said all GLP-1 drugs, including Ozempic, Wegovy, Mounjaro and Zepbound, must carry a warning about a rare eye condition called NAION that can cause sudden vision loss. One report put the rate at about 6.4 per 100,000 users a year versus 3.8 for comparison groups, and a causal link has not been established.<br><strong>Why it matters:<\/strong> Millions of Americans use these drugs, so the label change affects prescribing and patient counseling.<br><strong>Sources:<\/strong> <a href=\"https://drugwatch.com/news/2026/11/09/fda-adds-vision-loss-warning-to-all-glp-1-drugs/\" target=\"_blank\" rel=\"noopener\">Drugwatch<\/a>, <a href=\"https://www.powershealth.org/about-us/newsroom/health-library/2026/11/10/rare-eye-condition-prompts-new-fda-warning-on-popular-glp-1-drugs\" target=\"_blank\" rel=\"noopener\">Powers Health<\/a>, <a href=\"https://www.fox5ny.com/news/what-is-naion-ozempic-wegovy-other-glp-1s-linked-rare-eye-condition\" target=\"_blank\" rel=\"noopener\">Fox 5 NY<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Ohio State suspends fraternity over video of men on fire<\/span><span class=\"cat\">Crime / Campus<\/span><\/h2>\n<p><strong>What happened:<\/strong> Ohio State placed its Sigma Alpha Epsilon chapter on interim suspension after a video from Saturday showed a crowd laughing as one man's sweatpants caught fire and then a second man's clothing ignited. Both men had moderate injuries, and police reportedly are looking at hazing charges. How the fraternity is linked to the incident is unclear.<br><strong>Why it matters:<\/strong> The case revives scrutiny of fraternity hazing as the university and Columbus police investigate.<br><strong>Sources:<\/strong> <a href=\"https://www.kold.com/2026/11/09/ohio-state-suspends-fraternity-while-investigating-video-showing-men-engulfed-flames/?outputType=amp\" target=\"_blank\" rel=\"noopener\">KOLD (AP)<\/a>, <a href=\"https://www.inquirer.com/news/nation-world/fraternity-suspend-ohio-state-video-men-fire-sigma-alpha-epsilon-20261110.html\" target=\"_blank\" rel=\"noopener\">Philadelphia Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Senate advances sweeping permitting reform vehicle<\/span><span class=\"cat\">Congress<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Senate invoked cloture 73-25 on the motion to proceed to H.R. 2347, the legislative vehicle for permitting reform, after Majority Leader Thune filed cloture the prior week.<br><strong>Why it matters:<\/strong> It is one of the few bipartisan items moving before the lame-duck session and the 11 December funding deadline.<br><strong>Sources:<\/strong> <a href=\"https://www.dailypress.senate.gov/monday-november-9-2026/\" target=\"_blank\" rel=\"noopener\">Senate Daily Press, 9 Nov<\/a>, <a href=\"https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00257.htm\" target=\"_blank\" rel=\"noopener\">Senate roll call vote 257<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Cleanup after record flooding in the South and Southwest<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> The National Weather Service described a catastrophic 1-in-1,000-year flood along the Tennessee-Georgia line on 5-6 November, with up to 12 inches of rain in under 24 hours. Earlier flooding hit Arizona, Utah, New Mexico and Colorado, where Pagosa Springs began cleaning up. The Storm Prediction Center forecast no severe storm areas on Monday.<br><strong>Why it matters:<\/strong> Recovery is beginning for communities hit by a cross-country storm that affected more than 120 million people.<br><strong>Sources:<\/strong> <a href=\"https://www.foxweather.com/extreme-weather/video-photo-flood-cross-country-storm-southwest-florida-southeast-northeast\" target=\"_blank\" rel=\"noopener\">Fox Weather<\/a>, <a href=\"https://www.claimspages.com/news/catastrophic-flash-flooding-hits-georgia-and-tennessee-as-storm-moves-east-20261106/\" target=\"_blank\" rel=\"noopener\">Claims Pages<\/a>, <a href=\"https://www.adn.com/nation-world/2026/11/03/receding-floodwaters-leave-sea-of-mud-and-shattered-homes-in-the-southwest/\" target=\"_blank\" rel=\"noopener\">ADN (AP)<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Monday 9 Nov close): 7,549.94, up about 2.3% - <a href=\"https://www.tradingnews.com/news/sp500-hirts-7517-nasdaq-jumps-578-points-dow-climbs-to-52139\" target=\"_blank\" rel=\"noopener\">Trading News<\/a><\/li><li>Nasdaq Composite: 25,253.14, up 2.74% - <a href=\"https://www.thestar.com.my/news/world/2026/11/10/us-stocks-close-higher\" target=\"_blank\" rel=\"noopener\">The Star / Reuters<\/a><\/li><li>10-year Treasury yield: not found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>October inflation data and Fed rate-hike pricing.<\/li><li>House vote on the Hegseth impeachment resolution.<\/li><li>US-Russia-Ukraine talks opening in Abu Dhabi.<\/li><\/ul>"}, "asia": {"line": "Asian tech stocks rebound after a brutal week, New Zealand's knife-edge election stays unresolved, and China's factory prices surge while consumers stay cautious.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Asian stocks rebound after tech rout; Nikkei up 2.3%<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Monday the Nikkei 225 rose 2.33% after plunging about 6% on Friday, while Kospi, which fell about 9% on Friday, gave up early gains and ended down 0.8% and the Hang Seng dipped 0.22%. The selloff followed a $2.5 trillion Wall Street drop after US midterm results raised fears that Democratic-led legislatures could slow AI data-centre rollouts.<br><strong>Why it matters:<\/strong> Asia's AI-heavy indexes are now moving on US political risk as well as earnings, and volatility is extreme.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/economy/2026/11/9/asian-stock-markets-climb-after-earlier-tech-rout\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.malaymail.com/amp/news/money/2026/11/10/tech-leads-asian-stock-rally-as-traders-track-wall-street-rebound/242685\" target=\"_blank\" rel=\"noopener\">Malay Mail<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Taiex surges 4.9% after Taiwan activates market stabilisation fund<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Taiwan's stock market posted its second-largest daily point gain on Monday, with the Taiex rising 1,960 points, or 4.94%, to 41,661.70 after authorities authorised intervention on Friday. It was only the tenth time the stabilisation fund has been activated since 2000, and followed a 5.67% two-day fall tied to worries about heavy AI spending.<br><strong>Why it matters:<\/strong> The fund's use shows how seriously Taipei views the AI-driven volatility in its largest industry.<br><strong>Sources:<\/strong> <a href=\"https://focustaiwan.tw/business/202611090017\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a>, <a href=\"https://www.morningstar.com/news/dow-jones/202611081423/taiex-jumps-after-taiwan-activates-market-stabilization-fund\" target=\"_blank\" rel=\"noopener\">Morningstar / Dow Jones<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">China's factory prices jump 5.7% while consumer inflation stays weak<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> China's producer price index rose 5.7% year on year in October, the fastest since June 2022, driven partly by higher oil prices, while consumer prices rose only 0.7%, below the 0.8% forecast. Core inflation eased to 0.8%.<br><strong>Why it matters:<\/strong> Manufacturers are absorbing costs while households hold back, a squeeze that complicates Beijing's push to lift domestic demand.<br><strong>Sources:<\/strong> <a href=\"https://intelligencereport.org/2026/11/09/china-inflation-october-ppi-cpi-gap/\" target=\"_blank\" rel=\"noopener\">Intelligence Report<\/a>, <a href=\"https://investinglive.com/news/china-october-inflation-preview-cpi-seen-near-0-8-ppi-above-5/\" target=\"_blank\" rel=\"noopener\">investingLive preview<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">New Zealand's election too close to call<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> In the 7 November vote, the National-ACT-NZ First coalition held a slim majority in the preliminary count, 67 of 131 seats on one tally, with National and Labour both near 29% of the party vote. Luxon and Hipkins both declined to claim victory on election night, and official results are due on 27 November. Seat figures differ across outlets and are provisional.<br><strong>Why it matters:<\/strong> Coalition bargaining could take weeks and affects New Zealand's economic and China policy.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/news/2026/11/7/governing-party-leads-in-new-zealands-knife-edge-vote-early-results\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.washingtonpost.com/world/2026/11/07/new-zealands-election-results-are-too-close-call/\" target=\"_blank\" rel=\"noopener\">Washington Post<\/a>, <a href=\"https://en.wikipedia.org/wiki/2026_New_Zealand_general_election\" target=\"_blank\" rel=\"noopener\">Wikipedia: 2026 New Zealand general election<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Delhi Chawri Bazar building collapse toll rises to seven<\/span><span class=\"cat\">Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> The death toll from the 5 November collapse of an under-construction building in Old Delhi's Chawri Bazar reached seven after a 70-hour rescue operation, with another body recovered on Sunday. The owner and three contractors have been arrested.<br><strong>Why it matters:<\/strong> The case highlights unsafe construction in India's old city areas and pressure on municipal enforcement.<br><strong>Sources:<\/strong> <a href=\"https://swarajyamag.com/news-brief/death-toll-rises-to-seven-in-delhi-building-disaster-as-70-hour-rescue-operation-continues-in-hauz-qazi\" target=\"_blank\" rel=\"noopener\">Swarajya<\/a>, <a href=\"https://www.thehansindia.com/news/cities/new-delhi/death-toll-climbs-to-7-in-delhi-building-collapse-1140354\" target=\"_blank\" rel=\"noopener\">The Hans India<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Indonesia's wiretap scandal tests Prabowo-Jokowi alliance<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> President Prabowo sacked his chief of staff, former national police chief Listyo Sigit Prabowo, on 4 November after police arrested him and two other senior officers over alleged illegal wiretapping of the president and others. The presidential office said the conduct could amount to treason, and troops were deployed in Jakarta. Analysts link the case to a rift with former president Joko Widodo.<br><strong>Why it matters:<\/strong> The affair, followed by Vice President Gibran's expected resignation, deepens the political instability around Prabowo's government.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/news/2026/11/4/indonesian-presidents-chief-of-staff-dismissed-over-alleged\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.scmp.com/week-asia/politics/article/3373235/indonesias-prabowo-sacks-chief-staff-wiretap-scandal-tests-alliance-widodo\" target=\"_blank\" rel=\"noopener\">South China Morning Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Sonia Gandhi memoir \"Belonging\" due in India on 10 November<\/span><span class=\"cat\">Society / Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> HarperCollins India said Sonia Gandhi's 544-page memoir goes on sale on 10 November, after Penguin Random House India pulled out in August over editorial changes. A friend of the author said the earlier publisher backed away over criticism of the BJP and RSS; reports differ on the exact reason.<br><strong>Why it matters:<\/strong> The book's release revives a debate over publishing freedom and gives Congress a political talking point.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/lifestyle/books/sonia-gandhi-memoir-belonging-harpercollins-india-penguin-release-date\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://madhyamamonline.com/india/harpercollins-announces-nov-release-for-sonia-gandhis-memoir-1551558\" target=\"_blank\" rel=\"noopener\">Madhyamam<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">ASEAN headlines: Myanmar, Thailand and Australian fire support [Politics] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Regional headline digests from The Star and Bernama reported that Thailand plans talks with Myanmar over pollution in border rivers, that US strategy links Myanmar peace talks to rare-earth access, and that Australia agreed to send firefighting support to East Kalimantan, Indonesia, where forest fires are burning. Each item rests on a single digest.<br><strong>Why it matters:<\/strong> Myanmar's rare earths and Indonesia's fire season are cross-border issues ahead of the ASEAN summit.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/06/asean-news-headlines-at-10pm-on-friday-nov-6-2026\" target=\"_blank\" rel=\"noopener\">The Star: ASEAN headlines 6 Nov<\/a>, <a href=\"https://bernama.com/en/world/news.php?id=2632603\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">South Korea: President Lee's approval at 35.9% [Politics] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A poll reported on 9 November put President Lee Jae Myung's job approval at 35.9%, down one point from the same firm's survey the week before. Kyunghyang Shinmun also reported on a Cabinet meeting where Lee said migrant workers are colleagues who build industrial sites and communities.<br><strong>Why it matters:<\/strong> Lagging approval frames the fight over his legal cases and the 2027 budget.<br><strong>Sources:<\/strong> <a href=\"https://www.khan.co.kr/en/article/202611091029007\" target=\"_blank\" rel=\"noopener\">Kyunghyang Shinmun<\/a>, <a href=\"https://www.khan.co.kr/en/article/202611101449007\" target=\"_blank\" rel=\"noopener\">Kyunghyang Shinmun<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">APEC Shenzhen countdown: Xi to attend, Trump-Xi talks expected<\/span><span class=\"cat\">Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> China confirmed Xi will attend the APEC leaders' meeting in Shenzhen on 18-19 November, and Beijing said discussions on a possible Xi-Trump-Putin meeting were under way. The Korea Times reported the confirmation on 7 November.<br><strong>Why it matters:<\/strong> The summit will test the fragile post-summit trade truce and set the tone for chips, Iran and Taiwan.<br><strong>Sources:<\/strong> <a href=\"https://www.koreatimes.co.kr/world/20261107/china-confirms-discussions-underway-on-historic-xi-trump-putin-meeting\" target=\"_blank\" rel=\"noopener\">Korea Times<\/a>, <a href=\"https://en.wikipedia.org/wiki/APEC_China_2026\" target=\"_blank\" rel=\"noopener\">APEC China 2026, Wikipedia<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Nikkei 225: up 2.33% on 9 Nov after a roughly 6% fall on 6 Nov (level not confirmed) - <a href=\"https://aljazeera.com/economy/2026/11/9/asian-stock-markets-climb-after-earlier-tech-rout\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a><\/li><li>Taiex: 41,661.70 on 9 Nov, up 4.94% - <a href=\"https://focustaiwan.tw/business/202611090017\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a><\/li><li>Kospi: down 0.8% on 9 Nov (about 5,019 implied by the next day's close of 5,239.13 after a 4.39% gain) - <a href=\"https://www.koreatimes.co.kr/economy/20261110/korean-stocks-surge-over-4-as-risk-appetite-returns\" target=\"_blank\" rel=\"noopener\">Korea Times<\/a><\/li><li>Shanghai Composite and USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>New Zealand coalition talks; official count due 27 November.<\/li><li>China's trade data on 10 November.<\/li><li>Indonesia's wiretap investigation and Vice President Gibran's position.<\/li><\/ul>"}, "hk": {"line": "About 40 visitors were stranded on the Ocean Park tower, the chief executive met Asia's football chief, and a cold front dropped temperatures by about 9 degrees.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">About 40 stranded when Ocean Park Tower stalls near its top<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> About 40 people were stranded near the top of Ocean Park Tower after the ride malfunctioned on Monday afternoon. One visitor was reported to have felt unwell.<br><strong>Why it matters:<\/strong> It raises safety questions at a major attraction.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347972/Night-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Cold front drops temperatures by about 9 degrees<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> A cold front dropped temperatures by about 9 degrees around 9 November, with urban areas forecast to fall to 16 degrees on Tuesday.<br><strong>Why it matters:<\/strong> It affects commuters and seasonal health demand.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347896/Night-Recap-November-8-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/348005/Morning-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard morning recap<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">John Lee meets AFC president on bringing top matches to Hong Kong<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Chief Executive John Lee met Asian Football Confederation president Shaikh Salman bin Ebrahim Al Khalifa on Monday to discuss local football and bringing more top-tier international matches to the city.<br><strong>Why it matters:<\/strong> It supports the Kai Tak stadium's events push.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347972/Night-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Alibaba's chip unit T-Head plans Hong Kong IPO next year<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Alibaba's chip unit T-Head is planning a Hong Kong initial public offering next year, according to a report citing sources (unconfirmed).<br><strong>Why it matters:<\/strong> It would add to the city's tech-listing pipeline.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347972/Night-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Paul Chan says multinationals increasingly use Hong Kong to list and issue bonds<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> At the 2026 AFRC Regional Regulatory Forum, Financial Secretary Paul Chan cited firms from Southeast Asia, the Middle East and Central Asia using Hong Kong to list equities or issue bonds.<br><strong>Why it matters:<\/strong> It frames the government's pitch for the city as a financing hub.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347972/Night-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Government open to funding AI-generated films<\/span><span class=\"cat\">Culture<\/span><\/h2>\n<p><strong>What happened:<\/strong> Culture Secretary Rosanna Law said the government has not ruled out funding AI-generated films under the Hong Kong Film Development Fund while it reviews new technologies.<br><strong>Why it matters:<\/strong> It shapes funding rules for the local film industry.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347972/Night-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Pedestrian dies after being hit by hygiene contractor's truck in North Point<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> A 60-year-old woman died four days after being hit by a Food and Environmental Hygiene Department contractor's truck in North Point. The driver was arrested.<br><strong>Why it matters:<\/strong> It adds to concern about road safety and contractor vehicles.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347918/Morning-Recap-November-9-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hang Seng posts gains in early November<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng closed at 23,919.50 on 4 November, up 1.67%, in a week of volatile trade (Monday's close not found in my sources).<br><strong>Why it matters:<\/strong> It sets the base for the week's rate and tech risks.<br><strong>Sources:<\/strong> <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-1-67-higher-at-23-919-50/70458945\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hong Kong prepares for APEC transit delegates<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Hong Kong is preparing for delegates transiting to the APEC leaders' meeting in Shenzhen on 18-19 November, where a Trump-Xi-Putin meeting is expected.<br><strong>Why it matters:<\/strong> It brings security, traffic and business attention.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Abby Choi murder trial continues<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The High Court trial continued, with a juror discharged and proceedings entering day 34.<br><strong>Why it matters:<\/strong> The case draws intense public attention.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,919.50 (4 Nov, latest close found), up 1.67% - <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-1-67-higher-at-23-919-50/70458945\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/li><li>Weather: urban low about 16 degrees on Tuesday (forecast).<\/li><li>HIBOR and USD/HKD: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Recovery in temperature to about 29 degrees next week.<\/li><li>18-19 Nov: APEC in Shenzhen.<\/li><li>Possible T-Head IPO filing.<\/li><\/ul>"}}}, {"date": "2026-11-09", "ed": {"world": {"line": "Nvidia's board opened a probe into CEO Jensen Huang and crypto sold off over the weekend, extending a week in which Democratic midterm gains hit AI stocks, while US-Iran strikes and Qatari mediation kept Gulf tensions high.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Nvidia board opens independent investigation into CEO Jensen Huang<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> On 8 November Nvidia's board opened an independent investigation after reports that Huang was targeted by a foreign intelligence effort, the same day he admitted an extramarital affair in an email to staff. Outside counsel led by a former Manhattan acting US attorney will run the review; the board says it has confidence in Huang, who stays CEO, and has \"no reason to believe\" secrets were compromised. Reports of a link to an alleged China-linked executive are unconfirmed.<br><strong>Why it matters:<\/strong> Nvidia is the centre of the AI trade and reports quarterly results on 17 November, so leadership risk could move the whole market.<br><strong>Sources:<\/strong> <a href=\"https://thenextweb.com/news/nvidia-board-jensen-huang-inquiry-directors-succession\" target=\"_blank\" rel=\"noopener\">The Next Web<\/a>, <a href=\"https://letsdatascience.com/news/nvidia-board-opens-investigation-into-reported-foreign-intel-c5b93236\" target=\"_blank\" rel=\"noopener\">Let's Data Science<\/a>, <a href=\"https://fourweekmba.com/ai-nvidia-board-opens-independent-probe-9-days-before-results/\" target=\"_blank\" rel=\"noopener\">Four Week MBA<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US strikes on Iran's Qeshm island deepen Gulf tensions<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump confirmed new US strikes on Iran's Qeshm island in the Strait of Hormuz, calling them minor strikes on air defences, after Iranian state media reported missile hits. Reporting this week also described strikes and counter-strikes in the Gulf, with Kuwait among the places affected (details unconfirmed). The US naval blockade of Iran remains in place.<br><strong>Why it matters:<\/strong> Fighting around Hormuz threatens a large share of global oil flows and the wider ceasefire effort.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.business-standard.com/world-news/iran-strikes-kuwait-after-us-bombardments-gulf-tensions-escalate-126090300989_1.html\" target=\"_blank\" rel=\"noopener\">Business Standard<\/a> (single-source details, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Qatar's prime minister heads to Washington to push Iran diplomacy<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Qatar's prime minister, who also serves as foreign minister, was due to meet Trump and Vance on Monday after visiting Tehran the week before. Senior US and Gulf officials doubted an imminent deal; Trump also spoke with Qatar's emir about de-escalation, and Qatar has proposed a two-stage plan pairing nuclear inspections with reopening Hormuz.<br><strong>Why it matters:<\/strong> Qatar is the main channel between Washington and Tehran, so the meeting decides whether talks or strikes come next.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/world/trump-meet-qatar-pm-iran-war-peace-deal-doubts\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://www.al-monitor.com/originals/2026/11/trump-says-qatar-saudi-prefer-peace-iran-conflict\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">AI stocks suffer worst week since April 2025<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The S&amp;P 500 had its biggest weekly drop since April 2025 in the week to 6 November, with an AI-led sell-off after Democrats' sweeping midterm win fed fears of tougher regulation of AI and data centres. Morgan Stanley and UBS argued the rout was overdone and the risk of extreme regulation was low.<br><strong>Why it matters:<\/strong> AI valuations have driven much of the market's gains, so the week showed how politics can reprice the sector.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/09/breaking-news/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / Reuters<\/a>, <a href=\"https://www.fox19.com/2026/11/05/brutal-sell-off-ai-stocks-sends-wall-street-reeling-sp-500-sees-worst-day-since-2025-liberation-day-tariffs/\" target=\"_blank\" rel=\"noopener\">Fox 19 / AP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Democrats win sweeping victory in US midterms<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrats won decisively in the 3 November midterms, per Reuters reporting, winning majorities that complicate Trump's agenda in Congress. Markets reacted to the prospect of more regulation, and trade partners such as Canada say talks with Trump continue.<br><strong>Why it matters:<\/strong> A Democratic Congress changes the outlook for tariffs, oversight of AI and tech, and spending.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/09/breaking-news/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / Reuters<\/a>, <a href=\"https://www.bnnbloomberg.ca/tariffs/2026/11/04/more-intense-us-trade-negotiations-have-started-carney-says/\" target=\"_blank\" rel=\"noopener\">BNN Bloomberg<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Weekend crypto sell-off pushes Bitcoin below $74,000<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bitcoin fell below $74,000 late Sunday for the first time in weeks, briefly touching about $73,500, in a thin weekend sell-off. It sits roughly 40% below its October 2025 all-time high above $126,000. One report put the weekend wipe-out at about $290 billion in crypto market value (date unconfirmed).<br><strong>Why it matters:<\/strong> The slide reflects falling risk appetite and rate-hike worries across markets.<br><strong>Sources:<\/strong> <a href=\"https://news.bitcoin.com/market-updates/bitcoin-price-struggles-below-75k-1-2b-crypto-bets-wiped-out/\" target=\"_blank\" rel=\"noopener\">Bitcoin.com News<\/a>, <a href=\"https://businessday.ng/technology/article/cryptos-290bn-weekend-wipeout-exposes-fragile-liquidity-as-risk-appetite-cracks-across-markets/\" target=\"_blank\" rel=\"noopener\">BusinessDay<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Anthropic expected to start record IPO roadshow<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic was reported ready to start its IPO roadshow the week of 9 November, aiming to list on Nasdaq as \"ANT\" before Thanksgiving at a valuation talked of around $2 trillion. It filed its S-1 on 26 October; no price was set as of this date.<br><strong>Why it matters:<\/strong> It would be among the largest listings ever and a test of AI appetite after the sell-off.<br><strong>Sources:<\/strong> <a href=\"https://www.implicator.ai/anthropic-could-start-ipo-roadshow-week-of-nov-9-putting-debut-before-thanksgiving/\" target=\"_blank\" rel=\"noopener\">Implicator.ai<\/a>, <a href=\"https://techcrunch.com/2026/10/26/anthropic-officially-files-for-its-public-debut/\" target=\"_blank\" rel=\"noopener\">TechCrunch<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">COP31 climate summit set to open in Antalya<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> Pre-session talks ran to 8 November, and the formal COP31 conference opens on 9 November in Antalya, Turkey, running to 20 November. Turkey holds the presidency with Australia leading negotiations, and finance is the central issue. Scientists forecast 2026 as potentially the hottest year on record, with the US not expected to send officials.<br><strong>Why it matters:<\/strong> The talks shape emissions and adaptation finance for the next decade.<br><strong>Sources:<\/strong> <a href=\"https://unfccc.int/sites/default/files/resource/COP_31_Overview_Schedule.pdf\" target=\"_blank\" rel=\"noopener\">UNFCCC schedule<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this species and still a WHO emergency.<br><strong>Why it matters:<\/strong> High fatality and possible regional spread strain health systems and travel controls.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Europe tightens defences amid cyber and security alarms<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Italy's prime minister Meloni claimed a cyberattack, and Finland announced plans for anti-tank barriers on its border, in items dated 6-7 November; supermarkets across Europe have also been hit by attacks (details single-source and unconfirmed).<br><strong>Why it matters:<\/strong> Cyber and hybrid threats are pushing European governments to harden infrastructure and borders.<br><strong>Sources:<\/strong> <a href=\"https://www.business-standard.com/world-news/iran-strikes-kuwait-after-us-bombardments-gulf-tensions-escalate-126090300989_1.html\" target=\"_blank\" rel=\"noopener\">Business Standard<\/a>, <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a> (unconfirmed)<\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Bitcoin below $74,000, about 40% under its record: <a href=\"https://news.bitcoin.com/market-updates/bitcoin-price-struggles-below-75k-1-2b-crypto-bets-wiped-out/\" target=\"_blank\" rel=\"noopener\">Bitcoin.com News<\/a><\/li><li>S&amp;P 500: biggest weekly drop since April 2025 (index level not confirmed): <a href=\"https://www.staradvertiser.com/2026/11/09/breaking-news/wall-street-rallies-after-last-weeks-ai-rout-nvidia-falls/\" target=\"_blank\" rel=\"noopener\">Star-Advertiser / Reuters<\/a><\/li><li>Oil, gold and Hang Seng closes for the prior session: not confirmed in sources found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Qatar PM's meeting with Trump on 9 November and any Iran deal or strikes.<\/li><li>Nvidia probe developments ahead of 17 November earnings; US October inflation data on 10 November.<\/li><li>Anthropic IPO roadshow and COP31's opening days.<\/li><\/ul>"}, "us": {"line": "Nvidia's board opened a probe of its CEO, Democrats' midterm sweep set up early fights in Washington, and Notre Dame upset top-ranked Miami.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Nvidia board opens probe after CEO Jensen Huang admits affair<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Axios reported that Huang admitted to a relationship with a suspected Chinese spy in a message to staff, apologizing to his family and colleagues. Nvidia's board said an independent committee is investigating reports that he was targeted by a foreign intelligence effort, that it has \"no reason to believe\" national security or company secrets were compromised, and that Huang will remain CEO for now.<br><strong>Why it matters:<\/strong> Nvidia is the market's heaviest-weighted stock, so a leadership crisis could move AI valuations and US-China chip policy.<br><strong>Sources:<\/strong> <a href=\"https://axios.com/2026/11/08/nvidia-ceo-jensen-huang-admits-affair-board-to-launch-investigation\" target=\"_blank\" rel=\"noopener\">Axios<\/a>, <a href=\"https://www.foxcarolina.com/2026/11/09/nvidia-investigates-whether-ceo-jensen-huang-was-targeted-by-chinese-spy-with-whom-he-had-an-affair/\" target=\"_blank\" rel=\"noopener\">Fox Carolina (AP)<\/a>, <a href=\"https://www.dailyrecordnews.com/ap_news/us/ap-news-summary-at-6-59-a-m-est/article_532f4874-e829-5bf5-a1a0-6c29e02bf6ec.html\" target=\"_blank\" rel=\"noopener\">AP News Summary<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Midterm aftermath: Democrats win both chambers, Alaska and Mississippi still uncalled<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Meet the Press described a political earthquake not seen since the Watergate era, with Democrats seizing both the House and Senate. Alaska and Mississippi Senate races were still uncalled on Sunday. The Trump administration is appealing a judge's dismissal of a Justice Department suit seeking to block certification if Republican Sen. Dan Sullivan loses to Democrat Mary Peltola. Democrats are preparing early fights over spending, deficits, tariffs and Social Security.<br><strong>Why it matters:<\/strong> The final seat count and early Democratic priorities will shape the lame duck and the 11 December funding deadline.<br><strong>Sources:<\/strong> <a href=\"https://www.nbcnews.com/meet-the-press/transcripts/meet-press-november-8-2026-rcna608110\" target=\"_blank\" rel=\"noopener\">Meet the Press, 8 Nov<\/a>, <a href=\"https://onlabor.org/november-8-2026/\" target=\"_blank\" rel=\"noopener\">OnLabor<\/a>, <a href=\"https://www.dailyrecordnews.com/ap_news/us/ap-news-summary-at-8-47-a-m-est/article_532f4874-e829-5bf5-a1a0-6c29e02bf6ec.html\" target=\"_blank\" rel=\"noopener\">AP News Summary<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Stephen Miller set to replace Susie Wiles as chief of staff<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump announced on 6 November that Stephen Miller, the architect of his deportation campaign, would take over as chief of staff on Monday, with Susie Wiles moving to his political operation. Reports conflict over the press secretary post, with one saying Trump offered it to UFC chief Dana White and then said on Sunday he was joking.<br><strong>Why it matters:<\/strong> The shake-up follows Republican losses in the midterms and signals a harder line on immigration.<br><strong>Sources:<\/strong> <a href=\"https://www.ctvnews.ca/world/article/trump-replaces-susie-wiles-with-stephen-miller-as-chief-of-staff-after-gops-midterm-defeat/\" target=\"_blank\" rel=\"noopener\">CTV News<\/a>, <a href=\"https://baynews9.com/fl/tampa/politics/2026/11/06/president-donald-trump-susie-wiles-stephen-miller-chief-of-staff\" target=\"_blank\" rel=\"noopener\">BayNews9<\/a>, <a href=\"https://theprekend.substack.com/p/sunday-november-8th-2026\" target=\"_blank\" rel=\"noopener\">The Prekend<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Trump signals Iran fighting unlikely to resume as he prepares to host Qatar's PM<\/span><span class=\"cat\">Security / Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump told CNN over the weekend it was \"highly unlikely\" fighting with Iran would resume, and he was set to meet Qatar's prime minister, who is pushing new proposals in talks with Iran. Iran's IRGC said it has lifted its self-imposed 2,000-kilometre limit on ballistic missile range, and Saudi forces intercepted missiles aimed at Riyadh that they blamed on the Houthis.<br><strong>Why it matters:<\/strong> The mixed signals leave open whether the war moves toward a deal or another round of strikes.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/9/trump-calls-iran-war-effectively-over-after-talks-with-qatar-pm\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.starbeacon.com/region/ap-news-in-brief-at-6-04-a-m-est/article_c8c63b9d-a3ea-597b-bfed-416a85f5f55a.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Bengals beat Falcons in Madrid for first win abroad<\/span><span class=\"cat\">Sports<\/span><\/h2>\n<p><strong>What happened:<\/strong> Cincinnati beat Atlanta 34-17 at Madrid's Santiago Bernabeu, its first win outside the United States, with Joe Burrow throwing for 271 yards and three touchdowns and Ja'Marr Chase catching 10 passes for 155 yards. Elsewhere Dallas beat Indianapolis 27-23, Kansas City beat the Jets 35-12, Detroit beat Miami 19-9 and Green Bay beat New England 45-27.<br><strong>Why it matters:<\/strong> The fourth straight win for Cincinnati and the results reshape the AFC playoff picture.<br><strong>Sources:<\/strong> <a href=\"https://atozsports.com/?p=511451\" target=\"_blank\" rel=\"noopener\">A to Z Sports<\/a>, <a href=\"https://www.flashscore.com/news/american-football-nfl-nfl-roundup-joe-burrow-leads-the-bengals-in-madrid-lions-chiefs-get-to-6-2-on-the-year/ba4E6xke/\" target=\"_blank\" rel=\"noopener\">Flashscore (AP roundup)<\/a>, <a href=\"https://thesportscast.net/2026/11/09/nfl-scores-yesterday-november-8-2026-week-9-results/\" target=\"_blank\" rel=\"noopener\">The Sports Cast<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Notre Dame upsets No. 1 Miami; Georgia, Utah and Alabama win big<\/span><span class=\"cat\">Sports<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Saturday No. 11 Notre Dame beat top-ranked Miami 31-24, No. 2 Georgia beat No. 10 Ole Miss 42-7, No. 3 Utah beat No. 9 BYU 28-20 and No. 5 Alabama beat No. 14 LSU 31-13. The Notre Dame score comes from a single recap page (unconfirmed).<br><strong>Why it matters:<\/strong> Another No. 1 falling reshapes the College Football Playoff race.<br><strong>Sources:<\/strong> <a href=\"https://www.ncaa.com/live-updates/football/fbs/college-football-week-10-recaps-highlights-scores-rankings\" target=\"_blank\" rel=\"noopener\">NCAA.com recap<\/a>, <a href=\"https://www.thelines.com/ncaaf/college-football-continues-its-wild-ride-as-1-miami-falls/\" target=\"_blank\" rel=\"noopener\">The Lines<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">US measles cases top 5,000, the most in about 35 years<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> A roundup reports measles cases surpassed 5,000 in 2026, the highest in about 35 years. International health officials are due to decide next week whether the US and Mexico have lost measles-elimination status.<br><strong>Why it matters:<\/strong> The outbreak keeps pressure on vaccination policy at HHS and the CDC.<br><strong>Sources:<\/strong> <a href=\"https://theprekend.substack.com/p/sunday-november-8th-2026\" target=\"_blank\" rel=\"noopener\">The Prekend<\/a>, <a href=\"https://kffhealthnews.org/public-health/measles-free-status-us-cdc-ralph-abraham-paho-who-outbreaks-vaccines/\" target=\"_blank\" rel=\"noopener\">KFF Health News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Car strikes group of cyclists in North Carolina<\/span><span class=\"cat\">Crime / Accident<\/span><\/h2>\n<p><strong>What happened:<\/strong> A car struck a group of cyclists in North Carolina, killing one person and injuring more than a dozen others, according to a morning roundup. I could not find a second source with details (unconfirmed).<br><strong>Why it matters:<\/strong> Mass-casualty crashes involving cyclists are renewing calls for safer road design and enforcement.<br><strong>Sources:<\/strong> <a href=\"https://theprekend.substack.com/p/sunday-november-8th-2026\" target=\"_blank\" rel=\"noopener\">The Prekend<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Administration moves to lift logging and roadbuilding bans in national forests<\/span><span class=\"cat\">Policy / Environment<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Trump administration moved to lift bans on roadbuilding and logging in national forests, according to a Sunday roundup. A separate court ruling partially invalidated a Labor Department rule on domestic-worker wages and restrained the administration from threatening to prosecute election officials.<br><strong>Why it matters:<\/strong> The changes would open large tracts of federal land to timber and mining while environmental groups prepare court challenges.<br><strong>Sources:<\/strong> <a href=\"https://theprekend.substack.com/p/sunday-november-8th-2026\" target=\"_blank\" rel=\"noopener\">The Prekend<\/a>, <a href=\"https://onlabor.org/november-8-2026/\" target=\"_blank\" rel=\"noopener\">OnLabor<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">US homelessness records largest drop in more than a decade<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Homelessness fell by the largest amount in more than a decade last year, though roughly 700,000 people remain unhoused, according to a Sunday roundup.<br><strong>Why it matters:<\/strong> The data will feed the debate between housing-first and enforcement approaches as cities face budget pressure.<br><strong>Sources:<\/strong> <a href=\"https://theprekend.substack.com/p/sunday-november-8th-2026\" target=\"_blank\" rel=\"noopener\">The Prekend<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Friday 6 Nov close, week down 2.7%): 7,376.86 - <a href=\"https://thriveinmarkets.com/market-insights/weekend-recap-2026-11-08/\" target=\"_blank\" rel=\"noopener\">Thrive in Markets<\/a><\/li><li>Nasdaq Composite: 24,579.42, down 3.37% on the week - <a href=\"https://www.lpl.com/research/blog/weekly-market-performance-november-6-2026.html\" target=\"_blank\" rel=\"noopener\">LPL Research<\/a><\/li><li>10-year Treasury yield: not found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Nvidia's board investigation and Monday trading reaction.<\/li><li>Trump's meeting with Qatar's prime minister and any Iran proposal.<\/li><li>Massie's expected move to impeach Defense Secretary Hegseth.<\/li><\/ul>"}, "asia": {"line": "New Zealand's tight election count and Taiwan's market-rescue fund headline a weekend of fragile Asian markets, ahead of ASEAN and APEC diplomacy.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">New Zealand's coalition clings to a slim majority after knife-edge vote<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Preliminary counting on Sunday showed the National-ACT-NZ First coalition with 67 seats against 57 for Labour, the Greens and Te Pati Maori, a majority of just two on one tally. Prime Minister Luxon declared a mandate but conceded the result remained too close to call definitively; special votes are still to be counted, with official results due on 27 November.<br><strong>Why it matters:<\/strong> Weeks of coalition bargaining could follow in a country whose government sets policy on China, trade and housing.<br><strong>Sources:<\/strong> <a href=\"https://www.malaymail.com/amp/news/world/2026/11/08/who-will-govern-new-zealand-tight-election-result-opens-door-to-dealmaking/242459\" target=\"_blank\" rel=\"noopener\">Malay Mail<\/a>, <a href=\"https://cambodianess.com/article/new-zealand-poised-for-weeks-of-political-wrangling-after-knife-edge-poll\" target=\"_blank\" rel=\"noopener\">Cambodianess<\/a>, <a href=\"https://www.chinadailyhk.com/article/642382\" target=\"_blank\" rel=\"noopener\">China Daily HK<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Taiwan activates market stabilisation fund after AI-led rout<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The management committee of Taiwan's National Financial Stabilization Fund authorised market intervention on Friday after the Taiex fell 1,873 points, or 4.51%, to close below 40,000, part of a 5.67% two-day drop on worries over heavy AI spending. Dow Jones reported the index jumped once the fund was activated. It was the tenth activation since 2000.<br><strong>Why it matters:<\/strong> The intervention shows how exposed Taiwan's economy is to the AI-chip trade and sets up Monday's session as a test of confidence.<br><strong>Sources:<\/strong> <a href=\"https://www.morningstar.com/news/dow-jones/202611081423/taiex-jumps-after-taiwan-activates-market-stabilization-fund\" target=\"_blank\" rel=\"noopener\">Morningstar / Dow Jones<\/a>, <a href=\"https://focustaiwan.tw/business/202611060020\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a><\/p>\n<h2 class=\"story\
