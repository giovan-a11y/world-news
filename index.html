(down 0.98%). Stronger US inflation and hawkish Fed signals raised expectations of further rate hikes.<br><strong>Why it matters:<\/strong> Hong Kong rates follow US rates under the peg, so higher US rates hit stocks and property.<br><strong>Sources:<\/strong> <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a>, <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-at-24-315-92-down-0-98-percent/70494407\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Alphabet's first HK and Singapore dollar bonds draw about US$5 billion in orders<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Alphabet's first Hong Kong and Singapore dollar bond sales drew about US$5 billion in early orders.<br><strong>Why it matters:<\/strong> It shows international appetite for Hong Kong-dollar debt.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348346/Night-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Kai Tak Hospital site team leader charged over bribes<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A team leader at the Kai Tak Hospital site was charged over HK$75,000 in bribes allegedly taken from imported workers.<br><strong>Why it matters:<\/strong> It touches the labour-importation scheme and a major public project.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348346/Night-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Sex offences reform bill due to be gazetted Friday<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> A long-awaited sex offences reform bill is due to be gazetted on Friday (unconfirmed, single source).<br><strong>Why it matters:<\/strong> It would be a major update to the city's criminal law.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Civil servants to get up to 12 hours of family care leave<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Government workers will get up to 12 hours of annual family care leave from January.<br><strong>Why it matters:<\/strong> It may set a benchmark for private employers.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Immigration disputes reports on Japanese adult performers<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Immigration disputed reports that nearly 30 Japanese adult performers were denied entry and an expo was cancelled.<br><strong>Why it matters:<\/strong> It touches the city's image as an events hub and border-control practices.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Police question two Catholic churches over Tai Po fire memorial masses<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Police reportedly questioned two Catholic churches over memorial masses for the Tai Po fire (unconfirmed, single source).<br><strong>Why it matters:<\/strong> It raises questions about public mourning and policing.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Abby Choi trial: Anthony Kwong accuses brother; juror discharged<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> In the High Court on day 34 of the trial, Anthony Kwong testified in tears that his younger brother Alex Kwong was responsible. A juror was discharged earlier, leaving eight.<br><strong>Why it matters:<\/strong> It is the city's most closely followed murder trial.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Showers, thunderstorms and a sharp temperature drop ahead<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> The outlook called for showers and thunderstorms, then a sharp drop in temperatures.<br><strong>Why it matters:<\/strong> It affects commuters and outdoor weekend plans.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348346/Night-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng: 24,315.92 on 11 Nov; down 1.26% on 12 Nov (about 24,009, derived from later reports) - <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-at-24-315-92-down-0-98-percent/70494407\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/li><li>HIBOR, USD/HKD and exact weather figures: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Gazetting of the Education (Amendment) Bill and the sex offences bill.<\/li><li>17 Nov: Nvidia earnings; 18 Nov: FOMC minutes.<\/li><li>18-19 Nov: APEC in Shenzhen.<\/li><\/ul>"}}}, {"date": "2026-11-12", "ed": {"world": {"line": "AI stocks rebounded on Wall Street while Nvidia's CEO probe deepened, as Russia and Ukraine held their first direct talks in nine months and Trump held off new Iran strikes but kept the blockade.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Russia and Ukraine hold first trilateral talks in nine months<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US-mediated talks opened in Abu Dhabi on 10 November, with envoys Witkoff and Kushner present, Ukraine's team led by Rustem Umerov and Russia's by Medinsky. The first session lasted about four hours and the two-day round ended 11 November; Rubio said the talks looked \"very productive\" but urged patience. Territory and security guarantees remain the main disputes.<br><strong>Why it matters:<\/strong> It is the first direct diplomatic opening on the war since February, though no ceasefire or deal has been announced.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.dailysabah.com/world/europe/russia-ukraine-resume-us-mediated-peace-talks-after-9-months/amp\" target=\"_blank\" rel=\"noopener\">Daily Sabah<\/a>, <a href=\"https://www.inquirer.com/news/nation-world/russia-ukraine-peace-talks-abu-dhabi-putin-zelesnky-kushner-trump-20261110.html\" target=\"_blank\" rel=\"noopener\">Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Trump holds off new Iran strikes but keeps the naval blockade<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> After meeting Qatar's prime minister, Trump said he would hold off on new strikes for now and keep the Hormuz-area naval blockade in place, claiming Gulf states prefer the status quo. He also said Iran's military is effectively finished, which Iranian officials rejected; Tehran says no deal is possible unless the blockade is lifted. Qatar has proposed a 48-hour, two-stage plan combining nuclear inspections with reopening the Strait of Hormuz.<br><strong>Why it matters:<\/strong> The standoff keeps a major share of the world's oil trade at risk, with talks stalled between sharply different terms.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/gulf/trump-uae-qatar-saudi-arabia-iran-conflict-hormuz-blockade\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://www.aljazeera.com/news/liveblog/2026/11/9/iran-war-live-trump-says-war-effectively-over-iran-demands-surrender\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://dropsitenews.com/p/trump-says-iran-war-militarily-is\" target=\"_blank\" rel=\"noopener\">Dropsite News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Rebounding AI stocks lift Wall Street<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> AP reported the S&amp;P 500 up 1.6% and the Nasdaq up 2.2% on 11 November as AI-linked shares recovered from the previous sell-off; CoreWeave jumped about 26%. Breadth was weak, with more S&amp;P stocks falling than rising. Other recaps give smaller gains, so exact levels are unconfirmed. The bond market was closed for Veterans Day.<br><strong>Why it matters:<\/strong> The rebound followed the worst day for US stocks since 2025 and shows how sensitive markets are to AI sentiment.<br><strong>Sources:<\/strong> <a href=\"https://www.bnnbloomberg.ca/markets/2026/11/11/rebounding-ai-stocks-lift-wall-street/\" target=\"_blank\" rel=\"noopener\">BNN Bloomberg / AP<\/a>, <a href=\"https://www.alainguillot.com/stock-market-recap-november-11-2026/\" target=\"_blank\" rel=\"noopener\">Alain Guillot recap<\/a>, <a href=\"https://pro.thestreet.com/stock-market-today/2026-11-11\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Nvidia CEO probe deepens, with lawsuit and congressional pressure<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia's board is running an independent investigation of Jensen Huang over reports he was targeted by a foreign intelligence effort, and the stock has fallen for several sessions. A class action has been filed, Senator Kevin Cramer called on Huang to resign, and House committee chairs asked him to confirm by 11 November a closed-door briefing on 18 November. Nvidia reports quarterly results on 17 November.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether, so governance doubt around its founder-CEO weighs on the whole sector.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/economy/2026/11/9/nvidia-shares-slump-amid-investigation-into-ceo-jensen-huang\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://stocktwits.com/news-articles/markets/equity/nvidia-faces-class-action-suit-over-huang-allegations-senator-seeks-probe-analyst-puts-ceo-exit-odds-at-15/cNGuT97R97g\" target=\"_blank\" rel=\"noopener\">Stocktwits<\/a>, <a href=\"https://www.scmp.com/tech/big-tech/article/3373825/nvidia-faces-defining-test-jensen-huang-probe-adds-chip-stock-turbulence\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Hotter-than-expected US inflation fuels rate-hike bets<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> US consumer prices for October rose more than economists expected, and a 10-year Treasury auction drew a high yield on below-average demand. Traders are pricing a likely December Federal Reserve rate hike.<br><strong>Why it matters:<\/strong> Higher US rates raise borrowing costs globally and pressure risk assets, emerging markets and Hong Kong's dollar-pegged economy.<br><strong>Sources:<\/strong> <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Anthropic launches record IPO roadshow<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic launched its roadshow on 10 November for 825 million shares at an expected $70 to $78 each, with a Nasdaq listing under \"ANT\". Reports point to pricing and first trading around 18-20 November, though nothing is final.<br><strong>Why it matters:<\/strong> It would be one of the largest listings in history and a gauge of investor appetite for AI valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=bn\" target=\"_blank\" rel=\"noopener\">RTTNews<\/a>, <a href=\"https://www.technobezz.com/news/anthropic-ipo-roadshow-shares-price-range\" target=\"_blank\" rel=\"noopener\">Technobezz<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">COP31 leaders' summit opens in Antalya amid finance dispute<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The leaders' segment of the UN climate talks began on 11 November, with UN chief Guterres urging leaders to \"get serious\" about the climate crisis. Climate finance emerged as an early fight, and Turkey and Australia share the presidency. The US sent no official delegation, though a congressional group is expected.<br><strong>Why it matters:<\/strong> Funding for poorer countries is the central test of the talks, in a year forecast among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://gulftoday.ae/news/2026/11/11/world-leaders-begin-talks-at-un-climate-conference\" target=\"_blank\" rel=\"noopener\">Gulf Today<\/a>, <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">After the US midterms, tech and trade partners recalibrate<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Following the 3 November midterms, in which Democrats made gains, commentary says tech leaders who had planned to wield political influence are now in a \"defensive crouch\". Canada's prime minister says Trump remains central to trade talks despite the Democratic wins. Detail on both is thin (unconfirmed).<br><strong>Why it matters:<\/strong> The result shapes US trade, regulation and spending policy for the next two years.<br><strong>Sources:<\/strong> <a href=\"https://theweek.com/edition/theweekus-evening-review-2026-11-11-222409\" target=\"_blank\" rel=\"noopener\">The Week US<\/a>, <a href=\"https://www.bostonglobe.com/world/?p1=BGMenu_Sections\" target=\"_blank\" rel=\"noopener\">Boston Globe<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this species and still a WHO emergency.<br><strong>Why it matters:<\/strong> High fatality and regional spread risk strain health systems and travel controls.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong: Cathay orders 14 more jets, Nomura weighs equity rebuild<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> Cathay Pacific ordered 14 more aircraft, bringing its deliveries total to 120, while Nomura is reportedly weighing rebuilding its Hong Kong equity capital markets business. Two Chinese chip firms, Denglin and Xinde, had mixed Hong Kong debuts the day before.<br><strong>Why it matters:<\/strong> It signals continued confidence in Hong Kong aviation and a lively listings market.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard, 11 Nov<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard, 10 Nov<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 +1.6%, Nasdaq +2.2% on 11 Nov (AP; other recaps show smaller gains): <a href=\"https://www.bnnbloomberg.ca/markets/2026/11/11/rebounding-ai-stocks-lift-wall-street/\" target=\"_blank\" rel=\"noopener\">BNN Bloomberg / AP<\/a><\/li><li>Bitcoin about $74,000 and gold about $4,120 (10 Nov): <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/li><li>Hang Seng opened about 24,354 on 11 Nov: <a href=\"https://minkabu.jp/news/4655145\" target=\"_blank\" rel=\"noopener\">Xinhua via search summary<\/a><\/li><li>Oil and Treasury yield closes: not confirmed (bond market closed 11 Nov).<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Nvidia earnings on 17 November and the 18 November congressional briefing.<\/li><li>Anthropic IPO pricing, expected around 18-20 November.<\/li><li>Any Iran deal or escalation; COP31 finance talks through 20 November.<\/li><\/ul>"}, "us": {"line": "Wall Street rebounded from a hot-inflation selloff, House Republicans blocked an effort to impeach Hegseth, and a building collapse in Brooklyn trapped people in rubble.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Stocks rebound after hot inflation data revived rate-hike fears<\/span><span class=\"cat\">Markets / Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> After Tuesday's selloff, when October consumer prices rose 0.4% (core 0.3% against 0.2% expected) and traders priced roughly 86-88% odds of a December Fed hike, stocks bounced on Wednesday as an oil slide eased inflation worries. The S&amp;P 500 gained about 1.3% to roughly 7,619, while Nvidia slumped. Tuesday's close was 7,520.93 on the S&amp;P 500 and 25,065.87 on the Nasdaq.<br><strong>Why it matters:<\/strong> Persistent inflation under Fed Chair Kevin Warsh is pushing markets toward a tightening cycle that would hit mortgages and borrowing costs.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/10/breaking-news/wall-street-falls-as-hot-inflation-fuels-fed-rate-hike-fears/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser (AP)<\/a>, <a href=\"https://www.nst.com.my/amp/business/corporate/2026/11/1574335/wall-street-jumps-oil-slide-cools-inflation-worries-nvidia\" target=\"_blank\" rel=\"noopener\">NST / Reuters<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">House Republicans block Massie's push to impeach Hegseth<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The House voted 211-204 to refer Rep. Thomas Massie's eight articles of impeachment against Defense Secretary Pete Hegseth to the Judiciary Committee, effectively ending them in this Congress. Massie was the only Republican to oppose the motion, and the articles accused Hegseth of waging an unauthorized war with Iran, among other charges.<br><strong>Why it matters:<\/strong> Democrats will hold a large House majority from January and could revive the effort.<br><strong>Sources:<\/strong> <a href=\"https://www.foxnews.com/politics/house-gop-leaders-block-massie-hegseth-impeachment-push.amp\" target=\"_blank\" rel=\"noopener\">Fox News<\/a>, <a href=\"https://www.latintimes.com/house-tables-hegseth-impeachment-resolution-601151\" target=\"_blank\" rel=\"noopener\">Latin Times<\/a>, <a href=\"https://www.democracynow.org/2026/11/10/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Democrat Scott Colom wins Mississippi Senate seat<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The AP called the closest Senate race in the country for Colom over Republican incumbent Cindy Hyde-Smith after more than a week of counting absentee and provisional ballots, by a few thousand votes. He is the first Black senator from Mississippi since Reconstruction.<br><strong>Why it matters:<\/strong> A flipped seat in the Deep South pushes the Democratic Senate majority beyond a bare margin.<br><strong>Sources:<\/strong> <a href=\"https://www.kunc.org/npr-news/2026-11-11/democrat-scott-colom-wins-mississippi-senate-race\" target=\"_blank\" rel=\"noopener\">NPR via KUNC<\/a>, <a href=\"https://www.fox4news.com/news/scott-colom-wins-senate-mississippi\" target=\"_blank\" rel=\"noopener\">Fox 4<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Building collapse in Brooklyn traps people in rubble<\/span><span class=\"cat\">Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> A three-story building at the edge of a construction site at 2625 Bedford Avenue in Flatbush collapsed around 4 p.m. Wednesday. At least one person died and others were trapped, with early updates reporting one dead and three to ten injured as firefighters dug through the wreckage.<br><strong>Why it matters:<\/strong> Excavation beside the building is a likely focus for investigators and for scrutiny of construction-site safety.<br><strong>Sources:<\/strong> <a href=\"https://www.cleveland19.com/2026/11/11/new-york-city-building-collapse-traps-people-rubble/\" target=\"_blank\" rel=\"noopener\">AP via Cleveland19<\/a>, <a href=\"https://gulfnews.com/world/americas/firefighters-dig-through-rubble-after-new-york-city-building-collapse-traps-people-in-wreckage-1.500744353\" target=\"_blank\" rel=\"noopener\">Gulf News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Trump says US has won the Iran war but wants \"total victory\"<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump claimed Washington has already won the war against Iran but does not want to stop until there is a knockout. Speaking at Arlington National Cemetery on Veterans Day, he honored veterans at the 73rd National Veterans Day Observance, with the Iran war, which began on 28 February, a backdrop. Treasury Secretary Scott Bessent said Trump and Xi Jinping will meet next week in Shenzhen.<br><strong>Why it matters:<\/strong> The rhetoric clashes with reports of diplomacy and a hold on new strikes, leaving the path of the war unclear.<br><strong>Sources:<\/strong> <a href=\"https://www.timesofisrael.com/liveblog-november-11-2026/\" target=\"_blank\" rel=\"noopener\">Times of Israel liveblog<\/a>, <a href=\"https://www.whitehouse.gov/releases/2026/11/we-render-you-the-highest-salute-president-trump-honors-americas-veterans-on-hallowed-ground-at-arlington/\" target=\"_blank\" rel=\"noopener\">White House<\/a>, <a href=\"https://political.org/2026/11/11/trump-to-mark-veterans-day-with-remarks-at-arlington-national-cemetery/\" target=\"_blank\" rel=\"noopener\">Political.org<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Bessent moves to a military base after Iranian threats<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The New York Times reported that Treasury Secretary Scott Bessent recently moved from his home onto a military base after Iranian threats against his life. Bessent has said he will not be cowed.<br><strong>Why it matters:<\/strong> It shows the personal security risks facing US officials as the Iran conflict drags on.<br><strong>Sources:<\/strong> <a href=\"https://www.justsecurity.org/164111/early-edition-november-11-2026/\" target=\"_blank\" rel=\"noopener\">Just Security Early Edition<\/a>, <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now headlines<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Labor Department proposes five weekly job searches for jobless benefits<\/span><span class=\"cat\">Economy / Policy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Labor Department proposed a national minimum of five qualifying work-search activities a week for people claiming unemployment insurance, using a point system. Only four states require five today, and many require two or three. Comments are due 60 days after Federal Register publication.<br><strong>Why it matters:<\/strong> Critics at the Economic Policy Institute say the rule would be devastating to claimants and cost states money.<br><strong>Sources:<\/strong> <a href=\"https://www.cbsnews.com/news/trump-work-search-rules-unemployment-benefits/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://www.dol.gov/index.php/newsroom/releases/eta/eta20261109\" target=\"_blank\" rel=\"noopener\">Department of Labor<\/a>, <a href=\"https://www.wfsb.com/2026/11/10/trump-administration-considers-5-job-searches-weekly-jobless-benefits/\" target=\"_blank\" rel=\"noopener\">WFSB<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Judge lets Trump's $10 billion BBC defamation suit proceed<\/span><span class=\"cat\">Courts / Media<\/span><\/h2>\n<p><strong>What happened:<\/strong> US District Judge Jeffrey Kuntz in Florida refused to dismiss Trump's defamation claim against the BBC, finding it plausible that the broadcaster harmed his reputation, while throwing out a Florida consumer-protection claim. The BBC said it was surprised by the decision, and Trump called it a \"huge victory\".<br><strong>Why it matters:<\/strong> The case, with a provisional trial date of February 2027 and a 11 December deposition deadline for Trump, will test US defamation law against a foreign broadcaster.<br><strong>Sources:<\/strong> <a href=\"https://gvwire.com/2026/11/11/judge-allows-trumps-defamation-suit-against-bbc-to-proceed/\" target=\"_blank\" rel=\"noopener\">GV Wire<\/a>, <a href=\"https://cyprus-mail.com/2026/11/11/trumps-10bn-bbc-defamation-lawsuit-can-proceed-judge-rules\" target=\"_blank\" rel=\"noopener\">Cyprus Mail<\/a>, <a href=\"https://aa.com.tr/en/americas/us-judge-allows-10b-defamation-lawsuit-against-bbc-to-proceed/4119887\" target=\"_blank\" rel=\"noopener\">Anadolu<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Thune re-elected GOP Senate leader; Democrats face their own leadership split<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Senate Republicans re-elected John Thune as leader by acclamation after the midterm losses that cost them their majority, with Barrasso kept as whip. A roundup says Sen. Bernie Sanders will not back Chuck Schumer for majority leader (single source: unconfirmed). Jim Jordan was chosen House minority leader.<br><strong>Why it matters:<\/strong> Leadership lines for the divided Congress that begins in January are taking shape on both sides.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/amp/news/2026/11/11/thune-re-elected-as-us-senate-republican-leader-after-midterm-losses\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://cbsnews.com/news/john-thune-reelected-senate-republican-leader\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://www.justsecurity.org/164111/early-edition-november-11-2026/\" target=\"_blank\" rel=\"noopener\">Just Security Early Edition<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">White House warns Democratic oversight could amount to \"criminality\"<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The White House pushed back on Democrats' planned investigations, suggesting they could amount to \"blatant criminality\". Separately, Russia and Ukraine agreed to a large prisoner exchange after US-mediated talks in Abu Dhabi.<br><strong>Why it matters:<\/strong> The clash previews a hard-fought oversight era once Democrats take House committees in January.<br><strong>Sources:<\/strong> <a href=\"https://www.dailyrecordnews.com/ap_news/us/ap-news-in-brief-at-9-04-p-m-est/article_aed5331d-6ac1-52bf-85ec-c8dd48a808b1.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a>, <a href=\"https://www.ajc.com/news/2026/11/the-latest-white-house-claims-criminality-in-democratic-oversight/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Wednesday 11 Nov close): about 7,619, up roughly 1.3% - <a href=\"https://www.nst.com.my/amp/business/corporate/2026/11/1574335/wall-street-jumps-oil-slide-cools-inflation-worries-nvidia\" target=\"_blank\" rel=\"noopener\">NST / Reuters<\/a><\/li><li>Nasdaq Composite: rose about 1.6% from Tuesday's 25,065.87 - <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/li><li>10-year Treasury yield: not found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Death toll and cause of the Brooklyn collapse.<\/li><li>Nvidia's leadership turmoil and its 17 November earnings.<\/li><li>Fed commentary on a possible December rate hike.<\/li><\/ul>"}, "asia": {"line": "Indonesia's vice president resigns over a diploma dispute while Asian chip stocks extend their rebound and Washington and Beijing finalise the Shenzhen summit.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Indonesia's Vice President Gibran resigns amid eligibility dispute<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Reports on 11 November said Vice President Gibran Rakabuming Raka submitted his resignation to President Prabowo, after a presidential spokesperson said on 10 November that he intended to step down over court decisions on his education records. Bloomberg reported, citing people with knowledge, that Prabowo accepted it; the spokesperson did not confirm acceptance. Gibran said he would keep defending his credentials in the State Administrative Court.<br><strong>Why it matters:<\/strong> The MPR must convene within 60 days to choose a successor from two candidates nominated by Prabowo, raising political uncertainty in Southeast Asia's largest economy.<br><strong>Sources:<\/strong> <a href=\"https://tribune.com.pk/story/2639789/indonesias-vice-president-has-resigned-aide-says-stoking-political-uncertainty\" target=\"_blank\" rel=\"noopener\">Tribune (Pakistan)<\/a>, <a href=\"https://www.nst.com.my/amp/world/region/2026/11/1575730/indonesias-gibran-quits-vice-president-amid-eligibility-controversy\" target=\"_blank\" rel=\"noopener\">New Straits Times<\/a>, <a href=\"https://www.thejakartapost.com/indonesia/2026/11/10/breaking-vp-gibran-intends-to-resign-says-state-secretary\" target=\"_blank\" rel=\"noopener\">Jakarta Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Nikkei and Kospi extend rebound on AI and chip stocks<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> On 11 November the Nikkei 225 rose for a third straight session to about 61,190 (up roughly 1.2%) and the Kospi gained about 1.7% to near 5,330, with Samsung and SK Hynix leading. KOSDAQ jumped nearly 5% at midday. The Shanghai Composite eased about 0.2%. The gains recoup most of the sell-off after the US midterms.<br><strong>Why it matters:<\/strong> Analysts describe the move as a positioning reset rather than a trend change; Nvidia's results next week are the next test.<br><strong>Sources:<\/strong> <a href=\"https://investinglive.com/stock-market-update/asia-midday-nikkei-up-for-third-day-kosdaq-jumps-5-as-ai-stocks-rebound/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a>, <a href=\"https://investinglive.com/stock-market-update/nikkei-kospi-extend-rebound-as-ai-and-chip-stocks-surge-recouping-friday-s-rout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Rubio and Wang Yi finalise Trump-Xi Shenzhen meeting<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US Secretary of State Rubio held a phone call with Chinese Foreign Minister Wang Yi to finalise preparations for next week's Trump-Xi meeting in Shenzhen on the APEC sidelines. Beijing has said discussions on a possible Xi-Trump-Putin meeting are under way, but no agenda is fixed.<br><strong>Why it matters:<\/strong> Expected deliverables are limited, with AI cooperation and an extension of the trade truce among the reported topics.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/china/diplomacy/article/3374120/rubio-wang-hold-phone-call-trump-xi-meeting-next-week\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.koreatimes.co.kr/world/20261107/china-confirms-discussions-underway-on-historic-xi-trump-putin-meeting\" target=\"_blank\" rel=\"noopener\">Korea Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Philippines readies the 49th ASEAN Summit<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> President Marcos conducted a final inspection of ASEAN summit venues, and Philippine Airlines announced flight cancellations and reschedulings from 14 to 18 November to handle delegate arrivals. A US envoy said no announcement on \"Pax Silica\" would come during the summit.<br><strong>Why it matters:<\/strong> The summit, with the South China Sea and energy security on the agenda, opens in Manila this weekend.<br><strong>Sources:<\/strong> <a href=\"https://www.bernama.com/en/world/news.php?id=2631572\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://asianews.network/category/home-page/page/1460/&#x27;\" target=\"_blank\" rel=\"noopener\">Asia News Network<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">South Korea: justice minister nominee on charges against the president<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Justice minister nominee Lee Yong-cheol said it is time to focus on uncovering the truth in the criminal cases against President Lee Jae-myung, without ruling out dropping the charges. Lee also dined with Democratic Party leader Kim Min-seok on 11 November (single-source: unconfirmed).<br><strong>Why it matters:<\/strong> The handling of the president's cases is a continuing political flashpoint in Seoul.<br><strong>Sources:<\/strong> <a href=\"https://mbiz.heraldcorp.com/article/10933250\" target=\"_blank\" rel=\"noopener\">Herald Corp<\/a>, <a href=\"https://www.khan.co.kr/en/article/202611112233007\" target=\"_blank\" rel=\"noopener\">Kyunghyang Shinmun<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Najib Razak begins house arrest; DAP's Loke resigns in protest<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Former Malaysian prime minister Najib Razak went home from Kajang Prison on 10 November to serve the rest of his 1MDB-era graft sentence under house arrest, after a new High Court order replaced an earlier one the attorney general had sought to defer. The King's pardon allows house arrest until August 2028. Anthony Loke, who had vowed to resign the moment Najib stepped into his house, quit on Tuesday.<br><strong>Why it matters:<\/strong> The move strains Anwar's unity coalition and sets up a fight over royal pardon powers; Najib still faces a further 15-year term in a separate case.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/10/malaysian-court-clears-former-pm-najib-razak-for-house-arrest-transfer\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.malaymail.com/amp/news/malaysia/2026/11/10/najib-arrives-at-taman-duta-residence-to-begin-his-house-arrest/242755\" target=\"_blank\" rel=\"noopener\">Malay Mail<\/a>, <a href=\"https://scmp.com/week-asia/people/article/3374077/malaysias-najib-back-home-home-comforts-are-menu\" target=\"_blank\" rel=\"noopener\">South China Morning Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">China's $1 trillion trade surplus draws scrutiny as producer prices pick up<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Al Jazeera ran an analysis of why China's trade surplus of about $1 trillion is not all good news for its economy, while SCMP reported that producer prices accelerated even as consumer inflation stayed weak.<br><strong>Why it matters:<\/strong> Strong exports with soft domestic demand fuel trade friction with the US and Europe just before the Shenzhen summit.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/where/china/\" target=\"_blank\" rel=\"noopener\">Al Jazeera China<\/a>, <a href=\"https://www.scmp.com/economy/china-economy\" target=\"_blank\" rel=\"noopener\">South China Morning Post: China economy<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Li Qiang to travel to Thailand and the Philippines for China-ASEAN meetings<\/span><span class=\"cat\">Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> China's Foreign Ministry announced on 11 November that Premier Li Qiang will visit Thailand and the Philippines and attend the China-ASEAN summit. It also confirmed Xi Jinping will attend the APEC Economic Leaders' Meeting in Shenzhen on 18-19 November.<br><strong>Why it matters:<\/strong> Beijing is courting Southeast Asia while the US pushes its own partnerships in Manila.<br><strong>Sources:<\/strong> <a href=\"https://www.fmprc.gov.cn/eng/\" target=\"_blank\" rel=\"noopener\">China Ministry of Foreign Affairs<\/a>, <a href=\"https://en.wikipedia.org/wiki/APEC_China_2026\" target=\"_blank\" rel=\"noopener\">APEC China 2026, Wikipedia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Japan: debate on food consumption tax cut; telecom outage [Politics] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Jiji Press headlines for 11 November said the Upper House began deliberating a bill to temporarily cut the consumption tax on food, and that NTT Docomo's mobile outage had been fully resolved. Japan Times digests flagged the tax cut as becoming a headache for the government. I could not confirm details from a second source.<br><strong>Why it matters:<\/strong> The tax cut tests Prime Minister Takaichi's fiscal credibility and bond-market tolerance.<br><strong>Sources:<\/strong> <a href=\"https://milled.com/japantimes-co-jp/todays-top-news-consumption-tax-cut-is-quickly-turning-into-a-headache-for-kVSDTD1bRAWam3MV\" target=\"_blank\" rel=\"noopener\">Japan Times digest<\/a>, <a href=\"https://japan.kantei.go.jp/news/\" target=\"_blank\" rel=\"noopener\">Japan PM Office<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Pakistan: Ishaq Dar's grandson indicted in Lahore case [Politics] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A wire roundup dated 11 November reported that Deputy Prime Minister Ishaq Dar's grandson and seven others were indicted in a Lahore gang-rape case. The same roundup carried a Britain-Hasina item on Bangladesh's former leader.<br><strong>Why it matters:<\/strong> The case puts a senior government figure's family under unusual legal scrutiny.<br><strong>Sources:<\/strong> <a href=\"https://www.theweek.in/wire-updates/international/2026/11/11/following-are-the-top-foreign-stories-at-2000-hours.html\" target=\"_blank\" rel=\"noopener\">The Week wire roundup<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Nikkei 225 about 61,190 on 11 Nov, up about 1.2% - <a href=\"https://investinglive.com/stock-market-update/asia-midday-nikkei-up-for-third-day-kosdaq-jumps-5-as-ai-stocks-rebound/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/li><li>Kospi about 5,330 on 11 Nov, up about 1.7% (midday figure) - <a href=\"https://investinglive.com/stock-market-update/asia-midday-nikkei-up-for-third-day-kosdaq-jumps-5-as-ai-stocks-rebound/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/li><li>Shanghai Composite eased about 0.2% on 11 Nov (midday) - <a href=\"https://investinglive.com/stock-market-update/asia-midday-nikkei-up-for-third-day-kosdaq-jumps-5-as-ai-stocks-rebound/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/li><li>USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>15-17 Nov: ASEAN summit in Manila.<\/li><li>18-19 Nov: APEC in Shenzhen; Trump-Xi meeting.<\/li><li>Indonesia's process to replace the vice president.<\/li><li>Nvidia results on 17 Nov as a test for Asian chip stocks.<\/li><\/ul>"}, "hk": {"line": "Cathay Pacific ordered 14 more aircraft and the Abby Choi trial heard a tearful accusation between brothers, while the Hang Seng fell 0.98% on rate worries.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Cathay Pacific orders 14 more aircraft<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Cathay Pacific (0293) announced on Wednesday an order for 14 more aircraft: 11 widebody and three narrowbody, for fleet expansion and upgrade.<br><strong>Why it matters:<\/strong> It signals confidence in long-term growth at Hong Kong's flag carrier.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Hang Seng falls 0.98% to 24,315.92<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed at 24,315.92 on 11 November, down 0.98%, after closing at 24,557.04 on Tuesday. The tech index fell 1.41% to 4,027.06. Stronger US inflation and hawkish Fed signals raised rate-hike expectations. Biotech and EV makers weighed on the index.<br><strong>Why it matters:<\/strong> Under the peg, US rate rises feed into Hong Kong borrowing costs.<br><strong>Sources:<\/strong> <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-at-24-315-92-down-0-98-percent/70494407\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a>, <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-0-44-higher-at-24-557-04-points/70485793\" target=\"_blank\" rel=\"noopener\">ad-hoc-news (10 Nov)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Abby Choi trial: Anthony Kwong accuses younger brother<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> On day 34 of the trial, Anthony Kwong testified in tears that his younger brother Alex Kwong was responsible for the killing. A juror was discharged earlier, leaving eight.<br><strong>Why it matters:<\/strong> The trial is the city's most closely followed murder case.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/law-and-crime/article/3373979/abby-chois-ex-brother-law-tells-court-he-was-rather-special-existence\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Government rejects 455 domestic helper visa applications over job-hopping<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> The government rejected 455 domestic helper visa applications over suspected job-hopping (reported in the 11 November recap).<br><strong>Why it matters:<\/strong> It affects employers and the roughly hundreds of thousands of helpers in the city.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Aviation chief pledges closer cooperation with the mainland<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The aviation chief pledged closer cooperation with the mainland (details unconfirmed).<br><strong>Why it matters:<\/strong> It bears on airspace, airport links and Hong Kong's hub status.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">FSDC proposes adding mainland pension funds to Southbound Bond Connect<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Financial Services Development Council proposed including mainland pension funds in Southbound Bond Connect.<br><strong>Why it matters:<\/strong> It could bring new capital into Hong Kong's bond market.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Bid-rigging trial: HK$2m bribes allegedly offered for HK$20m tender<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A trial heard that three people were allegedly offered HK$2 million in bribes to win a HK$20 million tender (single source, unconfirmed).<br><strong>Why it matters:<\/strong> It is another procurement-integrity case.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/topics/crime-hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Former lawmaker William Wong's sentencing moved to 26 November<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> Sentencing was moved to 26 November for background and community service reports, after he pleaded guilty to traffic offences over a drink-driving crash (single source, unconfirmed).<br><strong>Why it matters:<\/strong> It involves a former legislator and could set a sentencing signal.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/topics/crime-hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Education Bureau defends Pinyin typing plan for primary pupils<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Education Bureau defended a plan to teach primary pupils Mandarin Pinyin typing (single source, unconfirmed).<br><strong>Why it matters:<\/strong> It continues the debate on language in schools.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">A Symphony of Lights to end after 22 years; WinterFest to be largest ever<\/span><span class=\"cat\">Culture<\/span><\/h2>\n<p><strong>What happened:<\/strong> The nightly harbour show was reported set to end after a 22-year run, while the city plans its largest-ever WinterFest (from the 10 November recap).<br><strong>Why it matters:<\/strong> A tourism icon changes as winter events ramp up.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 24,315.92 (11 Nov), down 0.98% - <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-at-24-315-92-down-0-98-percent/70494407\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/li><li>Hang Seng Tech Index 4,027.06, down 1.41%<\/li><li>HIBOR, USD/HKD and weather: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>26 Nov: William Wong sentencing.<\/li><li>Education (Amendment) Bill gazetting.<\/li><li>17-19 Nov: Nvidia earnings, FOMC minutes and APEC in Shenzhen.<\/li><\/ul>"}}}, {"date": "2026-11-11", "ed": {"world": {"line": "Hotter-than-expected US inflation knocked Wall Street and sharpened bets on a December Fed hike, as Nvidia's CEO scandal escalated, Russia and Ukraine returned to the table in Abu Dhabi and Trump signalled he would pause Iran strikes.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hot US inflation hits stocks and lifts rate-hike bets<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> US consumer prices rose 0.4% in October against 0.3% expected, with core prices up 0.3% against 0.2% expected. The S&amp;P 500 closed at 7,520.93 (-0.38%), the Dow at 52,231.89 (-0.30%) and the Nasdaq at 25,065.87 (-0.74%), reversing Monday's rally; the 2-year Treasury yield jumped to 4.73%. A weak 10-year Treasury auction added to the pressure.<br><strong>Why it matters:<\/strong> Sticky inflation makes a December Fed rate hike more likely, raising borrowing costs worldwide and pressuring tech valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/10/breaking-news/wall-street-falls-as-hot-inflation-fuels-fed-rate-hike-fears/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / AP<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a>, <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Russia and Ukraine resume US-mediated talks in Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trilateral talks opened on 10 November, the first since February, with US envoys Witkoff and Kushner, Ukraine's Rustem Umerov and Russia's Medinsky. The first session lasted about four hours; the main disputes are territory and security guarantees, and Russia objects to European participation for now.<br><strong>Why it matters:<\/strong> Direct talks restarting after nine months is the first diplomatic opening in the war in some time, though no deal is near.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.dailysabah.com/world/europe/us-mediated-russia-ukraine-dialogue-to-end-war-kicks-off-in-uae/amp\" target=\"_blank\" rel=\"noopener\">Daily Sabah<\/a>, <a href=\"https://www.inquirer.com/news/nation-world/russia-ukraine-peace-talks-abu-dhabi-putin-zelesnky-kushner-trump-20261110.html\" target=\"_blank\" rel=\"noopener\">Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Trump says he will hold off Iran strikes but keep blockade<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> After talks with Qatar's prime minister, Trump said he would pause new strikes for now and keep the naval blockade, adding that Iran's military is effectively finished; Iranian officials dismissed that and its security chief called reports of talks fake news. Iran says no deal is possible unless the blockade ends, while Qatar has put forward a 48-hour plan pairing nuclear inspections with reopening the Strait of Hormuz.<br><strong>Why it matters:<\/strong> Hormuz shipping and oil prices hinge on whether this diplomacy produces a deal or a return to strikes.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/gulf/trump-uae-qatar-saudi-arabia-iran-conflict-hormuz-blockade\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://dropsitenews.com/p/trump-says-iran-war-militarily-is\" target=\"_blank\" rel=\"noopener\">Dropsite News<\/a>, <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Nvidia falls about 5.5% as CEO scandal grows<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia shares dropped roughly 5.5% as the board's independent investigation into CEO Jensen Huang continued, a class action was filed and Senator Kevin Cramer called on him to resign. House committee chairs asked Huang to attend a closed-door briefing on 18 November; Nvidia reports earnings on 17 November.<br><strong>Why it matters:<\/strong> The AI-chip leader's governance crisis weighs on the sector that has driven much of the market's gains.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/economy/2026/11/9/nvidia-shares-slump-amid-investigation-into-ceo-jensen-huang\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://stocktwits.com/news-articles/markets/equity/nvidia-faces-class-action-suit-over-huang-allegations-senator-seeks-probe-analyst-puts-ceo-exit-odds-at-15/cNGuT97R97g\" target=\"_blank\" rel=\"noopener\">Stocktwits<\/a>, <a href=\"https://fool.com/investing/2026/11/10/why-nvidia-stock-fell-again-on-tuesday\" target=\"_blank\" rel=\"noopener\">Motley Fool<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Anthropic launches IPO roadshow at $70-78 a share<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic began its roadshow on 10 November, offering 825 million shares at an expected $70 to $78 each under the Nasdaq ticker \"ANT\". Reports point to pricing and trading around 18-20 November, but nothing is final.<br><strong>Why it matters:<\/strong> It would be among the biggest listings ever and tests investor appetite for AI valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=bn\" target=\"_blank\" rel=\"noopener\">RTTNews<\/a>, <a href=\"https://www.technobezz.com/news/anthropic-ipo-roadshow-shares-price-range\" target=\"_blank\" rel=\"noopener\">Technobezz<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">COP31 climate talks under way in Antalya, finance in dispute<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The UN climate summit opened on 9 November, with the leaders' segment due 11-12 November and talks running to 20 November. UN chief Guterres urged leaders to \"get serious\", disagreements over climate finance surfaced early, and the US sent no official delegation.<br><strong>Why it matters:<\/strong> Financing for vulnerable countries decides whether commitments become action, in a year forecast to be among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a>, <a href=\"https://enb.iisd.org/antalya-un-climate-change-conference-cop31\" target=\"_blank\" rel=\"noopener\">Earth Negotiations Bulletin<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">EU budget row over Ukraine aid ahead of 20 November summit<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> European Council president Costa replied to German Chancellor Merz's letter linking an EU budget deal to a deal on Ukraine aid, adding a new hurdle before the 20 November summit. Separately, the EU is also committing 10 million euros to Bulgarian rescue work in the Black Sea, where drone attacks endanger shipping.<br><strong>Why it matters:<\/strong> How Europe funds Ukraine will shape its war effort as peace talks restart.<br><strong>Sources:<\/strong> <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">European supermarkets hit by cyberattacks<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Supermarkets in at least 12 European countries were hit by cyberattacks in October and November, with France worst affected. The EU's cyber chief warned that home appliances could be targeted next.<br><strong>Why it matters:<\/strong> Attacks on retail and connected devices show growing risk to everyday supply chains.<br><strong>Sources:<\/strong> <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this species and still a WHO emergency. Separately, a study of over 440,000 Americans linked cannabis use to higher cardiovascular risk (preliminary, single source).<br><strong>Why it matters:<\/strong> The outbreak's scale strains health systems and raises regional spread concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed), <a href=\"https://sciencedaily.com/news/health_medicine/sports_medicine\" target=\"_blank\" rel=\"noopener\">ScienceDaily<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong: Chinese chip firms debut mixed, WinterFest prepares<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> Chinese chip firms Denglin and Xinde had mixed debuts in Hong Kong on 10 November, and the city is preparing its largest-ever WinterFest as A Symphony of Lights nears its final show.<br><strong>Why it matters:<\/strong> Chip listings show Hong Kong's role as a fundraising hub for Chinese tech, though first-day moves were uneven.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,520.93 (-0.38%), Dow 52,231.89 (-0.30%), Nasdaq 25,065.87 (-0.74%) on 10 Nov: <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/li><li>US 2-year yield 4.73%: <a href=\"https://www.staradvertiser.com/2026/11/10/breaking-news/wall-street-falls-as-hot-inflation-fuels-fed-rate-hike-fears/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / AP<\/a><\/li><li>Bitcoin about $74,051, gold about $4,120 (Asian session 10 Nov): <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/li><li>Oil settlement levels and Hang Seng close: not confirmed.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Outcome of the Abu Dhabi talks, and any Iran deal or renewed strikes.<\/li><li>Nvidia earnings on 17 November and the 18 November congressional briefing.<\/li><li>Anthropic IPO pricing, COP31 finance talks and the 20 November EU summit.<\/li><\/ul>"}, "us": {"line": "Hotter-than-expected inflation hit stocks and revived Fed rate-hike bets, House Republicans turned aside Hegseth's impeachment, and Rubio said major combat against Iran is not needed for now.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hot October inflation sends stocks lower and revives Fed-hike bets<\/span><span class=\"cat\">Economy / Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Consumer prices rose 0.4% in October against 0.3% expected, with core prices up 0.3% against 0.2% expected; the BLS did not publish most annual comparisons because of last year's shutdown. The S&amp;P 500 fell 0.38% to 7,520.93, the Dow 0.30% to 52,231.89 and the Nasdaq 0.74% to 25,065.87. Dallas Fed President Lorie Logan said two more rate hikes would be needed.<br><strong>Why it matters:<\/strong> Sticky inflation, even as gasoline prices ease, is pushing markets toward a December tightening that would raise borrowing costs.<br><strong>Sources:<\/strong> <a href=\"https://www.ajc.com/news/2026/11/us-stocks-slip-following-a-discouraging-update-on-inflation/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a>, <a href=\"https://www.metatradingclub.com/?p=28238\" target=\"_blank\" rel=\"noopener\">Meta Trading Club recap<\/a>, <a href=\"https://stockanalysis.com/news/us-cpi-rises-october-2026/\" target=\"_blank\" rel=\"noopener\">Stock Analysis<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Nvidia slides again as board probes CEO Jensen Huang<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia shares fell about 5.5% to $168.80, a second straight daily decline, after the board hired an outside firm to investigate allegations involving CEO Jensen Huang's ties to an alleged Chinese intelligence operative. Huang has admitted an affair. Republican Sen. Kevin Cramer called on him to resign, while Trump has defended him.<br><strong>Why it matters:<\/strong> Nvidia was the heaviest weight on the S&amp;P 500, so its slide dragged the whole market.<br><strong>Sources:<\/strong> <a href=\"https://www.metatradingclub.com/?p=28238\" target=\"_blank\" rel=\"noopener\">Meta Trading Club<\/a>, <a href=\"https://axios.com/2026/11/08/nvidia-ceo-jensen-huang-admits-affair-board-to-launch-investigation\" target=\"_blank\" rel=\"noopener\">Axios<\/a>, <a href=\"https://www.foxcarolina.com/2026/11/09/nvidia-investigates-whether-ceo-jensen-huang-was-targeted-by-chinese-spy-with-whom-he-had-an-affair/\" target=\"_blank\" rel=\"noopener\">Fox Carolina<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">House turns aside Massie's Hegseth impeachment<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The House voted 211-204 to refer Rep. Thomas Massie's eight articles of impeachment against Defense Secretary Pete Hegseth to committee, effectively killing them in this Congress. Massie was the only Republican to oppose the motion. The articles cite the Iran war, boat strikes and other actions.<br><strong>Why it matters:<\/strong> The vote put Republicans on record on the war powers fight just after the midterms.<br><strong>Sources:<\/strong> <a href=\"https://www.ottumwacourier.com/news/national_news/ap-news-in-brief-at-9-04-p-m-est/article_382c9ebc-640e-5d43-8f7f-5f11f65280e1.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a>, <a href=\"https://www.foxnews.com/politics/house-gop-leaders-block-massie-hegseth-impeachment-push.amp\" target=\"_blank\" rel=\"noopener\">Fox News<\/a>, <a href=\"https://www.democracynow.org/2026/11/10/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Rubio: economic pressure means no need for major combat against Iran<\/span><span class=\"cat\">Security / Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> After a G7 foreign ministers' meeting in Paris, Secretary of State Marco Rubio said the sanctions and naval blockade are \"so devastating\" that there is no need for major combat operations right now, while warning the US will respond if Iran escalates. Trump said a renewed campaign is \"quite unlikely\". Iran told the IAEA it cannot accept full inspections while under threat.<br><strong>Why it matters:<\/strong> It signals a shift from strikes toward a long economic squeeze, with Europe pressing against escalation.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/rubio-says-no-need-major-combat-operations-against-iran-given-us-economic\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.bairdmaritime.com/security/naval/rubio-says-naval-blockade-economic-warfare-avoid-need-for-major-us-strikes-on-iran\" target=\"_blank\" rel=\"noopener\">Baird Maritime / Reuters<\/a>, <a href=\"https://carnegieendowment.org/programs/nuclear-policy/proliferation-news/proliferation-news-november-10-2026\" target=\"_blank\" rel=\"noopener\">Carnegie Proliferation News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Supreme Court lets border wall construction continue in Big Bend<\/span><span class=\"cat\">Courts / Immigration<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Supreme Court allowed the Trump administration to resume border wall construction in Big Bend National Park and along the Rio Grande in Texas, after a district judge had halted the work and declined to pause her ruling.<br><strong>Why it matters:<\/strong> The emergency order lets the administration build while the litigation continues.<br><strong>Sources:<\/strong> <a href=\"https://www.scotusblog.com/2026/11/supreme-court-allows-trump-administration-to-continue-border-wall-construction/\" target=\"_blank\" rel=\"noopener\">SCOTUSblog<\/a>, <a href=\"https://carnegieendowment.org/programs/nuclear-policy/proliferation-news/proliferation-news-november-10-2026\" target=\"_blank\" rel=\"noopener\">Carnegie Proliferation News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Senate Republicans re-elect Thune as leader after midterm losses<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Senate Republicans re-elected John Thune as leader by acclamation for another two years after losing their majority on 3 November, with Barrasso kept as whip. A last-minute push by some conservatives to delay the vote failed.<br><strong>Why it matters:<\/strong> Thune will lead a minority caucus facing a Democratic Senate and a looming 11 December funding deadline.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/amp/news/2026/11/11/thune-re-elected-as-us-senate-republican-leader-after-midterm-losses\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://cbsnews.com/news/john-thune-reelected-senate-republican-leader\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://www.inquirer.com/politics/senate-republicans-reelect-john-thune-minority-leader-20261110.html\" target=\"_blank\" rel=\"noopener\">Philadelphia Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Senate advances sweeping permitting reform bill<\/span><span class=\"cat\">Congress / Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Senate voted 73-25 on Monday to proceed to H.R. 2347, a vehicle for permitting reform, and agreed to the motion to proceed 62-21 on Tuesday evening. The chamber also confirmed many military nominations by voice vote.<br><strong>Why it matters:<\/strong> Permitting reform is one of the few bipartisan priorities still moving before Democrats take over committees in January.<br><strong>Sources:<\/strong> <a href=\"https://www.senate.gov/legislative/LIS/floor_activity/11_10_2026_Senate_Floor.htm\" target=\"_blank\" rel=\"noopener\">Senate floor activity, 10 Nov<\/a>, <a href=\"https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00258.htm\" target=\"_blank\" rel=\"noopener\">Senate roll call vote 258<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Three men charged in plot targeting Jewish communities<\/span><span class=\"cat\">Crime / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> US authorities charged three men over a plot involving nearly 20 attacks on Jewish communities in Europe and the United States, plus an attack on a British military base. Separately, London counterterror police arrested a US Army soldier on suspicion of Russia-related espionage.<br><strong>Why it matters:<\/strong> The case underscores heightened antisemitic and espionage threats linked to the wars in the Middle East and Ukraine.<br><strong>Sources:<\/strong> <a href=\"https://www.dailyadvance.com/news/national/ap-news-in-brief-at-11-04-p-m-est/article_64c0d31c-8a3a-5744-8d06-7a8b3732ef83.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Appeals court rejects DOJ bid for 18 months of journalists' records<\/span><span class=\"cat\">Courts / Media<\/span><\/h2>\n<p><strong>What happened:<\/strong> A federal appeals court rejected a Justice Department request for 18 months of journalists' records, according to a news roundup. I could not find a second source with details of the case (unconfirmed).<br><strong>Why it matters:<\/strong> The ruling bears on press freedom and leak investigations under the Trump administration.<br><strong>Sources:<\/strong> <a href=\"https://carnegieendowment.org/programs/nuclear-policy/proliferation-news/proliferation-news-november-10-2026\" target=\"_blank\" rel=\"noopener\">Carnegie Proliferation News (roundup)<\/a>, <a href=\"https://onlabor.org/november-10-2026/\" target=\"_blank\" rel=\"noopener\">OnLabor news and commentary<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Protesters arrested at Anthropic's New York offices over IPO plans<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Five people were arrested at Anthropic's New York City offices as protesters demanded the company halt its IPO plans, according to Democracy Now. The company is reported to be preparing a Nasdaq listing.<br><strong>Why it matters:<\/strong> Public scrutiny of AI companies is intensifying as they approach public markets.<br><strong>Sources:<\/strong> <a href=\"https://www.democracynow.org/2026/11/10/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now headlines<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Tuesday 10 Nov close): 7,520.93 - <a href=\"https://www.ajc.com/news/2026/11/us-stocks-slip-following-a-discouraging-update-on-inflation/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a><\/li><li>Nasdaq Composite: 25,065.87 - <a href=\"https://www.ajc.com/news/2026/11/us-stocks-slip-following-a-discouraging-update-on-inflation/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a><\/li><li>10-year Treasury yield: not found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Nvidia's board investigation and any further shake-up at the top.<\/li><li>US-Russia-Ukraine talks under way in Abu Dhabi.<\/li><li>Fed commentary after the hot inflation reading, with a December hike priced in.<\/li><\/ul>"}, "asia": {"line": "Asian chip stocks bounce hard after last week's rout, China's export boom pushes its surplus past $1 trillion, and Indonesia's vice president signals he will step down.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Nikkei and Kospi rebound sharply on AI and chip stocks<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> On 10 November the Nikkei 225 rose about 2.7% to near 60,400 and the Kospi jumped more than 4% to around 5,240, led by Samsung Electronics (about +5%) and SK Hynix (about +6%). The moves recouped most of Friday's near-6% drop. The Shanghai Composite eased about 0.3% to 3,654 in morning trade.<br><strong>Why it matters:<\/strong> Analysts read it as a positioning reset after fears that Democratic gains in the US midterms could slow AI investment.<br><strong>Sources:<\/strong> <a href=\"https://investinglive.com/stock-market-update/nikkei-kospi-extend-rebound-as-ai-and-chip-stocks-surge-recouping-friday-s-rout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a>, <a href=\"https://investinglive.com/news/investinglive-asia-pacific-market-news-kosdaq-jumps-nearly-5-as-ai-rebounds-oil-firms/\" target=\"_blank\" rel=\"noopener\">investingLive Asia-Pacific wrap<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Indonesia's Vice President Gibran says he intends to resign<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The state secretary said on 10 November that Vice President Gibran Rakabuming Raka intends to resign, in response to developments around Constitutional Court and Supreme Court decisions on his education records. He asked to prove his documents in the State Administrative Court.<br><strong>Why it matters:<\/strong> A vacancy would trigger a vote in the MPR within 60 days on a successor nominated by President Prabowo.<br><strong>Sources:<\/strong> <a href=\"https://www.thejakartapost.com/indonesia/2026/11/10/breaking-vp-gibran-intends-to-resign-says-state-secretary\" target=\"_blank\" rel=\"noopener\">Jakarta Post<\/a>, <a href=\"https://www.devdiscourse.com/article/international/4004396-indonesia-vp-expresses-intent-to-step-down-presidential-official-says\" target=\"_blank\" rel=\"noopener\">Devdiscourse<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">China's trade surplus tops $1 trillion for a second year<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Customs data showed October exports up 35.2% year on year and imports up 41.6%, helped by semiconductors (exports +137%) and a recovery in Gulf crude shipments. The October surplus narrowed to about $105 billion, and the January-October surplus reached $1.04 trillion.<br><strong>Why it matters:<\/strong> The surplus risks fresh friction with the EU and US ahead of the Xi-Trump meeting at APEC.<br><strong>Sources:<\/strong> <a href=\"https://investinglive.com/news/china-october-exports-beat-forecasts-imports-surge-41-6-as-trade-surplus-narrows/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a>, <a href=\"https://www.itv.com/news/2026-11-10/chinas-trade-surplus-exceeds-1-trillion-for-a-2nd-straight-year\" target=\"_blank\" rel=\"noopener\">ITV News (AP)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Japan and Vietnam agree to deepen economic security and energy ties<\/span><span class=\"cat\">Economy / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Star's ASEAN roundup for 10 November reported that Japan and Vietnam agreed to boost economic security and energy cooperation, and that Vietnam was among 13 countries that kept energy stability (single roundup: unconfirmed).<br><strong>Why it matters:<\/strong> Energy security is a shared priority for Asian importers amid the Iran-war oil squeeze.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/10/asean-news-headlines-as-at-10pm-on-tuesday-nov-10\" target=\"_blank\" rel=\"noopener\">The Star<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Manila prepares to host the ASEAN summit<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Philippine officials were making final preparations for the 49th ASEAN Summit in Pasay City, with Marcos due to inspect the venues.<br><strong>Why it matters:<\/strong> The summit opens this weekend and is expected to be dominated by energy and the South China Sea.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/10/asean-news-headlines-as-at-10pm-on-tuesday-nov-10\" target=\"_blank\" rel=\"noopener\">The Star<\/a>, <a href=\"https://www.bernama.com/en/world/news.php?id=2631572\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Nvidia CEO Huang admits relationship with suspected Chinese-linked executive<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> In a message to staff, Jensen Huang admitted a romantic relationship with Alice Huang, a Megaspeed executive US officials reportedly believe was recruited by Chinese intelligence. Nvidia's board opened an independent investigation and said Huang remained CEO at that point. Nvidia shares tumbled and SoftBank, an AI investor, jumped 15% in Tokyo ahead of earnings on the same day.<br><strong>Why it matters:<\/strong> Nvidia's governance risk hits its Taiwanese, Korean and Japanese suppliers and the US-China chip export debate before the Shenzhen summit.<br><strong>Sources:<\/strong> <a href=\"https://www.morningstar.com/news/dow-jones/20261109444/asian-equities-mostly-rebound-though-sentiment-remains-fragile-update\" target=\"_blank\" rel=\"noopener\">Morningstar / Dow Jones<\/a>, <a href=\"https://www.thestandard.com.hk/finance/article/347978/Nvidias-shares-slide-as-chip-giant-probes-CEO-over-spy-claims\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Najib Razak returns home to begin house arrest<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Former Malaysian prime minister Najib Razak arrived at his Kuala Lumpur residence on 10 November to serve the rest of his graft sentence under house arrest, after a new High Court order replaced one the attorney general had sought to defer. He had been granted conditional clemency by the King in September, and the house arrest runs to August 2028.<br><strong>Why it matters:<\/strong> The decision has already forced a resignation from a senior coalition figure and tests Anwar's unity government.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/10/malaysian-court-clears-former-pm-najib-razak-for-house-arrest-transfer\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://asianews.network/?p=313850\" target=\"_blank\" rel=\"noopener\">Asia News Network<\/a>, <a href=\"https://www.malaymail.com/amp/news/malaysia/2026/11/10/najib-arrives-at-taman-duta-residence-to-begin-his-house-arrest/242755\" target=\"_blank\" rel=\"noopener\">Malay Mail<\/a><\/p>\n<h2 class=\"story\
