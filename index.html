<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1b1d21; --muted:#6b6f78; --line:#e4e0d6;
  --accent:#b4441f; --accent-soft:#f6e6de; --chip:#efece4; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --card:#1f2228; --ink:#eceae4; --muted:#9a9ea8; --line:#2e323a;
    --accent:#f08a5d; --accent-soft:#3a2a22; --chip:#2a2e35; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.date-btn{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;font:inherit}
.date-btn .d{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-btn .d svg{flex:none;opacity:.6}
.nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.oneline{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:4px 0 18px;font-size:16px}
.oneline b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.content h2.story{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:18px;line-height:1.35;margin:0;
  padding:16px 16px 6px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
.content h2.story + p{margin:-1px 0 14px;padding:0 16px 16px;background:var(--card);border:1px solid var(--line);border-top:0;
  border-radius:0 0 16px 16px;box-shadow:var(--shadow);font-size:15px}
.num{flex:none;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;min-width:1.4em}
.ht{flex:1 1 200px}
.cat{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  background:var(--chip);padding:3px 8px;border-radius:999px}
.content strong{font-weight:650}
.content h2:not(.story),.content h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 8px}
.content ul{margin:0 0 12px;padding:0 0 0 20px}
.content li{margin:4px 0}
.content > p{margin:0 0 12px}
.foot{color:var(--muted);font-size:13px;margin-top:28px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* date sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:var(--card);border-radius:20px 20px 0 0;z-index:21;
  transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet h3{margin:0;padding:16px 18px 10px;font-size:15px}
.sheet ul{list-style:none;margin:0;padding:0 8px 12px;overflow:auto}
.sheet li button{width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:10px 10px;border-radius:12px;cursor:pointer}
.sheet li button.cur{background:var(--accent-soft)}
.sheet li .sd{font-weight:650}
.sheet li .sl{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){ .sheet{left:50%;right:auto;width:480px;margin-left:-240px} }
</style>
</head>

<script>
const DATA = [{"date": "2026-11-14", "line": "A tightening US blockade of Iran, a bond sell-off pushing the 10-year yield to 5%, and a shock CEO exit at Nvidia dominate a week in which markets also await Anthropic's record IPO.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US naval blockade of Iran tightens as drone clash hits Bahrain<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US CENTCOM says the blockade has turned away nearly 150 ships, and a new \"Task Force Iron Gate\" targets Iran's land and Caspian routes, though Iraq, Turkey and Pakistan are resisting. On 13 November Iran's IRGC claimed it destroyed a US radar in Bahrain; the US says it shot down two attack drones and denies any radar was lost. Qatar and Pakistan are still mediating, but Rubio called Iran's latest truce terms \"outrageous\".<br><strong>Why it matters:<\/strong> The Gulf standoff keeps oil prices elevated and risks a return to open fighting in a region carrying a large share of global energy supply.<br><strong>Sources:<\/strong> <a href=\"https://www.israelnationalnews.com/news/436040\" target=\"_blank\" rel=\"noopener\">Israel National News<\/a>, <a href=\"https://euronews.com/2026/11/13/irgc-says-it-destroyed-us-radar-in-bahrain-after-attack-on-southern-iran\" target=\"_blank\" rel=\"noopener\">Euronews<\/a>, <a href=\"https://www.cbsnews.com/live-updates/iran-war-us-trump-deal-negotiations/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US 10-year yield tops 5% as a December Fed hike is priced in<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> After hot inflation data, the 10-year Treasury yield touched 5% this week and was around 5.1% on Friday; wholesale inflation is at a near four-year high annually. Futures price a December Fed hike as fully expected, with Governor Waller reportedly open to a 50 bp move.<br><strong>Why it matters:<\/strong> Higher US rates raise borrowing costs worldwide, strengthen the dollar, and pressure equities, emerging markets and Hong Kong, whose currency is pegged to the US dollar.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://www.freepressjournal.in/business/us-bond-yield-crosses-5-as-inflation-surges-december-fed-rate-hike-fears-rattle-global-markets\" target=\"_blank\" rel=\"noopener\">Free Press Journal<\/a>, <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns amid board investigation<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia told the SEC that Huang resigned as CEO and director effective immediately, with CFO Colette Kress as interim CEO. The board had opened an investigation after Huang admitted an affair; some reports mention alleged intelligence-linked contact, which the board said it had no reason to think compromised secrets (unconfirmed). Shares closed about 13% below their 6 November level.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether and a very large weight in US indexes, so leadership turmoil moves the whole tech sector. Earnings are due soon.<br><strong>Sources:<\/strong> <a href=\"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm\" target=\"_blank\" rel=\"noopener\">SEC 8-K<\/a>, <a href=\"https://scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Anthropic nears record AI IPO<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic filed its S-1 on 26 October to list on Nasdaq as \"ANT\". Reports say the offering could raise over $100 billion at a valuation possibly above $2 trillion; the filing shows $33.2 billion revenue for nine months to September. Pricing and first-trade date (between 16 November and Thanksgiving) are not confirmed.<br><strong>Why it matters:<\/strong> It would be among the largest listings ever and a test of investor appetite for AI valuations amid the Nvidia shock.<br><strong>Sources:<\/strong> <a href=\"https://techcrunch.com/2026/10/26/anthropic-officially-files-for-its-public-debut/\" target=\"_blank\" rel=\"noopener\">TechCrunch<\/a>, <a href=\"https://www.renaissancecapital.com/IPO-Center/News/122417/ai-model-developer-anthropic-pbc-files-for-an-estimated-75-billion-ipo\" target=\"_blank\" rel=\"noopener\">Renaissance Capital<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this virus species and second-largest Ebola outbreak ever. It remains a WHO emergency; Kenya reported an imported case on 6 October, while Uganda's outbreak was declared over in August.<br><strong>Why it matters:<\/strong> Regional spread and a high fatality rate strain health systems and raise travel and containment concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">COP31 climate talks under way in Antalya without the US<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The summit opened on 9 November and runs to 20 November, with Turkey hosting and Australia leading negotiations. Finance is the central issue, amid a hot year with an exceptionally strong El Nino. The Trump administration sent no delegation after leaving the Paris Agreement.<br><strong>Why it matters:<\/strong> Climate finance outcomes shape emissions paths and adaptation funding for vulnerable countries, now without US participation.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Russia and Ukraine agree prisoner swap after Abu Dhabi talks<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The two sides agreed to a large prisoner exchange after US-mediated talks in Abu Dhabi. Ukraine also opened a case over Russia's recruitment of foreign nationals, including from Bangladesh, who say they were sent to combat.<br><strong>Why it matters:<\/strong> Humanitarian exchanges are a rare sign of channel-keeping, though no ceasefire has been reported.<br><strong>Sources:<\/strong> <a href=\"https://rightsinrussia.substack.com/p/news-of-the-week-012\" target=\"_blank\" rel=\"noopener\">Rights in Russia weekly<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hong Kong raises 2026 growth forecast to 4.8%<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The government lifted its full-year real GDP forecast to 4.8%, citing strong Q4 momentum; SCMP calls it the best growth since 2021, with external uncertainty remaining.<br><strong>Why it matters:<\/strong> It signals a firmer local recovery, though US rate rises and a strong dollar are headwinds for the HKD-pegged economy.<br><strong>Sources:<\/strong> <a href=\"https://thestandard.com.hk/news/article/348454/Night-Recap-November-13-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Oil caught between blockade and forecast surplus<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> WTI settled near $88.56 and Brent about $95.84. Traders weigh the Iran blockade against a forecast global surplus and rising US inventories.<br><strong>Why it matters:<\/strong> Energy prices feed directly into the inflation that is driving the rate-hike path.<br><strong>Sources:<\/strong> <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a>, <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Dollar near 19-month high, gold and Bitcoin slide<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The dollar hit about 19-month highs while gold fell roughly 2.5% and Bitcoin dropped to its lowest since August.<br><strong>Why it matters:<\/strong> Tightening financial conditions are hitting traditional and speculative havens alike.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,561.67 (-0.40%), Dow 52,347.55 (+0.10%), Nasdaq -0.91% on 13 Nov: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>WTI $88.56, Brent $95.84: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>US 10-year yield about 5.1%: <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/li><li>Bitcoin at lowest since August (no level confirmed): <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/li><li>USD/HKD and Hang Seng: not confirmed in sources found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Anthropic IPO pricing and first trade, possibly from 16 November.<\/li><li>Nvidia earnings and further news on its CEO search.<\/li><li>COP31 finance negotiations through 20 November; December Fed meeting and Iran-Gulf escalation or truce talks.<\/li><\/ul>"}, {"date": "2026-11-13", "line": "Nvidia's CEO resigned and US stocks slipped as Treasury yields hit 5.1%, while Trump's rejection of an Iran deal pushed oil up and Anthropic's record IPO roadshow ran on.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns, leadership reset hits tech<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia announced that Jensen Huang resigned as CEO after a board investigation into his conduct and alleged ties to a suspected Chinese spy; CFO Colette Kress is reported as interim chief. Shares plunged at the open, recovered much of the loss and closed down 4.34%.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether and a huge weight in US indexes, so a founder-CEO exit raises questions about AI spending and the company's direction ahead of earnings.<br><strong>Sources:<\/strong> <a href=\"https://eurasiabusinessnews.com/2026/11/13/stock-market-today-november-12-2026-dow-sp-500-and-nasdaq-fall-after-jensen-huang-resigns/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a>, <a href=\"https://scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.ibtimes.com/nvidia-jensen-huang-succession-plan-investigation-3809602\" target=\"_blank\" rel=\"noopener\">IBTimes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Wall Street slips as 10-year Treasury yield hits 5.10%<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The S&amp;P 500 closed at about 7,592 (-0.35%), the Dow at 52,297 (-0.36%) and the Nasdaq at 25,366 (-0.39%), while small caps fell 1.66%. Treasury yields climbed to 5.10% and the S&amp;P 500 is still up about 2.9% on the week after a rebound.<br><strong>Why it matters:<\/strong> Rising long-term yields raise borrowing costs worldwide and weigh on valuations, especially in tech and small companies.<br><strong>Sources:<\/strong> <a href=\"https://vistapglobal.com/stock-market-today-november-12-2026-stocks-fall-as-treasury-yields-hit-5-10-oil-rises-and-nvidia-faces-leadership-reset-amd-crwv-eprx-googl-modd-msft-nvda-ser-spcx-ttek-ual/\" target=\"_blank\" rel=\"noopener\">Vista PGlobal<\/a>, <a href=\"https://krmg.com/2026/11/12/how-major-us-stock-indexes-fared-thursday-11-12-2026/\" target=\"_blank\" rel=\"noopener\">KRMG / AP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Trump says he is no longer interested in a deal with Iran; oil rises<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Reports say President Trump said he is no longer interested in a deal with Iran, a sharp turn after talk earlier in the week of \"momentum\" following his meeting with Qatar's prime minister. Oil rose on the news.<br><strong>Why it matters:<\/strong> It lowers hopes for a negotiated end to the US-Iran confrontation and keeps risk of renewed fighting and energy disruption in the Gulf alive.<br><strong>Sources:<\/strong> <a href=\"https://vistapglobal.com/stock-market-today-november-12-2026-stocks-fall-as-treasury-yields-hit-5-10-oil-rises-and-nvidia-faces-leadership-reset-amd-crwv-eprx-googl-modd-msft-nvda-ser-spcx-ttek-ual/\" target=\"_blank\" rel=\"noopener\">Vista PGlobal<\/a>, <a href=\"https://www.aljazeera.com/news/liveblog/2026/11/9/iran-war-live-trump-says-war-effectively-over-iran-demands-surrender\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a> (single-source on the reversal, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">First Russia-Ukraine talks in nine months wrap up in Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US-mediated talks between Ukraine and Russia, with envoys Witkoff and Kushner present, ran 10-11 November, the first trilateral round since February. Rubio called them \"very productive\" but urged patience; territory and security guarantees remain the sticking points, and Russia objects to European involvement for now.<br><strong>Why it matters:<\/strong> A restart of direct negotiation is the first diplomatic opening in months, though no ceasefire has been announced.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.dailysabah.com/world/europe/russia-ukraine-resume-us-mediated-peace-talks-after-9-months/amp\" target=\"_blank\" rel=\"noopener\">Daily Sabah<\/a>, <a href=\"https://censor.net/en/news/3587095/russia-and-us-did-not-discuss-peace-plan-in-abu-dhabi-putin-s-aide-ushakov\" target=\"_blank\" rel=\"noopener\">Censor.net<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Anthropic's record IPO roadshow runs, shares set at $70-78<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic launched its roadshow on 10 November to sell 825 million shares at an expected $70 to $78 each, for a Nasdaq listing under \"ANT\". Pricing and trading are expected around 18-20 November, though no final price is confirmed.<br><strong>Why it matters:<\/strong> It is set to be among the largest listings ever and a test of investor appetite for AI valuations as Nvidia's turmoil unsettles the sector.<br><strong>Sources:<\/strong> <a href=\"https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=bn\" target=\"_blank\" rel=\"noopener\">RTTNews<\/a>, <a href=\"https://www.technobezz.com/news/anthropic-ipo-roadshow-shares-price-range\" target=\"_blank\" rel=\"noopener\">Technobezz<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Hot US inflation keeps a December Fed hike in view<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> October consumer prices came in above expectations, and a Treasury 10-year auction drew a high yield on weak demand. Traders are pricing a likely December rate hike by the Federal Reserve.<br><strong>Why it matters:<\/strong> A hiking Fed tightens financial conditions globally and strengthens the dollar, which pressures emerging markets and dollar-pegged Hong Kong.<br><strong>Sources:<\/strong> <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">COP31 leaders' segment in Antalya focuses on finance<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> Day 4 of the UN climate summit (12 November) featured the second day of the Leaders' Summit, with a roundtable on accelerating Paris Agreement implementation and access to finance, plus a business forum. The presidency is split between Turkey and Australia, who have disagreed over who runs negotiations.<br><strong>Why it matters:<\/strong> Climate finance for vulnerable countries is the make-or-break issue, in a year forecast to rank among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://unfccc.int/sites/default/files/resource/COP_31_Overview_Schedule.pdf\" target=\"_blank\" rel=\"noopener\">UNFCCC schedule<\/a>, <a href=\"https://enb.iisd.org/antalya-un-climate-change-conference-cop31\" target=\"_blank\" rel=\"noopener\">Earth Negotiations Bulletin<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this Ebola species. It remains a WHO emergency.<br><strong>Why it matters:<\/strong> The scale and high fatality rate strain health systems and raise regional spread concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Bitcoin and gold weaken on rate-hike fears<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bitcoin fell below $74,000 after a weekend sell-off and was around $74,000 on 10 November, with gold near $4,100. Both pulled back as US inflation data raised rate-hike expectations (latest levels found are from 10 November).<br><strong>Why it matters:<\/strong> Even traditional and speculative havens are losing ground as yields rise.<br><strong>Sources:<\/strong> <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a>, <a href=\"https://news.bitcoin.com/price-predictions/cathie-wood-gold-going-down-bitcoin/\" target=\"_blank\" rel=\"noopener\">Bitcoin.com<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong shares soft, Cathay orders 14 more jets<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng index was around 24,400 earlier in the week, and Cathay Pacific ordered 14 more aircraft; Hong Kong also readies its largest-ever WinterFest. Hong Kong news dated specifically 12 November was not found (unconfirmed timing).<br><strong>Why it matters:<\/strong> Hong Kong markets track US yields and the dollar peg, so US rate moves matter locally.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://minkabu.jp/news/4655145\" target=\"_blank\" rel=\"noopener\">Minkabu<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,592.40 (-0.35%), Dow 52,297.09 (-0.36%), Nasdaq 25,366.09 (-0.39%), Nvidia -4.34%: <a href=\"https://krmg.com/2026/11/12/how-major-us-stock-indexes-fared-thursday-11-12-2026/\" target=\"_blank\" rel=\"noopener\">KRMG / AP<\/a><\/li><li>US Treasury yields up to about 5.10%: <a href=\"https://vistapglobal.com/stock-market-today-november-12-2026-stocks-fall-as-treasury-yields-hit-5-10-oil-rises-and-nvidia-faces-leadership-reset-amd-crwv-eprx-googl-modd-msft-nvda-ser-spcx-ttek-ual/\" target=\"_blank\" rel=\"noopener\">Vista PGlobal<\/a><\/li><li>Bitcoin about $74,000 and gold about $4,120 (10 Nov levels): <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/li><li>Oil rose on 12 Nov; settlement levels not confirmed.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Anthropic IPO pricing and first trade, expected around 18-20 November.<\/li><li>Nvidia's CEO search and upcoming earnings.<\/li><li>COP31 finance talks to 20 November; US wholesale inflation data and December Fed meeting; any US-Iran escalation.<\/li><\/ul>"}, {"date": "2026-11-12", "line": "AI stocks rebounded on Wall Street while Nvidia's CEO probe deepened, as Russia and Ukraine held their first direct talks in nine months and Trump held off new Iran strikes but kept the blockade.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Russia and Ukraine hold first trilateral talks in nine months<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US-mediated talks opened in Abu Dhabi on 10 November, with envoys Witkoff and Kushner present, Ukraine's team led by Rustem Umerov and Russia's by Medinsky. The first session lasted about four hours and the two-day round ended 11 November; Rubio said the talks looked \"very productive\" but urged patience. Territory and security guarantees remain the main disputes.<br><strong>Why it matters:<\/strong> It is the first direct diplomatic opening on the war since February, though no ceasefire or deal has been announced.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.dailysabah.com/world/europe/russia-ukraine-resume-us-mediated-peace-talks-after-9-months/amp\" target=\"_blank\" rel=\"noopener\">Daily Sabah<\/a>, <a href=\"https://www.inquirer.com/news/nation-world/russia-ukraine-peace-talks-abu-dhabi-putin-zelesnky-kushner-trump-20261110.html\" target=\"_blank\" rel=\"noopener\">Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Trump holds off new Iran strikes but keeps the naval blockade<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> After meeting Qatar's prime minister, Trump said he would hold off on new strikes for now and keep the Hormuz-area naval blockade in place, claiming Gulf states prefer the status quo. He also said Iran's military is effectively finished, which Iranian officials rejected; Tehran says no deal is possible unless the blockade is lifted. Qatar has proposed a 48-hour, two-stage plan combining nuclear inspections with reopening the Strait of Hormuz.<br><strong>Why it matters:<\/strong> The standoff keeps a major share of the world's oil trade at risk, with talks stalled between sharply different terms.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/gulf/trump-uae-qatar-saudi-arabia-iran-conflict-hormuz-blockade\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://www.aljazeera.com/news/liveblog/2026/11/9/iran-war-live-trump-says-war-effectively-over-iran-demands-surrender\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://dropsitenews.com/p/trump-says-iran-war-militarily-is\" target=\"_blank\" rel=\"noopener\">Dropsite News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Rebounding AI stocks lift Wall Street<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> AP reported the S&amp;P 500 up 1.6% and the Nasdaq up 2.2% on 11 November as AI-linked shares recovered from the previous sell-off; CoreWeave jumped about 26%. Breadth was weak, with more S&amp;P stocks falling than rising. Other recaps give smaller gains, so exact levels are unconfirmed. The bond market was closed for Veterans Day.<br><strong>Why it matters:<\/strong> The rebound followed the worst day for US stocks since 2025 and shows how sensitive markets are to AI sentiment.<br><strong>Sources:<\/strong> <a href=\"https://www.bnnbloomberg.ca/markets/2026/11/11/rebounding-ai-stocks-lift-wall-street/\" target=\"_blank\" rel=\"noopener\">BNN Bloomberg / AP<\/a>, <a href=\"https://www.alainguillot.com/stock-market-recap-november-11-2026/\" target=\"_blank\" rel=\"noopener\">Alain Guillot recap<\/a>, <a href=\"https://pro.thestreet.com/stock-market-today/2026-11-11\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Nvidia CEO probe deepens, with lawsuit and congressional pressure<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia's board is running an independent investigation of Jensen Huang over reports he was targeted by a foreign intelligence effort, and the stock has fallen for several sessions. A class action has been filed, Senator Kevin Cramer called on Huang to resign, and House committee chairs asked him to confirm by 11 November a closed-door briefing on 18 November. Nvidia reports quarterly results on 17 November.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether, so governance doubt around its founder-CEO weighs on the whole sector.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/economy/2026/11/9/nvidia-shares-slump-amid-investigation-into-ceo-jensen-huang\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://stocktwits.com/news-articles/markets/equity/nvidia-faces-class-action-suit-over-huang-allegations-senator-seeks-probe-analyst-puts-ceo-exit-odds-at-15/cNGuT97R97g\" target=\"_blank\" rel=\"noopener\">Stocktwits<\/a>, <a href=\"https://www.scmp.com/tech/big-tech/article/3373825/nvidia-faces-defining-test-jensen-huang-probe-adds-chip-stock-turbulence\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Hotter-than-expected US inflation fuels rate-hike bets<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> US consumer prices for October rose more than economists expected, and a 10-year Treasury auction drew a high yield on below-average demand. Traders are pricing a likely December Federal Reserve rate hike.<br><strong>Why it matters:<\/strong> Higher US rates raise borrowing costs globally and pressure risk assets, emerging markets and Hong Kong's dollar-pegged economy.<br><strong>Sources:<\/strong> <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Anthropic launches record IPO roadshow<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic launched its roadshow on 10 November for 825 million shares at an expected $70 to $78 each, with a Nasdaq listing under \"ANT\". Reports point to pricing and first trading around 18-20 November, though nothing is final.<br><strong>Why it matters:<\/strong> It would be one of the largest listings in history and a gauge of investor appetite for AI valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=bn\" target=\"_blank\" rel=\"noopener\">RTTNews<\/a>, <a href=\"https://www.technobezz.com/news/anthropic-ipo-roadshow-shares-price-range\" target=\"_blank\" rel=\"noopener\">Technobezz<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">COP31 leaders' summit opens in Antalya amid finance dispute<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The leaders' segment of the UN climate talks began on 11 November, with UN chief Guterres urging leaders to \"get serious\" about the climate crisis. Climate finance emerged as an early fight, and Turkey and Australia share the presidency. The US sent no official delegation, though a congressional group is expected.<br><strong>Why it matters:<\/strong> Funding for poorer countries is the central test of the talks, in a year forecast among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://gulftoday.ae/news/2026/11/11/world-leaders-begin-talks-at-un-climate-conference\" target=\"_blank\" rel=\"noopener\">Gulf Today<\/a>, <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">After the US midterms, tech and trade partners recalibrate<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Following the 3 November midterms, in which Democrats made gains, commentary says tech leaders who had planned to wield political influence are now in a \"defensive crouch\". Canada's prime minister says Trump remains central to trade talks despite the Democratic wins. Detail on both is thin (unconfirmed).<br><strong>Why it matters:<\/strong> The result shapes US trade, regulation and spending policy for the next two years.<br><strong>Sources:<\/strong> <a href=\"https://theweek.com/edition/theweekus-evening-review-2026-11-11-222409\" target=\"_blank\" rel=\"noopener\">The Week US<\/a>, <a href=\"https://www.bostonglobe.com/world/?p1=BGMenu_Sections\" target=\"_blank\" rel=\"noopener\">Boston Globe<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this species and still a WHO emergency.<br><strong>Why it matters:<\/strong> High fatality and regional spread risk strain health systems and travel controls.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong: Cathay orders 14 more jets, Nomura weighs equity rebuild<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> Cathay Pacific ordered 14 more aircraft, bringing its deliveries total to 120, while Nomura is reportedly weighing rebuilding its Hong Kong equity capital markets business. Two Chinese chip firms, Denglin and Xinde, had mixed Hong Kong debuts the day before.<br><strong>Why it matters:<\/strong> It signals continued confidence in Hong Kong aviation and a lively listings market.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard, 11 Nov<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard, 10 Nov<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 +1.6%, Nasdaq +2.2% on 11 Nov (AP; other recaps show smaller gains): <a href=\"https://www.bnnbloomberg.ca/markets/2026/11/11/rebounding-ai-stocks-lift-wall-street/\" target=\"_blank\" rel=\"noopener\">BNN Bloomberg / AP<\/a><\/li><li>Bitcoin about $74,000 and gold about $4,120 (10 Nov): <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/li><li>Hang Seng opened about 24,354 on 11 Nov: <a href=\"https://minkabu.jp/news/4655145\" target=\"_blank\" rel=\"noopener\">Xinhua via search summary<\/a><\/li><li>Oil and Treasury yield closes: not confirmed (bond market closed 11 Nov).<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Nvidia earnings on 17 November and the 18 November congressional briefing.<\/li><li>Anthropic IPO pricing, expected around 18-20 November.<\/li><li>Any Iran deal or escalation; COP31 finance talks through 20 November.<\/li><\/ul>"}, {"date": "2026-11-11", "line": "Hotter-than-expected US inflation knocked Wall Street and sharpened bets on a December Fed hike, as Nvidia's CEO scandal escalated, Russia and Ukraine returned to the table in Abu Dhabi and Trump signalled he would pause Iran strikes.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hot US inflation hits stocks and lifts rate-hike bets<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> US consumer prices rose 0.4% in October against 0.3% expected, with core prices up 0.3% against 0.2% expected. The S&amp;P 500 closed at 7,520.93 (-0.38%), the Dow at 52,231.89 (-0.30%) and the Nasdaq at 25,065.87 (-0.74%), reversing Monday's rally; the 2-year Treasury yield jumped to 4.73%. A weak 10-year Treasury auction added to the pressure.<br><strong>Why it matters:<\/strong> Sticky inflation makes a December Fed rate hike more likely, raising borrowing costs worldwide and pressuring tech valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.staradvertiser.com/2026/11/10/breaking-news/wall-street-falls-as-hot-inflation-fuels-fed-rate-hike-fears/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / AP<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a>, <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Russia and Ukraine resume US-mediated talks in Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trilateral talks opened on 10 November, the first since February, with US envoys Witkoff and Kushner, Ukraine's Rustem Umerov and Russia's Medinsky. The first session lasted about four hours; the main disputes are territory and security guarantees, and Russia objects to European participation for now.<br><strong>Why it matters:<\/strong> Direct talks restarting after nine months is the first diplomatic opening in the war in some time, though no deal is near.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.dailysabah.com/world/europe/us-mediated-russia-ukraine-dialogue-to-end-war-kicks-off-in-uae/amp\" target=\"_blank\" rel=\"noopener\">Daily Sabah<\/a>, <a href=\"https://www.inquirer.com/news/nation-world/russia-ukraine-peace-talks-abu-dhabi-putin-zelesnky-kushner-trump-20261110.html\" target=\"_blank\" rel=\"noopener\">Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Trump says he will hold off Iran strikes but keep blockade<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> After talks with Qatar's prime minister, Trump said he would pause new strikes for now and keep the naval blockade, adding that Iran's military is effectively finished; Iranian officials dismissed that and its security chief called reports of talks fake news. Iran says no deal is possible unless the blockade ends, while Qatar has put forward a 48-hour plan pairing nuclear inspections with reopening the Strait of Hormuz.<br><strong>Why it matters:<\/strong> Hormuz shipping and oil prices hinge on whether this diplomacy produces a deal or a return to strikes.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/gulf/trump-uae-qatar-saudi-arabia-iran-conflict-hormuz-blockade\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://dropsitenews.com/p/trump-says-iran-war-militarily-is\" target=\"_blank\" rel=\"noopener\">Dropsite News<\/a>, <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Nvidia falls about 5.5% as CEO scandal grows<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia shares dropped roughly 5.5% as the board's independent investigation into CEO Jensen Huang continued, a class action was filed and Senator Kevin Cramer called on him to resign. House committee chairs asked Huang to attend a closed-door briefing on 18 November; Nvidia reports earnings on 17 November.<br><strong>Why it matters:<\/strong> The AI-chip leader's governance crisis weighs on the sector that has driven much of the market's gains.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/economy/2026/11/9/nvidia-shares-slump-amid-investigation-into-ceo-jensen-huang\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://stocktwits.com/news-articles/markets/equity/nvidia-faces-class-action-suit-over-huang-allegations-senator-seeks-probe-analyst-puts-ceo-exit-odds-at-15/cNGuT97R97g\" target=\"_blank\" rel=\"noopener\">Stocktwits<\/a>, <a href=\"https://fool.com/investing/2026/11/10/why-nvidia-stock-fell-again-on-tuesday\" target=\"_blank\" rel=\"noopener\">Motley Fool<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Anthropic launches IPO roadshow at $70-78 a share<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic began its roadshow on 10 November, offering 825 million shares at an expected $70 to $78 each under the Nasdaq ticker \"ANT\". Reports point to pricing and trading around 18-20 November, but nothing is final.<br><strong>Why it matters:<\/strong> It would be among the biggest listings ever and tests investor appetite for AI valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=bn\" target=\"_blank\" rel=\"noopener\">RTTNews<\/a>, <a href=\"https://www.technobezz.com/news/anthropic-ipo-roadshow-shares-price-range\" target=\"_blank\" rel=\"noopener\">Technobezz<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">COP31 climate talks under way in Antalya, finance in dispute<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The UN climate summit opened on 9 November, with the leaders' segment due 11-12 November and talks running to 20 November. UN chief Guterres urged leaders to \"get serious\", disagreements over climate finance surfaced early, and the US sent no official delegation.<br><strong>Why it matters:<\/strong> Financing for vulnerable countries decides whether commitments become action, in a year forecast to be among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a>, <a href=\"https://enb.iisd.org/antalya-un-climate-change-conference-cop31\" target=\"_blank\" rel=\"noopener\">Earth Negotiations Bulletin<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">EU budget row over Ukraine aid ahead of 20 November summit<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> European Council president Costa replied to German Chancellor Merz's letter linking an EU budget deal to a deal on Ukraine aid, adding a new hurdle before the 20 November summit. Separately, the EU is also committing 10 million euros to Bulgarian rescue work in the Black Sea, where drone attacks endanger shipping.<br><strong>Why it matters:<\/strong> How Europe funds Ukraine will shape its war effort as peace talks restart.<br><strong>Sources:<\/strong> <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">European supermarkets hit by cyberattacks<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Supermarkets in at least 12 European countries were hit by cyberattacks in October and November, with France worst affected. The EU's cyber chief warned that home appliances could be targeted next.<br><strong>Why it matters:<\/strong> Attacks on retail and connected devices show growing risk to everyday supply chains.<br><strong>Sources:<\/strong> <a href=\"https://www.euronews.com/2026/11/10\" target=\"_blank\" rel=\"noopener\">Euronews<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this species and still a WHO emergency. Separately, a study of over 440,000 Americans linked cannabis use to higher cardiovascular risk (preliminary, single source).<br><strong>Why it matters:<\/strong> The outbreak's scale strains health systems and raises regional spread concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed), <a href=\"https://sciencedaily.com/news/health_medicine/sports_medicine\" target=\"_blank\" rel=\"noopener\">ScienceDaily<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong: Chinese chip firms debut mixed, WinterFest prepares<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> Chinese chip firms Denglin and Xinde had mixed debuts in Hong Kong on 10 November, and the city is preparing its largest-ever WinterFest as A Symphony of Lights nears its final show.<br><strong>Why it matters:<\/strong> Chip listings show Hong Kong's role as a fundraising hub for Chinese tech, though first-day moves were uneven.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,520.93 (-0.38%), Dow 52,231.89 (-0.30%), Nasdaq 25,065.87 (-0.74%) on 10 Nov: <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/li><li>US 2-year yield 4.73%: <a href=\"https://www.staradvertiser.com/2026/11/10/breaking-news/wall-street-falls-as-hot-inflation-fuels-fed-rate-hike-fears/\" target=\"_blank\" rel=\"noopener\">Honolulu Star-Advertiser / AP<\/a><\/li><li>Bitcoin about $74,051, gold about $4,120 (Asian session 10 Nov): <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/li><li>Oil settlement levels and Hang Seng close: not confirmed.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Outcome of the Abu Dhabi talks, and any Iran deal or renewed strikes.<\/li><li>Nvidia earnings on 17 November and the 18 November congressional briefing.<\/li><li>Anthropic IPO pricing, COP31 finance talks and the 20 November EU summit.<\/li><\/ul>"}, {"date": "2026-11-08", "line": "A week of Democratic midterm gains, renewed US strikes in the Strait of Hormuz and a violent AI-stock sell-off ended with Wall Street mixed after a hot US jobs report.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump says \"no oil going to Iran\" as US strikes continue near Hormuz<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> On 7 November Trump said the US blockade has full control of the Strait of Hormuz and that no oil is reaching Iran. US Central Command said it struck a St. Kitts-flagged cargo ship that tried to break the blockade in the Gulf of Oman, and Trump confirmed limited strikes on an Iranian air-defence site on Qeshm Island late on 6 November. Iranian media said the IRGC had lifted its self-imposed 2,000 km missile-range limit.<br><strong>Why it matters:<\/strong> The Gulf standoff keeps energy markets on edge and the risk of wider war high, even as Qatar pushes an interim deal.<br><strong>Sources:<\/strong> <a href=\"https://saharareporters.com/2026/11/07/trump-insists-strait-hormuz-blockade-claims-nothing-going-iran-no-oil-going-there\" target=\"_blank\" rel=\"noopener\">Sahara Reporters<\/a>, <a href=\"https://aljazeera.com/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.rferl.org/a/iran-live-blog-trump-middle-east/33803414.html\" target=\"_blank\" rel=\"noopener\">RFE/RL<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Democrats take Congress; Republicans blame the Iran war<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrats won the House and Senate in the 3 November midterms, with record turnout of more than 124 million ballots and Hakeem Jeffries set to become Speaker in January. Vice President Vance said Republicans lost because of the Iran war, and Trump said he would veto Democratic bills. Some Senate races, such as Alaska and Mississippi, were still being finalised.<br><strong>Why it matters:<\/strong> Divided government limits Trump's agenda, including war funding, and raises pressure for a diplomatic exit from the Iran conflict.<br><strong>Sources:<\/strong> <a href=\"https://www.wsoctv.com/news/trending/election-2026-democrats-capture-both-houses-congress/5ILOWTVABVDPZFYP7VBBCX4EWE/\" target=\"_blank\" rel=\"noopener\">WSOC/Cox Media<\/a>, <a href=\"https://www.washingtonexaminer.com/news/campaigns/4791815/takeaways-2026-midterm-elections/\" target=\"_blank\" rel=\"noopener\">Washington Examiner<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">US adds 165,000 jobs; Wall Street ends a rough week mixed<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> October payrolls rose 165,000 against about 65,000 expected, and unemployment fell to 4.1%. On Friday the S&amp;P 500 closed at 7,376.86 (+0.31%), the Nasdaq at 24,579.42 (+1.09%) and the Dow at 51,285.73 (-0.46%). For the week the S&amp;P 500 lost 2.7%, the Dow 0.9% and the Nasdaq 3.4%.<br><strong>Why it matters:<\/strong> A strong labour market keeps pressure on the Fed to keep rates high at a time of war-driven inflation.<br><strong>Sources:<\/strong> <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a>, <a href=\"https://econotimes.com/U-S-Adds-165-000-Jobs-in-October-as-Wall-Street-Ends-Week-Lower-1772683\" target=\"_blank\" rel=\"noopener\">EconoTimes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">AI and chip stocks whipsaw after Thursday's rout<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> After a Thursday sell-off, reported to have taken the Nasdaq down more than 5% amid fears of tighter AI regulation under a Democratic Congress, tech stocks rebounded on Friday. Sources differ on the exact size of Thursday's fall, and the Nasdaq entered a technical correction from its October high.<br><strong>Why it matters:<\/strong> Heavy AI-related valuations now drive US indexes, so policy and earnings surprises move global markets.<br><strong>Sources:<\/strong> <a href=\"https://theedgemalaysia.com/node/824763\" target=\"_blank\" rel=\"noopener\">Edge Malaysia<\/a>, <a href=\"https://www.zacks.com/stock/news/3025392/stock-market-news-for-nov-6-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Oil swings on Iran diplomacy; Brent near the low $90s to high $90s<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Brent fell sharply earlier in the week on hopes a Democratic Congress will push an end to the war, then rebounded as talks stalled. One analyst note put Brent down about 18% in a week from highs above $110; Brent settled near $97.79 on Thursday and WTI near $90.18 (single source).<br><strong>Why it matters:<\/strong> Fuel prices feed inflation and political pressure on the White House.<br><strong>Sources:<\/strong> <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a>, <a href=\"https://www.al-monitor.com/index%2ephp/originals/2026/11/gulf-markets-gain-oil-falls-democrats-win-congress\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a> (unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak grows in DR Congo<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> WHO's 6 November bulletin, with data to 3 November, counted 10,668 confirmed cases and 5,198 deaths, including 1,463 new cases in 21 days, mostly in Ituri and North Kivu. It is the second-largest Ebola outbreak on record.<br><strong>Why it matters:<\/strong> Continued spread in eastern Congo and cases in neighbouring countries strain health systems and raise regional risk.<br><strong>Sources:<\/strong> <a href=\"https://who.int/emergencies/disease-outbreak-news/item/2026-DON618\" target=\"_blank\" rel=\"noopener\">WHO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">US-Russia-Ukraine talks set for Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Kremlin confirmed Russia will join US-mediated trilateral talks with Ukraine in Abu Dhabi on 10-11 November, the first such round in months. Trump also said Ukraine agreed not to strike Russian energy targets (unconfirmed).<br><strong>Why it matters:<\/strong> It is a rare diplomatic opening, though territory and security guarantees remain unresolved.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.fdd.org/overnight-brief/november-4-2026/\" target=\"_blank\" rel=\"noopener\">FDD<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Judge blocks Trump's triumphal arch<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Judge Tanya Chutkan issued a 14-day order stopping work on the planned arch near Arlington Memorial Circle, shortly after a federal planning commission approved it. She said construction would likely harm Washington and Virginia and may be unlawful.<br><strong>Why it matters:<\/strong> It is an early test of legal limits on Trump's building plans.<br><strong>Sources:<\/strong> <a href=\"https://www.wlox.com/2026/11/06/federal-judge-orders-14-day-delay-any-work-beginning-trumps-monumental-arch/\" target=\"_blank\" rel=\"noopener\">WLOX<\/a>, <a href=\"https://politicalwire.com/2026/11/06/judge-blocks-trumps-arch-after-federal-panel-approves-it/\" target=\"_blank\" rel=\"noopener\">Political Wire<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hang Seng falls on Friday but gains 5% on the week<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed at 24,481.86, down 1.27%, with the tech index down 1.83%, but it rose 5.10% over the week. Hong Kong also expects a strong cold front on Monday, with urban temperatures forecast to drop about 9 degrees.<br><strong>Why it matters:<\/strong> Hong Kong markets are swinging with US rates, tech sentiment and Iran headlines.<br><strong>Sources:<\/strong> <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347896/Night-Recap-November-8-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Bitcoin slips to about $76,000; Leeds beat Spurs<\/span><span class=\"cat\">Markets / Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bitcoin ended the week near $75,916, down 2.1%, after briefly hitting $81,196 on a post-election bounce, while gold was fixed around $4,113 on 5 November. In the Premier League, Leeds beat Tottenham 1-0 on Saturday and Everton beat Coventry 3-1 on Friday (single source, unconfirmed).<br><strong>Why it matters:<\/strong> Risk assets stay volatile as rate and war expectations shift.<br><strong>Sources:<\/strong> <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://english.ahram.org.eg/News/581763.aspx\" target=\"_blank\" rel=\"noopener\">Ahram Online<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,376.86, Dow 51,285.73, Nasdaq 24,579.42 (Fri 6 Nov): <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a><\/li><li>Hang Seng 24,481.86 (-1.27%): <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Bitcoin about $75,916 weekly close: <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><li>Gold $4,112.85 (LBMA fix, 5 Nov): <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><li>Brent around $97.79, WTI $90.18 (5 Nov): <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Russia-Ukraine-US talks in Abu Dhabi, 10-11 November.<\/li><li>COP31 climate summit opening in Antalya on 9 November.<\/li><li>Iran-US strikes and Qatar-led mediation; US inflation data later in the week.<\/li><\/ul>"}, {"date": "2026-11-07", "line": "A blowout US jobs report, a Bank of England rate rise and fresh US strikes near Iran headlined a Friday that followed the week's AI-stock rout and Democratic midterm sweep.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US strikes Iran's Qeshm Island as Trump says talks are \"progressing very well\"<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump confirmed limited US strikes that destroyed Iranian air-defence artillery on Qeshm Island, in the Strait of Hormuz, calling them minor. Earlier on 6 November he said talks with Iranian representatives were going very well, while the IRGC Navy said Hormuz would stay closed until Iran's conditions are met. Qatar is pushing an interim deal to halt escalation, and dates for some Qeshm strikes differ across outlets.<br><strong>Why it matters:<\/strong> The simultaneous strikes and diplomacy show how fragile the Gulf standoff is for global energy supply.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://scmp.com/news/world/middle-east/article/3373633/trump-confirms-fresh-iran-strikes-days-after-voters-punish-war-polls\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.rferl.org/a/iran-live-blog-trump-middle-east/33803414.html\" target=\"_blank\" rel=\"noopener\">RFE/RL<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US adds 165,000 jobs, well above forecasts<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> October payrolls rose 165,000 versus roughly 65,000 expected, and unemployment dipped from 4.2% to 4.1%. The dollar climbed and traders cut bets on near-term rate relief. The S&amp;P 500 closed at 7,376.86 (+0.31%), the Nasdaq at 24,579.42 (+1.09%) and the Dow at 51,285.73 (-0.46%).<br><strong>Why it matters:<\/strong> A hot labour market, with war-driven inflation, makes Fed easing unlikely and keeps borrowing costs high.<br><strong>Sources:<\/strong> <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a>, <a href=\"https://econotimes.com/U-S-Adds-165-000-Jobs-in-October-as-Wall-Street-Ends-Week-Lower-1772683\" target=\"_blank\" rel=\"noopener\">EconoTimes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Bank of England raises rates to 4%<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The BoE lifted Bank Rate by 25 basis points to 4.00%, its first hike since 2023, citing energy-driven inflation. Staff project inflation near 5% by mid-2027; reports differ on the vote (most say 8-1, one says 9-0). Sterling barely reacted.<br><strong>Why it matters:<\/strong> It shows major central banks tightening again because of the Middle East energy shock.<br><strong>Sources:<\/strong> <a href=\"https://tradingeconomics.com/united-kingdom/interest-rate/news/598618\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a>, <a href=\"https://kuwaittimes.com/article/53075/business/boe-lifts-rate-for-first-time-since-2023-to-curb-prices/\" target=\"_blank\" rel=\"noopener\">Kuwait Times<\/a>, <a href=\"https://www.babypips.com/analysis/headline-boe-hiked-rates-why-gbp-just-shrugged-2026-11-06\" target=\"_blank\" rel=\"noopener\">BabyPips<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Tech rebounds after Thursday's AI sell-off<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Chip and AI stocks recovered on Friday after a Thursday rout that reports put at over 5% for the Nasdaq, driven by fears a Democratic Congress will regulate AI and by valuation worries. Sources disagree on the size of Thursday's fall. For the week the Nasdaq lost 3.4%.<br><strong>Why it matters:<\/strong> AI shares carry huge weight in US indexes, so regulatory risk now moves broad markets.<br><strong>Sources:<\/strong> <a href=\"https://theedgemalaysia.com/node/824763\" target=\"_blank\" rel=\"noopener\">Edge Malaysia<\/a>, <a href=\"https://www.zacks.com/stock/news/3025392/stock-market-news-for-nov-6-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Democrats' Congress sweep reshapes Washington<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> With both chambers flipped, Hakeem Jeffries is set to be Speaker and House Democrats are on track for their largest majority in nearly two decades. Trump says he will veto Democratic bills; Jeffries urged him to end the Iran war before the new Congress starts. A White House request for $67 billion in Iran war funding is pending.<br><strong>Why it matters:<\/strong> The result limits Trump's ability to fund the war or pass his agenda.<br><strong>Sources:<\/strong> <a href=\"https://www.nbcsandiego.com/elections/election-day-after-2026-midterms-congress-results-live-updates/4096585/\" target=\"_blank\" rel=\"noopener\">NBC San Diego<\/a>, <a href=\"https://www.argusmedia.com/en/news-and-insights/latest-market-news/2901877-trump-faces-new-limits-after-midterms-blowout\" target=\"_blank\" rel=\"noopener\">Argus Media<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Judge halts Trump's planned triumphal arch for 14 days<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Judge Tanya Chutkan issued a temporary order after a federal planning commission approved the arch near Arlington Memorial Circle. She found construction likely to harm Washington and Virginia and said the arch is \"a tribute to Donald Trump.\"<br><strong>Why it matters:<\/strong> It tests the limits of executive power over federal land and building projects.<br><strong>Sources:<\/strong> <a href=\"https://www.wlox.com/2026/11/06/federal-judge-orders-14-day-delay-any-work-beginning-trumps-monumental-arch/\" target=\"_blank\" rel=\"noopener\">WLOX<\/a>, <a href=\"https://www.wwno.org/npr-news/2026-11-05/a-judge-blocked-construction-of-trumps-arch-at-the-11th-hour-whats-next\" target=\"_blank\" rel=\"noopener\">NPR via WWNO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">WHO: Ebola in DR Congo passes 10,600 cases<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> WHO's 6 November bulletin reported 10,668 confirmed cases and 5,198 deaths of the Bundibugyo strain, with 1,463 new cases in 21 days, mostly in Ituri and North Kivu. Cases have reached Uganda, Kenya and Nigeria; Kenya has begun a 42-day countdown toward being declared Ebola-free.<br><strong>Why it matters:<\/strong> It is the second-largest Ebola outbreak ever recorded and is still growing in the east.<br><strong>Sources:<\/strong> <a href=\"https://who.int/emergencies/disease-outbreak-news/item/2026-DON618\" target=\"_blank\" rel=\"noopener\">WHO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hang Seng drops 1.27% after a big week<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng closed at 24,481.86, down 315 points, with the tech index off 1.83% on a HK$247 billion turnover. It still gained 5.1% over the week, helped by a 3.67% jump on Thursday to 24,796.98.<br><strong>Why it matters:<\/strong> Hong Kong stocks are swinging sharply with US tech and rate news.<br><strong>Sources:<\/strong> <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua (6 Nov)<\/a>, <a href=\"https://www.news.cn/fortune/20261105/30dca13060c845e8aeb2926ad0009301/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua (5 Nov)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Oil whipsaws on peace hopes; Bitcoin stuck near $76,000<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Oil crashed on hopes that Democrats will push an end to the war, then rebounded as talks stalled, with Brent near $98 on Thursday. Bitcoin hovered around $76,000 after a brief post-election spike above $81,000, and gold was fixed near $4,113 on Thursday.<br><strong>Why it matters:<\/strong> Energy and crypto both trade on war-and-politics headlines, feeding inflation worries.<br><strong>Sources:<\/strong> <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a>, <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Premier League: Everton beat Coventry 3-1<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Everton beat Coventry City 3-1 on Friday night in Matchday 10, with Leeds and Tottenham due to play on Saturday (single source, unconfirmed).<br><strong>Why it matters:<\/strong> The weekend fixtures shape the early-season table.<br><strong>Sources:<\/strong> <a href=\"https://english.ahram.org.eg/News/581763.aspx\" target=\"_blank\" rel=\"noopener\">Ahram Online<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,376.86, Dow 51,285.73, Nasdaq 24,579.42 (6 Nov): <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a><\/li><li>Hang Seng 24,481.86 (-1.27%): <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Brent about $97.79, WTI $90.18 (5 Nov): <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a><\/li><li>Bitcoin about $76,000 (weekly close $75,916): <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><li>Gold $4,112.85 (LBMA fix, 5 Nov): <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Further US-Iran strikes and Qatar-led mediation over the weekend.<\/li><li>COP31 climate summit opening in Antalya on 9 November.<\/li><li>US-Russia-Ukraine talks in Abu Dhabi on 10-11 November.<\/li><\/ul>"}, {"date": "2026-11-06", "line": "Wall Street suffered its worst day in over a year as AI and chip stocks collapsed, while the Bank of England raised rates and Washington absorbed a Democratic midterm sweep.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">AI and chip rout hits Wall Street, Nasdaq enters correction<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Thursday US stocks fell sharply, led by chips and AI names a day after a post-election rally. One recap has the Nasdaq Composite down 5.5% to 24,315.00 and the S&amp;P 500 down 4.4% to 7,353.73, with all Dow components lower and a chip index down about 12%; sources differ on the exact figures. Nvidia fell around 8% and Qualcomm about 9% after a weak smartphone-chip forecast, while investors also feared tighter AI regulation under a Democratic Congress.<br><strong>Why it matters:<\/strong> AI-linked stocks dominate US indexes, so the sell-off hits retirement savings and risk appetite worldwide.<br><strong>Sources:<\/strong> <a href=\"https://www.zacks.com/stock/news/3025392/stock-market-news-for-nov-6-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a>, <a href=\"https://investinglive.com/stocks/nasdaq-100-suffers-worst-day-since-2020/\" target=\"_blank\" rel=\"noopener\">Investing Live<\/a>, <a href=\"https://theedgemalaysia.com/node/824756\" target=\"_blank\" rel=\"noopener\">Edge Malaysia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Bank of England raises Bank Rate to 4%<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The BoE raised rates by 25 basis points from 3.75% to 4.00%, its first hike since August 2023, citing energy-price inflation from the Middle East conflict. Staff see inflation near 5% in the second quarter of 2027; most reports say the vote was 8-1, though one says 9-0.<br><strong>Why it matters:<\/strong> A major central bank is tightening because of the war-driven energy shock, a warning for other economies.<br><strong>Sources:<\/strong> <a href=\"https://tradingeconomics.com/united-kingdom/interest-rate/news/598618\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a>, <a href=\"https://investinglive.com/central-banks/bank-of-england-raises-the-bank-rate-to-4-00-as-expected-in-a-9-0-vote/\" target=\"_blank\" rel=\"noopener\">Investing Live<\/a>, <a href=\"https://kuwaittimes.com/article/53075/business/boe-lifts-rate-for-first-time-since-2023-to-curb-prices/\" target=\"_blank\" rel=\"noopener\">Kuwait Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Vance leads quiet push for a new Iran deal; Putin meets Iranian security chief<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Axios reports Vice President Vance has spent two weeks in indirect talks with Iran aimed at a ceasefire and resumed nuclear negotiations, including a letter to Iran's security council secretary Mohsen Rezaei. Vance said \"progress\" had been made. Iranian officials were sceptical, and Iran International says Putin met Rezaei in Moscow on 5 November.<br><strong>Why it matters:<\/strong> Diplomacy is advancing alongside strikes near Hormuz, and Russia and China are positioning themselves as Iran's backers.<br><strong>Sources:<\/strong> <a href=\"https://www.axios.com/2026/11/06/vance-leads-push-new-iran-deal\" target=\"_blank\" rel=\"noopener\">Axios<\/a>, <a href=\"https://bernama.com/en/world/news.php?id=2629268\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://www.iranintl.com/en/202611053453\" target=\"_blank\" rel=\"noopener\">Iran International<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Democrats win Congress; Republicans blame the war<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrats captured both chambers, with reports of a Senate majority near 54 seats and the biggest House majority in almost two decades. Vice President Vance said on 4 November that Republicans lost because of the Iran war, while Trump said he \"did the right thing\" and would veto Democratic bills. Hakeem Jeffries urged Trump to end the war before the new Congress.<br><strong>Why it matters:<\/strong> Congress can now block war funding, including a $67 billion request, and investigate the administration.<br><strong>Sources:<\/strong> <a href=\"https://www.wsoctv.com/news/trending/election-2026-democrats-capture-both-houses-congress/5ILOWTVABVDPZFYP7VBBCX4EWE/\" target=\"_blank\" rel=\"noopener\">WSOC/Cox Media<\/a>, <a href=\"https://www.argusmedia.com/en/news-and-insights/latest-market-news/2901877-trump-faces-new-limits-after-midterms-blowout\" target=\"_blank\" rel=\"noopener\">Argus Media<\/a>, <a href=\"https://www.csmonitor.com/Daily/2026/20261105\" target=\"_blank\" rel=\"noopener\">CS Monitor<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Oil whipsaws between peace hopes and stalled talks<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Crude plunged after the midterms on bets Democrats would push to end the war, then jumped on Thursday toward war-time highs as talks stalled. One report has Brent up 3.35% to $97.79 and WTI up 2.34% to $90.18, after a weekly drop of roughly 18% in an analyst note.<br><strong>Why it matters:<\/strong> Fuel costs drive inflation and are a political issue aft
