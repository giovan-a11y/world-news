mer handle matched Alex Kwong, with only nine markers found and a match statistic of one in 6.2 billion. The hammer head yielded too little DNA to analyse, and earlier agreed facts said no trace of Choi's DNA was detected on the hammer. Anthony Kwong and Kwong Kau were excluded as sources of the handle DNA. All three defendants deny murder.<br><strong>Why it matters:<\/strong> It is key forensic evidence in the city's most closely followed murder trial, expected to run about eight weeks.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347484/Ex-husbands-DNA-found-on-hammer-handle-court-hears-in-Abby-Choi-trial\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://scmp.com/news/hong-kong/law-and-crime/article/3373639/ex-husbands-dna-found-hammer-allegedly-used-kill-abby-choi-prosecution-says\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">John Lee begins Beijing and Shanghai trip to deepen mainland ties<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Chief Executive began a four-day visit to Beijing and Shanghai. In Beijing he spoke at the 29th Beijing-Hong Kong Economic Cooperation Symposium, presenting the Northern Metropolis as a research and innovation platform. He said the government is pushing for a \"brother port\" with Shanghai this year.<br><strong>Why it matters:<\/strong> It shows the administration's push for economic integration with the mainland.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/hong-kong/politics/article/3373225/john-lee-begins-beijing-shanghai-trip-deepen-mainland-economic-ties\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347544/John-Lee-eyes-deeper-trade-ties-with-mainland-overseas-on-Shanghai-trip\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">HKMA's fifth Global Financial Leaders' Investment Summit concludes<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The three-day summit, with about 280 financial leaders, ended on Wednesday with a \"Conversations with Global Investors\" forum. John Lee said Hong Kong remains the nexus of global finance. Vice-Premier He Lifeng had pledged by video to add measures to strengthen Hong Kong as an international financial centre, and regulators outlined plans to expand offshore renminbi business.<br><strong>Why it matters:<\/strong> It is the city's flagship finance event and a signal of Beijing's backing.<br><strong>Sources:<\/strong> <a href=\"https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/11/20261103-4/\" target=\"_blank\" rel=\"noopener\">HKMA<\/a>, <a href=\"https://www.scmp.com/business/article/3373105/vice-premier-he-lifeng-vows-support-hong-kong-international-financial-centre\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.thestandard.com.hk/finance/article/347305/Rethinking-the-Playbook-Hong-Kong-stays-the-nexus-for-global-finance-John-Lee-says\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Fire at Richland Gardens in Kowloon Bay; 150 evacuated<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> A fire broke out in a low-floor unit at Richland Gardens early on Wednesday. About 150 residents evacuated and three people were taken to hospital with suspected smoke inhalation; a man and woman from the unit escaped barefoot.<br><strong>Why it matters:<\/strong> It is a reminder of residential fire risk as fire-safety reviews continue.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347427/Fire-at-Richland-Gardens-in-Kowloon-Bay-150-residents-evacuated-3-taken-to-hospital\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Investment scams top HK$60 million in a week; one victim loses HK$45 million<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Police recorded more than 30 online investment scam cases with losses over HK$60 million in the past week. One victim lost HK$45 million to a fake environmental investment platform and made more than 60 transfers on instructions from fake customer service staff.<br><strong>Why it matters:<\/strong> Investment fraud remains the largest scam category by losses.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347511/Hong-Kong-investment-scams-top-60-million-in-a-week-with-one-victim-losing-45-million\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Huanggang Port crossings reported to have doubled<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Standard's recap reported that the revamped Huanggang Port now sees more than 86,000 crossings on weekdays, more than double the old Lok Ma Chau figure. Other reports gave different figures (about 80,000 daily, above 92,000 on one Friday), so the exact number is unconfirmed.<br><strong>Why it matters:<\/strong> It indicates how quickly cross-boundary traffic has shifted to the new port.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347529/Night-Recap-November-4-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://scmp.com/news/hong-kong/hong-kong-economy/article/3371240/hong-kongs-new-huanggang-port-seemingly-quiet-ahead-expected-holiday-rush\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Airport city SKYTOPIA to open most facilities by 2028<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Airport Authority said most amenities at SKYTOPIA, including a minibus connection to Tung Chung, are scheduled to debut by 2028 (single source, unconfirmed).<br><strong>Why it matters:<\/strong> It sets a timeline for a major tourism and airport-city project.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347529/Night-Recap-November-4-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Oracle reportedly drops US$7 billion Tencent AI chip deal<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Financial Times reported that Oracle cancelled a five-year, US$7 billion deal to lease about 100,000 AI chips to Tencent after US officials raised concerns. Oracle, Tencent and the White House did not comment to Reuters.<br><strong>Why it matters:<\/strong> It bears on Tencent, a Hang Seng heavyweight, and US-China technology tensions.<br><strong>Sources:<\/strong> <a href=\"https://thenextweb.com/news/oracle-cancels-tencent-ai-chip-lease\" target=\"_blank\" rel=\"noopener\">The Next Web<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347529/Night-Recap-November-4-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong startup funding falls 77% in October<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> TNGlobal reported that Hong Kong startup funding in October 2026 totalled US$94.09 million across five rounds, down 77% from September.<br><strong>Why it matters:<\/strong> It tempers the city's strong headline growth data.<br><strong>Sources:<\/strong> <a href=\"https://technode.global/2026/11/04/hong-kong-startup-funding-slips-to-94-1m-in-october-2026-down-77-from-september/\" target=\"_blank\" rel=\"noopener\">TNGlobal<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,919.50 (4 Nov), up 1.67% - <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-1-67-higher-at-23-919-50/70458945\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a><\/li><li>Hang Seng 23,525.97 (3 Nov), up 0.57% - <a href=\"https://www.news.cn/fortune/20261103/0a2dca6afb04493092b0413ccfe3b2f9/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>HIBOR, USD/HKD and daily weather: no verifiable figures found for this date.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Sentencing of Joshua Wong in the High Court.<\/li><li>US midterm reaction in Asian markets.<\/li><li>Continuing evidence in the Abby Choi trial.<\/li><\/ul>"}}}, {"date": "2026-11-04", "ed": {"world": {"line": "US voters head to the midterm polls with the Iran war and fuel prices at the centre of the vote, as oil swings on Qeshm strikes and Asian tech stocks tumble.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US midterm elections held amid Iran war and cost-of-living anger<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Americans voted on 3 November in midterms widely seen as a verdict on Trump, the Iran war and inflation. Prediction markets put a Democratic sweep at about 51% beforehand, and the Supreme Court had rejected administration efforts to curb mail ballots.<br><strong>Why it matters:<\/strong> The result will decide whether Trump can keep funding the war and pushing his agenda.<br><strong>Sources:<\/strong> <a href=\"https://www.newsquawk.com/headlines/us-midterm-update-latest-polymarket-pricing-puts-democratic-sweep-at-51\" target=\"_blank\" rel=\"noopener\">Newsquawk<\/a>, <a href=\"https://www.newsquawk.com/headlines/us-supreme-court-rejects-trump-administration-mail-ballot-curbs-for-midterms\" target=\"_blank\" rel=\"noopener\">Newsquawk (Supreme Court)<\/a>, <a href=\"https://kuwaittimes.com/article/52982/business/stocks-and-dollar-drop-as-democrats-enjoy-big-early-wins/\" target=\"_blank\" rel=\"noopener\">Kuwait Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US strikes Iran's Qeshm Island on election eve; Trump plays down war risk<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US forces carried out limited, defensive strikes on Iran's Qeshm Island late on 2 November, officials told CNN, NBC and AP. Trump confirmed them but said he was \"not looking to kill lots of people\" after the election, adding that a deal with Tehran was still possible. Vice President Vance said Washington had made \"progress\" in talks.<br><strong>Why it matters:<\/strong> The strikes show the blockade standoff can flare at any moment even as diplomacy continues.<br><strong>Sources:<\/strong> <a href=\"https://www.stripes.com/theaters/middle_east/2026-11-03/us-strikes-iran-qeshm-island-hormuz-23348317.html\" target=\"_blank\" rel=\"noopener\">Stars and Stripes<\/a>, <a href=\"https://www.ibtimes.co.uk/us-forces-strike-iran-qeshm-island-midterm-elections-1829754\" target=\"_blank\" rel=\"noopener\">IBTimes UK<\/a>, <a href=\"https://bernama.com/en/world/news.php?id=2629268\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Oil drops about 7.6% on diplomacy hopes, then whipsaws<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Monday Brent settled at $104.77, down 7.6%, and WTI at $96.46, down 7.4%, as renewed hopes for negotiations outweighed strike threats. Prices swung more than $6 intraday, peaking at $107.24 after the Qeshm news before falling back to about $100.80, and on Tuesday they steadied near $104-105.<br><strong>Why it matters:<\/strong> Oil near $100 keeps inflation high and was a central issue in the election.<br><strong>Sources:<\/strong> <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil/news/599585\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a>, <a href=\"https://www.oilmonster.com/article/oil-rises-after-us-strike-on-irans-qeshm-island/8750\" target=\"_blank\" rel=\"noopener\">Oil Monster<\/a>, <a href=\"https://www.thejakartapost.com/business/2026/11/03/asian-stocks-retreat-ahead-of-us-midterms-oil-steadies\" target=\"_blank\" rel=\"noopener\">Jakarta Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Tech sell-off deepens, with Seoul down 4%<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Asian shares retreated before the US vote, with MSCI's Asia-Pacific index ex-Japan down 0.9% and South Korea's Kospi falling 4% to 5,626.08 as tech losses mounted. Reports of the Nikkei's decline vary by source, from about 1.4% to more.<br><strong>Why it matters:<\/strong> AI-heavy markets such as Korea and Taiwan are highly sensitive to chip stock sentiment.<br><strong>Sources:<\/strong> <a href=\"https://www.thejakartapost.com/business/2026/11/03/asian-stocks-retreat-ahead-of-us-midterms-oil-steadies\" target=\"_blank\" rel=\"noopener\">Jakarta Post<\/a>, <a href=\"https://www.wsbtv.com/news/business/asian-shares-are/TZN4ESJELQ3YBBHIWXGSEDVSVQ/\" target=\"_blank\" rel=\"noopener\">WSB-TV/AP<\/a>, <a href=\"https://www.ajc.com/news/2026/11/asian-trading-is-mixed-as-tech-sell-off-deepens-and-oil-prices-rebound/\" target=\"_blank\" rel=\"noopener\">AJC<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Russia-Ukraine-US talks set for Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The US will host a second trilateral round between Ukraine and Russia in Abu Dhabi on 10-11 November, per the Kremlin and Reuters-based reports. Trump also said Ukraine had agreed not to hit Russian energy targets (unconfirmed).<br><strong>Why it matters:<\/strong> It is the first formal negotiating round in months, though territory and security guarantees remain stumbling blocks.<br><strong>Sources:<\/strong> <a href=\"https://www.fdd.org/overnight-brief/november-4-2026/\" target=\"_blank\" rel=\"noopener\">FDD<\/a>, <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Congo's Bundibugyo Ebola outbreak passes 10,500 cases<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data to 1 November show 10,532 confirmed cases and 5,126 deaths, making it the largest outbreak of this virus species and the second-largest Ebola outbreak ever. It remains a WHO emergency, with cases reported in neighbouring countries including Kenya.<br><strong>Why it matters:<\/strong> High fatality and continued spread strain health systems and raise regional containment concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed), <a href=\"https://who.int/emergencies/disease-outbreak-news/item/2026-DON618\" target=\"_blank\" rel=\"noopener\">WHO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Fed holds with two members favouring a hike<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> A report ahead of the vote said the Federal Reserve held rates at its latest meeting with two members voting for an increase, signalling policymakers are still weighing more tightening. Sources conflict on the Fed's exact policy rate and recent moves (unconfirmed).<br><strong>Why it matters:<\/strong> Higher-for-longer US rates affect borrowing costs, the dollar and Hong Kong's currency peg.<br><strong>Sources:<\/strong> <a href=\"https://www.ibtimes.co.uk/fed-holds-rates-bank-england-decision-1828777\" target=\"_blank\" rel=\"noopener\">IBTimes UK<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Gold slips below $3,900 and Bitcoin below $77,000<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Gold broke below $3,900 and Bitcoin struggled below $77,000 as markets braced for a volatile week, according to FXStreet's start-of-week analysis. Brent had been near $104.77 at Monday's close.<br><strong>Why it matters:<\/strong> Havens and crypto are both under pressure as the dollar and yields stay firm.<br><strong>Sources:<\/strong> <a href=\"https://www.fxstreet.com/analysis/gold-breaks-below-3-900-bitcoin-struggles-below-77k-as-markets-brace-for-a-deeper-downside-202611021017\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a>, <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil/news/599585\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hong Kong stocks track Asia lower before the US vote<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> Hong Kong shares slipped with the region on 3 November as tech losses weighed and investors waited for the US midterm result, with the Hang Seng finishing around the 23,500 level (approximate, derived from later reports). Asian markets were broadly lower, with Seoul the weakest.<br><strong>Why it matters:<\/strong> Hong Kong is exposed to US rate and tech swings through its dollar peg and large tech listings.<br><strong>Sources:<\/strong> <a href=\"https://www.thejakartapost.com/business/2026/11/03/asian-stocks-retreat-ahead-of-us-midterms-oil-steadies\" target=\"_blank\" rel=\"noopener\">Jakarta Post<\/a>, <a href=\"https://www.news.cn/fortune/20261105/30dca13060c845e8aeb2926ad0009301/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a> (unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Sudan war: army strike hits North Kordofan water station<\/span><span class=\"cat\">Conflict<\/span><\/h2>\n<p><strong>What happened:<\/strong> A Sudanese army strike in North Kordofan reportedly killed two women and destroyed a water station, while Sudan filed UN and African Union complaints against Ethiopia over alleged drone attacks (single source, unconfirmed).<br><strong>Why it matters:<\/strong> Attacks on civilian infrastructure deepen one of the world's largest humanitarian crises.<br><strong>Sources:<\/strong> <a href=\"https://www.dropsitenews.com/p/gop-infighting-trump-hegseth-civil-society-iran-saudi-syria-defense\" target=\"_blank\" rel=\"noopener\">Drop Site News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Brent $104.77 (-7.6%), WTI $96.46 (-7.4%) on 2 Nov close: <a href=\"https://tradingeconomics.com/commodity/brent-crude-oil/news/599585\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><li>Kospi 5,626.08 (-4%): <a href=\"https://www.thejakartapost.com/business/2026/11/03/asian-stocks-retreat-ahead-of-us-midterms-oil-steadies\" target=\"_blank\" rel=\"noopener\">Jakarta Post<\/a><\/li><li>Hang Seng about 23,500 (approximate, unconfirmed): <a href=\"https://www.news.cn/fortune/20261105/30dca13060c845e8aeb2926ad0009301/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Gold below $3,900, Bitcoin below $77,000: <a href=\"https://www.fxstreet.com/analysis/gold-breaks-below-3-900-bitcoin-struggles-below-77k-as-markets-brace-for-a-deeper-downside-202611021017\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a><\/li><li>US stock index closes for 3 Nov: not confirmed in sources found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Final US midterm results and the market reaction on 4 November.<\/li><li>Bank of England decision on 5 November; US jobs report on 6 November.<\/li><li>Russia-Ukraine-US talks in Abu Dhabi, 10-11 November; COP31 opening on 9 November.<\/li><\/ul>"}, "asia": {"line": "Australia holds rates at 4.85%, China's military leadership is hollowed out by a party purge, and Indonesia's haze toll draws attention.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Australia's central bank holds the cash rate at 4.85%<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Rio Times' Asia brief of 4 November lists Australia's rate at 4.85%, consistent with the Reserve Bank's first-Tuesday-of-the-month decision on 3 November (single source: unconfirmed).<br><strong>Why it matters:<\/strong> Rates this high keep pressure on Australian households and the currency.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/asia-intelligence-brief-wednesday-november-4-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">China's military command down to two of seven seats after purge<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Rio Times brief says China's Central Military Commission is down to two of its seven seats, following a Communist Party plenum that expelled 33 members (single source: unconfirmed).<br><strong>Why it matters:<\/strong> The scale of the purge raises questions about command stability in the PLA.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/asia-intelligence-brief-wednesday-november-4-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://www.riotimesonline.com/asia-intelligence-brief-tuesday-november-3-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">North Korea denies US$6.3 billion crypto theft; Seoul probes a leak<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Pyongyang denied a reported US$6.3 billion cryptocurrency theft, and Seoul opened a probe into a leak (single source: unconfirmed).<br><strong>Why it matters:<\/strong> Crypto theft is a key funding channel for North Korea's weapons programmes.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/asia-intelligence-brief-tuesday-november-3-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Indonesia's smoke toll reported at 3,560<\/span><span class=\"cat\">Disasters<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Rio Times brief cites a smoke-related toll of 3,560 in Indonesia; Australia is sending firefighting aircraft to East Kalimantan from 6-12 November (toll single-source: unconfirmed).<br><strong>Why it matters:<\/strong> Forest fires are a health and diplomatic issue across Southeast Asia.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/asia-intelligence-brief-wednesday-november-4-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://bernama.com/en/region/news.php?id=2630759\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Australia cash rate 4.85% (single source).<\/li><li>Nikkei, Shanghai, Kospi and USD/CNY: not available from my sources for 3 Nov.<\/li><li>Coverage note: only four stories could be verified, so this list is much shorter than ten.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>4 Nov: Asian market reaction to the US midterm results.<\/li><li>Further detail on the PLA purge.<\/li><\/ul>"}, "hk": {"line": "Hong Kong's economy grew 5.2% in the third quarter and September retail sales rose 6.4%, while Beijing's He Lifeng opened the HKMA finance summit and October was confirmed the hottest on record.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hong Kong GDP grows 5.2% in third quarter, 15th straight quarter of growth<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The advance estimate put third-quarter real GDP up 5.2% year on year, up from 4.2% in the second quarter and well above a 3.6% Reuters poll average. Goods exports rose 30.4% and fixed capital formation 7.3%, while private consumption rose 2.8%. Seasonally adjusted GDP rose 1.9% from the previous quarter, and growth for the first three quarters was 5.1%. Financial Secretary Paul Chan has said the 3.5% to 4.5% full-year forecast may be raised; revised figures were due on 13 November.<br><strong>Why it matters:<\/strong> It is the fastest nine-month growth in five years and points to an upgrade of the official forecast.<br><strong>Sources:<\/strong> <a href=\"https://www.news.cn/gangao/20261103/158e579d03b6466680aa4c3c5437f64c/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a>, <a href=\"https://www.dimsumdaily.hk/?p=649463\" target=\"_blank\" rel=\"noopener\">Dim Sum Daily<\/a>, <a href=\"https://scmp.com/news/hong-kong/hong-kong-economy/article/3372830/hong-kong-may-raise-gdp-forecast-growth-poised-5-year-high-paul-chan\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Retail sales rise 6.4% in September, 17th straight month of growth<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Provisional retail sales were HK$33.4 billion in September, up 6.4% from a year earlier and faster than August's revised 5.6%. Volume rose 3.9%. Online sales were HK$4.4 billion, up 12.0%. Electrical appliances and other durables rose 9.7%, while supermarket products fell 1.0%. Sales for the first nine months were up 8.3%.<br><strong>Why it matters:<\/strong> It shows consumer spending and inbound tourism strengthening.<br><strong>Sources:<\/strong> <a href=\"https://www.dimsumdaily.hk/?p=649472\" target=\"_blank\" rel=\"noopener\">Dim Sum Daily<\/a>, <a href=\"https://insideretail.asia/2026/11/04/hong-kong-retail-sales-accelerate-as-local-demand-inbound-tourism-pick-up/\" target=\"_blank\" rel=\"noopener\">Inside Retail Asia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">He Lifeng opens HKMA Global Financial Leaders' Investment Summit<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> At the fifth summit, Vice-Premier He Lifeng said by video that finance is the most important part of Hong Kong's \"four centres and one highland\" agenda and that Beijing would add measures as needed to strengthen the city as an international financial centre. About 280 financial leaders attended. John Lee said Hong Kong remains the nexus of global finance, and regulators outlined plans to expand offshore renminbi business and deepen mainland capital-market links.<br><strong>Why it matters:<\/strong> It is a high-level signal of mainland backing for the city's role as a financial hub.<br><strong>Sources:<\/strong> <a href=\"https://www.hkma.gov.hk/eng/news-and-media/press-releases/2026/11/20261103-4/\" target=\"_blank\" rel=\"noopener\">HKMA<\/a>, <a href=\"https://www.scmp.com/business/article/3373105/vice-premier-he-lifeng-vows-support-hong-kong-international-financial-centre\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.chinadailyhk.com/article/642200\" target=\"_blank\" rel=\"noopener\">China Daily HK<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Hang Seng rises 0.57% to 23,525.97 for a third straight gain<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index rose 132.65 points, or 0.57%, to 23,525.97 on 3 November on turnover of HK$236.40 billion. The China Enterprises Index rose 0.47% to 7,943.10 and the Tech Index 0.74% to 3,867.73. Gains in technology and consumer stocks outweighed renewed selling in AI hardware shares.<br><strong>Why it matters:<\/strong> The index entered the US midterm election with a three-day winning streak.<br><strong>Sources:<\/strong> <a href=\"https://www.news.cn/fortune/20261103/0a2dca6afb04493092b0413ccfe3b2f9/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a>, <a href=\"https://www.thestandard.com.hk/finance/article/347224/Hong-Kong-shares-close-higher-on-tech-gains\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Hong Kong logs hottest October on record<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Observatory reported an October mean temperature of 27.6 degrees, 1.9 degrees above the 1991-2020 normal and a record for the month, beating the 27.4 degrees set in October 2025. The mean daily maximum was 30.5 degrees and the mean minimum 25.8 degrees, both October highs. The Observatory linked the heat to climate warming and a strong El Nino.<br><strong>Why it matters:<\/strong> It extends a run of record warmth ahead of a cold front forecast for the following week.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/03/hong-kong-logs-hottest-october-on-record\" target=\"_blank\" rel=\"noopener\">The Star<\/a>, <a href=\"https://scmp.com/news/hong-kong/health-environment/article/3372881/el-nino-weak-monsoon-behind-hong-kongs-warmest-october-142-years\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Baidu's Kunlunxin Hong Kong IPO may slip to 2027, Bloomberg says<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bloomberg reported that Baidu's AI chip unit Kunlunxin, which confidentially filed for a US$2 billion Hong Kong listing in January, may debut in 2027 while it awaits China Securities Regulatory Commission approval. Baidu denied the market rumours and said it would announce in due course.<br><strong>Why it matters:<\/strong> It affects the outlook for large AI-related listings in Hong Kong.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/finance/article/347348/\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.dealstreetasia.com/stories/baidus-kunlunxin-eyes-hong-kong-ipo-after-283m-fundraising-465564\" target=\"_blank\" rel=\"noopener\">DealStreetAsia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Woman killed on Castle Peak Road in Hung Shui Kiu; driver arrested<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> A woman was killed after being struck by a private car on Castle Peak Road at Hung Shui Kiu at about 11:09pm on 2 November. The driver was arrested for dangerous driving. Whether he stayed at the scene is not stated in the reports.<br><strong>Why it matters:<\/strong> It adds to a run of fatal road accidents involving pedestrians.<br><strong>Sources:<\/strong> <a href=\"https://www.dimsumdaily.hk/?p=649394\" target=\"_blank\" rel=\"noopener\">Dim Sum Daily<\/a>, <a href=\"https://www.bastillepost.com/global/article/6318315-woman-dies-in-tuen-mun-traffic-accident-driver-arrested-for-dangerous-driving\" target=\"_blank\" rel=\"noopener\">Bastille Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Chris Tang: no guarantee contractor lists can be \"100% clean\"<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The security chief said vetting building contractors could not guarantee lists were fully clean, while saying criminalising bid-rigging would bring a \"revolutionary overhaul\" of the sector (SCMP headlines). The Bar Association asked the government to clarify crime thresholds and whistle-blower immunity in the planned bid-rigging law. The proposed offence carries up to 10 years in jail. The exact dates of these reports are unconfirmed.<br><strong>Why it matters:<\/strong> The details of the law will decide how effective the post-Tai Po fire reforms are.<br><strong>Sources:<\/strong> <a href=\"https://scmp.com/news/hong-kong/society/article/3372872/criminalising-bid-rigging-bring-revolutionary-overhaul-sector-minister\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/law-and-crime/article/3372894/clarify-crime-thresholds-and-immunity-bid-rigging-law-hong-kong-bar-association\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347151/Chris-Tang-pledges-stronger-deterrent-against-bid-rigging-with-new-task-force-and-reforms\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hang Seng weekly context: market awaits US midterm results<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> US midterm elections were held on 3 November, and The Standard later tied the Hang Seng's rally to improved sentiment after the vote. Before the result, the Hang Seng had risen on three straight sessions.<br><strong>Why it matters:<\/strong> The election outcome drove the largest daily move of the week on Thursday.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/finance/article/347630/Hang-Seng-Index-surges-nearly-900-points-at-close\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.news.cn/fortune/20261103/0a2dca6afb04493092b0413ccfe3b2f9/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Venus Williams loses Hong Kong Open opener for 17th straight defeat<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Venus Williams lost 6-2, 6-3 to fellow American Mary Stoiana in the first round on Monday, her 17th consecutive singles loss and her first-round exit in the Hong Kong Open. She was noncommittal about her future.<br><strong>Why it matters:<\/strong> It ended her 2026 singles season and kept retirement talk alive at the city's WTA event.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/sports-updates/article/347256/Venus-battles-hard-but-fails-to-stop-losing-streak\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/sport/tennis/article/3373031/venus-williams-drops-retirement-hint-after-hong-kong-tennis-open-exit\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,525.97 (3 Nov), up 0.57% - <a href=\"https://www.news.cn/fortune/20261103/0a2dca6afb04493092b0413ccfe3b2f9/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Hang Seng Tech Index 3,867.73, up 0.74%; turnover HK$236.40 billion - <a href=\"https://www.news.cn/fortune/20261103/0a2dca6afb04493092b0413ccfe3b2f9/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>October mean temperature 27.6 degrees, a record - <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/03/hong-kong-logs-hottest-october-on-record\" target=\"_blank\" rel=\"noopener\">The Star<\/a><\/li><li>HIBOR and USD/HKD: no verifiable November 2026 figures found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>13 Nov: revised GDP figures and 2026 forecast.<\/li><li>Details of the bid-rigging legislation.<\/li><li>Cold front forecast for the following week.<\/li><\/ul>"}}}];
const $ = id => document.getElementById(id);
const fmt = (d, opts) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", opts);
const long = d => fmt(d, {weekday:"short", day:"numeric", month:"short", year:"numeric"});
const NAMES = {world: "World", us: "US", asia: "Asia", hk: "Hong Kong"};
let idx = 0;
let ed = "world";
try { ed = localStorage.getItem("ed") || "world"; } catch (e) {}
if (!NAMES[ed]) ed = "world";
const firstLine = e => (e.ed.world || Object.values(e.ed)[0] || {}).line || "";

function pick() {
  const [d, k] = location.hash.slice(1).split("/");
  if (NAMES[k]) ed = k;
  const i = DATA.findIndex(e => e.date === d);
  return i >= 0 ? i : 0;
}
function render() {
  document.querySelectorAll("#seg button").forEach(b => {
    b.classList.toggle("on", b.dataset.k === ed);
    b.disabled = !!DATA.length && !DATA[idx].ed[b.dataset.k];
  });
  $("brand").textContent = NAMES[ed] + " Top 10";
  document.title = NAMES[ed] + " Top 10";
  if (!DATA.length) { $("content").innerHTML = '<div class="empty">No briefings yet. The first one arrives at 8:00 AM Hong Kong time.</div>'; return; }
  const e = DATA[idx];
  const b = e.ed[ed];
  $("dateTxt").textContent = long(e.date) + (idx === 0 ? " · Latest" : "");
  $("one").innerHTML = b && b.line ? '<div class="oneline"><b>Today in one line</b></div>' : "";
  if (b && b.line) $("one").firstChild.append(b.line);
  $("content").innerHTML = b ? b.html : '<div class="empty">No ' + NAMES[ed] + ' list for this day. Try World.</div>';
  $("older").disabled = idx >= DATA.length - 1;
  $("newer").disabled = idx <= 0;
  $("foot").textContent = DATA.length + " day" + (DATA.length > 1 ? "s" : "") + " saved on this device" + (navigator.onLine ? "" : " · offline");
  document.querySelectorAll("#list button").forEach((b, i) => b.classList.toggle("cur", i === idx));
}
function sync() {
  const tag = (idx === 0 ? "" : DATA[idx].date) + (ed === "world" ? "" : "/" + ed);
  history.replaceState(null, "", tag ? "#" + tag : location.pathname);
}
function go(i) {
  idx = Math.max(0, Math.min(DATA.length - 1, i));
  sync(); render(); window.scrollTo(0, 0);
}
$("seg").onclick = ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  ed = b.dataset.k;
  try { localStorage.setItem("ed", ed); } catch (e) {}
  sync(); render(); window.scrollTo(0, 0);
};
$("list").innerHTML = DATA.map((e, i) =>
  '<li><button data-i="' + i + '"><span class="sd">' + long(e.date) + (i === 0 ? " · Latest" : "") + '</span><span class="sl"></span></button></li>').join("");
document.querySelectorAll("#list .sl").forEach((s, i) => s.textContent = firstLine(DATA[i]));
const toggle = on => $("sheetWrap").classList.toggle("open", on);
$("dateBtn").onclick = () => toggle(true);
$("sheetBg").onclick = () => toggle(false);
$("list").onclick = ev => { const b = ev.target.closest("button"); if (b) { toggle(false); go(+b.dataset.i); } };
$("older").onclick = () => go(idx + 1);
$("newer").onclick = () => go(idx - 1);
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(idx + 1); if (e.key === "ArrowRight") go(idx - 1); if (e.key === "Escape") toggle(false); });
window.addEventListener("hashchange", () => { idx = pick(); render(); });
addEventListener("online", render); addEventListener("offline", render);
idx = pick();
if (DATA.length && !DATA[idx].ed[ed]) ed = "world";
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
