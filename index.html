"><span class=\"num\">3<\/span><span class=\"ht\">Asian equities rebound but sentiment fragile after tech rout<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Asian equities mostly rebounded after the previous week's selloff, which saw the Nikkei fall about 6% and the Kospi about 9% on Friday after a $2.5 trillion Wall Street drop on US midterm worries, though Dow Jones described sentiment as fragile. A Kyunghyang report said the Kospi lost about 11% over two days and barely held 5,000.<br><strong>Why it matters:<\/strong> Index swings of this size make Monday's open a key read on whether the AI trade has stabilised.<br><strong>Sources:<\/strong> <a href=\"https://www.morningstar.com/news/dow-jones/202611081269/asian-equities-rebound-though-sentiment-remains-fragile\" target=\"_blank\" rel=\"noopener\">Morningstar / Dow Jones<\/a>, <a href=\"https://aljazeera.com/economy/2026/11/9/asian-stock-markets-climb-after-earlier-tech-rout\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.khan.co.kr/en/article/202611061703007\" target=\"_blank\" rel=\"noopener\">Kyunghyang Shinmun<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Delhi building collapse toll rises to seven<\/span><span class=\"cat\">Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> The death toll in the Chawri Bazar building collapse in Old Delhi rose to seven after another body was found on Sunday, after a rescue operation lasting more than 70 hours. Police have arrested the owner and three contractors.<br><strong>Why it matters:<\/strong> The disaster raises questions about illegal construction in Delhi's dense historic districts.<br><strong>Sources:<\/strong> <a href=\"https://swarajyamag.com/news-brief/death-toll-rises-to-seven-in-delhi-building-disaster-as-70-hour-rescue-operation-continues-in-hauz-qazi\" target=\"_blank\" rel=\"noopener\">Swarajya<\/a>, <a href=\"https://www.newsbytesapp.com/news/india/tragic-building-collapse-in-chawri-bazar/story\" target=\"_blank\" rel=\"noopener\">NewsBytes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Japan's Takaichi attends rally for return of abductees<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Prime Minister Takaichi attended a Tokyo citizens' rally on 8 November demanding the immediate return of all Japanese abducted by North Korea, according to her office's schedule; the week also included a nuclear emergency exercise and the launch of a new Disaster Management Agency. Her approval has slipped about 15 points in a year in one Korean poll.<br><strong>Why it matters:<\/strong> The abduction issue remains the main obstacle to any Japan-North Korea thaw and is a signature priority for Takaichi.<br><strong>Sources:<\/strong> <a href=\"https://japan.kantei.go.jp/105/actions/index.html\" target=\"_blank\" rel=\"noopener\">Japan PM Office<\/a>, <a href=\"https://mbiz.heraldcorp.com/article/10922912\" target=\"_blank\" rel=\"noopener\">Herald Corp<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">China to host a Pakistani astronaut at Tiangong; energy-investment report [Tech] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A global news digest said China is preparing to host a Pakistani astronaut at its Tiangong space station; earlier official statements said a Pakistani payload specialist would join Shenzhou-24 in late 2026, the first foreign astronaut to visit. A separate report projected China will lead world energy investment in 2026 at about US$940 billion.<br><strong>Why it matters:<\/strong> The flight would showcase China's space partnerships, while energy spending underlines Beijing's role in the Iran-war energy shock.<br><strong>Sources:<\/strong> <a href=\"https://gulfnews.com/world/asia/pakistan/pakistans-first-astronaut-to-join-chinas-space-mission-1.500327385\" target=\"_blank\" rel=\"noopener\">Gulf News<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347896/Night-Recap-November-8-2026\" target=\"_blank\" rel=\"noopener\">The Standard Night Recap<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Southeast Asia headlines: Thailand courts OECD entry; Indonesia tightens borders; Manila finalises summit [Economy] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A Bernama roundup for 8 November reported that Thai Prime Minister Anutin is pushing faster OECD accession and a \"Thailand FastPass\" for investors, that Indonesia is strengthening border security through an Interpol alert system, and that Finance Secretary Recto is overseeing final preparations for the ASEAN Summit.<br><strong>Why it matters:<\/strong> Governments are positioning for the Manila summit and for investment inflows amid energy and market stress.<br><strong>Sources:<\/strong> <a href=\"https://www.bernama.com/tv/news.php?id=2631572\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/06/asean-news-headlines-at-10pm-on-friday-nov-6-2026\" target=\"_blank\" rel=\"noopener\">The Star: ASEAN headlines<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Philippines' US-backed \"Pax Silica\" chip hub lacks tenants, power and water<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The 1,620-hectare site at New Clark City in Tarlac has no confirmed tenants, and the BCDA chief says it could create nearly 200,000 jobs over a decade. SCMP reported the hub lacks tenants, power and water; lawmakers worry about grid strain and Aeta communities face relocation.<br><strong>Why it matters:<\/strong> The project is central to Washington's plan to shift chip supply chains to allies, and its delays complicate Manila's pitch at the ASEAN summit.<br><strong>Sources:<\/strong> <a href=\"https://gulfnews.com/world/asia/philippines/philippine-tribe-in-limbo-over-us-led-tech-hub-1.500681039\" target=\"_blank\" rel=\"noopener\">Gulf News (AFP)<\/a>, <a href=\"https://business.inquirer.net/604771/pax-silica-site-development-eyed-in-3-to-5-years\" target=\"_blank\" rel=\"noopener\">Inquirer Business<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Beijing confirms talks on a Xi-Trump-Putin meeting at APEC<\/span><span class=\"cat\">Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> China confirmed that discussions are under way on a possible three-way Xi-Trump-Putin meeting on the sidelines of APEC in Shenzhen on 18-19 November, the Korea Times reported. Foreign-ministry listings also showed Xi will attend the leaders' meeting.<br><strong>Why it matters:<\/strong> A meeting of the three nuclear powers would be historic, but the format and agenda remain unsettled.<br><strong>Sources:<\/strong> <a href=\"https://www.koreatimes.co.kr/world/20261107/china-confirms-discussions-underway-on-historic-xi-trump-putin-meeting\" target=\"_blank\" rel=\"noopener\">Korea Times<\/a>, <a href=\"https://www.fmprc.gov.cn/eng/\" target=\"_blank\" rel=\"noopener\">China Ministry of Foreign Affairs<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Iran war keeps Asia's energy supply under strain<\/span><span class=\"cat\">Economy / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Months into the Iran war, flows through the Strait of Hormuz remain far below pre-war levels. Asia absorbed 87% of the crude and 86% of the LNG that transited the strait in 2025, and the Philippines declared a national energy emergency. Reports in September flagged a marine-fuel shortage as well.<br><strong>Why it matters:<\/strong> Southeast Asia's oil shortages are a leading item on the ASEAN summit agenda and fuel inflation across the region.<br><strong>Sources:<\/strong> <a href=\"https://fortune.com/2026/08/28/iran-war-hormuz-blocked-asia-energy-crisis-oil-gas/\" target=\"_blank\" rel=\"noopener\">Fortune<\/a>, <a href=\"https://aljazeera.com/news/2026/9/7/iran-and-ukraine-wars-why-ship-fuel-is-running-short-and-why-it-matters\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Taiex: closed about 39,702 on 6 Nov, down 4.51% - <a href=\"https://focustaiwan.tw/business/202611060020\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a><\/li><li>Nikkei 225: down about 6% on 6 Nov; Kospi down about 9% (levels not confirmed) - <a href=\"https://aljazeera.com/economy/2026/11/9/asian-stock-markets-climb-after-earlier-tech-rout\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a><\/li><li>Shanghai Composite and USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Monday's market open after the Taiwan intervention.<\/li><li>9 Nov: China's October inflation data; 10 Nov: trade data.<\/li><li>New Zealand special votes and coalition talks; ASEAN summit 15-17 Nov; APEC 18-19 Nov.<\/li><\/ul>"}, "hk": {"line": "About 30 defective columns at the Tung Chung West MTR station and a 28-arrest bid-rigging sweep dominated the weekend, while a strong cold front arrived and the Hang Seng fell 1.27% on Friday.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">About 30 defective pillars found at Tung Chung West station<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> About 30 concrete pillars at the Tung Chung West station, under construction, were found defective. The Buildings Department said it first learned of a defective pillar in early October and that the situation does not pose an immediate danger. The Highways Department said the contractor tried repairs by an unapproved method, and MTR told the main contractor to stop work. The Transport and Logistics Bureau ordered MTR to submit a report within two weeks. MTR said it would take firm action against the contractor. Engineers and lawmakers called the defects \"unimaginable\"; experts differed on whether it was unfinished work or unacceptable error.<br><strong>Why it matters:<\/strong> It revives memories of earlier MTR construction scandals and tests the oversight of the 2029 opening target, which the government says is unchanged.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347832/30-defective-pillars-found-at-Tung-Chung-West-station-as-MTR-ordered-to-report-within-two-weeks\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347998/MTR-to-take-firm-action-against-contractor-over-defective-Tung-Chung-West-station-pillars\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/society/article/3373705/defects-hong-kong-mtr-station-unimaginable-engineers-and-lawmakers-say\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Task force arrests 28 in first bid-rigging operation after Tai Po fire<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A joint task force of police, the ICAC and the Competition Commission arrested 28 people on Friday, including directors and staff of at least six contractors and 10 consultant firms. A suspected triad-linked syndicate allegedly obtained 12 works contracts at residential estates. Security chief Chris Tang said a 24-hour reporting hotline had been set up. A further 38 arrests reported by SCMP in a vice and gambling raid are single-source (unconfirmed).<br><strong>Why it matters:<\/strong> It is the first operation of the task force set up after the Wang Fuk Court fire report and signals tougher enforcement on renovation contracts.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/2026/11/07/hong-kong-arrests-28-in-building-bid-rigging-probe-rthk-says\" target=\"_blank\" rel=\"noopener\">The Star (RTHK)<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/law-and-crime/article/3373575/hong-kong-authorities-arrest-28-crackdown-bid-rigging-after-tai-po-fire\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">John Lee on Beijing and Shanghai trip to deepen mainland ties<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Chief Executive was on a four-day Beijing and Shanghai visit. In Beijing he spoke at the 29th Beijing-Hong Kong Economic Cooperation Symposium on the Northern Metropolis; in Shanghai he attended the China International Import Expo and the Hongqiao forum, and said the government is pushing for a \"brother port\" with Shanghai this year (exact end date of trip unconfirmed).<br><strong>Why it matters:<\/strong> It shows the administration's economic push toward mainland integration and Chinese firms going global.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/hong-kong/politics/article/3373225/john-lee-begins-beijing-shanghai-trip-deepen-mainland-economic-ties\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347544/John-Lee-eyes-deeper-trade-ties-with-mainland-overseas-on-Shanghai-trip\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Hang Seng falls 1.27% on Friday to 24,481.86<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index fell 1.27%, or 315.12 points, to 24,481.86 on 6 November, on turnover of HK$247.428 billion. The Hang Seng China Enterprises Index fell 1.13% to 8,274.10 and the Tech Index fell 1.83% to 4,078.23.<br><strong>Why it matters:<\/strong> It sets the baseline for the week, with APEC in Shenzhen and US inflation data ahead.<br><strong>Sources:<\/strong> <a href=\"https://www.news.cn/fortune/20261106/9f4ade0f744643b69131fe558ccc94b4/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Strong cold front to cut temperatures by 9 degrees from Monday<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Observatory said a strong cold front would reach Hong Kong on Monday, dropping urban temperatures to around 16 degrees by Tuesday, lower than an earlier forecast of 18.<br><strong>Why it matters:<\/strong> It affects commuters, outdoor events and demand for health services.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347816/Hong-Kong-temperatures-to-drop-9-degrees-as-strong-cold-front-arrives-Mon\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/weather/hong-kong/article/3373687/winters-knocking-cold-front-slash-hong-kong-temperatures-16-degrees\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Claire Liu beats Alex Eala 6-3, 6-0 in Hong Kong Open final<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The world No. 102 won the last nine games to beat second seed Eala on Sunday, taking her first WTA singles title. Liu dropped no set all week and won 88% of first serves.<br><strong>Why it matters:<\/strong> It closes the city's WTA tournament (31 October to 8 November) with a surprise champion.<br><strong>Sources:<\/strong> <a href=\"https://www.wtatennis.com/news/4606250/liu-reels-off-nine-straight-games-to-beat-eala-for-hong-kong-title\" target=\"_blank\" rel=\"noopener\">WTA<\/a>, <a href=\"https://scmp.com/sport/tennis/article/3373695/hong-kong-blow-alexandra-eala-american-claire-liu-ends-title-wait\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Pedestrian dies after being hit by hygiene contractor's truck in North Point<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> A 60-year-old woman died four days after being hit by a medium-sized truck run by a Food and Environmental Hygiene Department contractor. The driver was arrested.<br><strong>Why it matters:<\/strong> It adds to concern over road safety and contractor vehicles.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347896/Night-Recap-November-8-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Tuen Mun estate cancels owners' meeting after ICAC notice<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Elegance Gardens cancelled a special owners' meeting on contractor selection after an urgent ICAC notice; sources said staff of its maintenance consultant were among those arrested (unconfirmed).<br><strong>Why it matters:<\/strong> It shows the bid-rigging probe reaching individual estates' repair projects.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347784/Tuen-Muns-Elegance-Gardens-cancels-owners-meeting-after-ICAC-notice-consultant-firm-members-reportedly-arrested\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Test of trust for new housing checks unit after Wang Fuk Court fire<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> SCMP ran an analysis on 7 November questioning the trust placed in the government's new housing checks unit (headline only; unconfirmed).<br><strong>Why it matters:<\/strong> It bears on confidence in post-fire building safety reforms.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/topics/hong-kong-fires-and-safety\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Court rejects Ronson Chan's bid for top-court appeal<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A listing reported that the court rejected the ex-press union head's bid to take his police-obstruction appeal to the top court (single source, date uncertain; unconfirmed).<br><strong>Why it matters:<\/strong> It is a press-freedom bellwether case.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 24,481.86 (6 Nov), down 1.27% - <a href=\"https://www.news.cn/fortune/20261106/9f4ade0f744643b69131fe558ccc94b4/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Hang Seng Tech Index 4,078.23, down 1.83% - <a href=\"https://www.news.cn/fortune/20261106/9f4ade0f744643b69131fe558ccc94b4/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Weather: urban temperatures falling to about 16 degrees by Tuesday - <a href=\"https://www.thestandard.com.hk/news/article/347816/Hong-Kong-temperatures-to-drop-9-degrees-as-strong-cold-front-arrives-Mon\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/li><li>HIBOR and USD/HKD: no verifiable November 2026 figures found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>MTR report on Tung Chung West due within two weeks; Buildings Department engineer report by mid-November.<\/li><li>Further arrests and charges from the bid-rigging task force.<\/li><li>18-19 Nov: APEC leaders' meeting in Shenzhen.<\/li><\/ul>"}}}, {"date": "2026-11-08", "ed": {"world": {"line": "A week of Democratic midterm gains, renewed US strikes in the Strait of Hormuz and a violent AI-stock sell-off ended with Wall Street mixed after a hot US jobs report.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump says \"no oil going to Iran\" as US strikes continue near Hormuz<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> On 7 November Trump said the US blockade has full control of the Strait of Hormuz and that no oil is reaching Iran. US Central Command said it struck a St. Kitts-flagged cargo ship that tried to break the blockade in the Gulf of Oman, and Trump confirmed limited strikes on an Iranian air-defence site on Qeshm Island late on 6 November. Iranian media said the IRGC had lifted its self-imposed 2,000 km missile-range limit.<br><strong>Why it matters:<\/strong> The Gulf standoff keeps energy markets on edge and the risk of wider war high, even as Qatar pushes an interim deal.<br><strong>Sources:<\/strong> <a href=\"https://saharareporters.com/2026/11/07/trump-insists-strait-hormuz-blockade-claims-nothing-going-iran-no-oil-going-there\" target=\"_blank\" rel=\"noopener\">Sahara Reporters<\/a>, <a href=\"https://aljazeera.com/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.rferl.org/a/iran-live-blog-trump-middle-east/33803414.html\" target=\"_blank\" rel=\"noopener\">RFE/RL<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Democrats take Congress; Republicans blame the Iran war<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrats won the House and Senate in the 3 November midterms, with record turnout of more than 124 million ballots and Hakeem Jeffries set to become Speaker in January. Vice President Vance said Republicans lost because of the Iran war, and Trump said he would veto Democratic bills. Some Senate races, such as Alaska and Mississippi, were still being finalised.<br><strong>Why it matters:<\/strong> Divided government limits Trump's agenda, including war funding, and raises pressure for a diplomatic exit from the Iran conflict.<br><strong>Sources:<\/strong> <a href=\"https://www.wsoctv.com/news/trending/election-2026-democrats-capture-both-houses-congress/5ILOWTVABVDPZFYP7VBBCX4EWE/\" target=\"_blank\" rel=\"noopener\">WSOC/Cox Media<\/a>, <a href=\"https://www.washingtonexaminer.com/news/campaigns/4791815/takeaways-2026-midterm-elections/\" target=\"_blank\" rel=\"noopener\">Washington Examiner<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">US adds 165,000 jobs; Wall Street ends a rough week mixed<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> October payrolls rose 165,000 against about 65,000 expected, and unemployment fell to 4.1%. On Friday the S&amp;P 500 closed at 7,376.86 (+0.31%), the Nasdaq at 24,579.42 (+1.09%) and the Dow at 51,285.73 (-0.46%). For the week the S&amp;P 500 lost 2.7%, the Dow 0.9% and the Nasdaq 3.4%.<br><strong>Why it matters:<\/strong> A strong labour market keeps pressure on the Fed to keep rates high at a time of war-driven inflation.<br><strong>Sources:<\/strong> <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a>, <a href=\"https://econotimes.com/U-S-Adds-165-000-Jobs-in-October-as-Wall-Street-Ends-Week-Lower-1772683\" target=\"_blank\" rel=\"noopener\">EconoTimes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">AI and chip stocks whipsaw after Thursday's rout<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> After a Thursday sell-off, reported to have taken the Nasdaq down more than 5% amid fears of tighter AI regulation under a Democratic Congress, tech stocks rebounded on Friday. Sources differ on the exact size of Thursday's fall, and the Nasdaq entered a technical correction from its October high.<br><strong>Why it matters:<\/strong> Heavy AI-related valuations now drive US indexes, so policy and earnings surprises move global markets.<br><strong>Sources:<\/strong> <a href=\"https://theedgemalaysia.com/node/824763\" target=\"_blank\" rel=\"noopener\">Edge Malaysia<\/a>, <a href=\"https://www.zacks.com/stock/news/3025392/stock-market-news-for-nov-6-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Oil swings on Iran diplomacy; Brent near the low $90s to high $90s<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Brent fell sharply earlier in the week on hopes a Democratic Congress will push an end to the war, then rebounded as talks stalled. One analyst note put Brent down about 18% in a week from highs above $110; Brent settled near $97.79 on Thursday and WTI near $90.18 (single source).<br><strong>Why it matters:<\/strong> Fuel prices feed inflation and political pressure on the White House.<br><strong>Sources:<\/strong> <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a>, <a href=\"https://www.al-monitor.com/index%2ephp/originals/2026/11/gulf-markets-gain-oil-falls-democrats-win-congress\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a> (unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak grows in DR Congo<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> WHO's 6 November bulletin, with data to 3 November, counted 10,668 confirmed cases and 5,198 deaths, including 1,463 new cases in 21 days, mostly in Ituri and North Kivu. It is the second-largest Ebola outbreak on record.<br><strong>Why it matters:<\/strong> Continued spread in eastern Congo and cases in neighbouring countries strain health systems and raise regional risk.<br><strong>Sources:<\/strong> <a href=\"https://who.int/emergencies/disease-outbreak-news/item/2026-DON618\" target=\"_blank\" rel=\"noopener\">WHO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">US-Russia-Ukraine talks set for Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Kremlin confirmed Russia will join US-mediated trilateral talks with Ukraine in Abu Dhabi on 10-11 November, the first such round in months. Trump also said Ukraine agreed not to strike Russian energy targets (unconfirmed).<br><strong>Why it matters:<\/strong> It is a rare diplomatic opening, though territory and security guarantees remain unresolved.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.fdd.org/overnight-brief/november-4-2026/\" target=\"_blank\" rel=\"noopener\">FDD<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Judge blocks Trump's triumphal arch<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Judge Tanya Chutkan issued a 14-day order stopping work on the planned arch near Arlington Memorial Circle, shortly after a federal planning commission approved it. She said construction would likely harm Washington and Virginia and may be unlawful.<br><strong>Why it matters:<\/strong> It is an early test of legal limits on Trump's building plans.<br><strong>Sources:<\/strong> <a href=\"https://www.wlox.com/2026/11/06/federal-judge-orders-14-day-delay-any-work-beginning-trumps-monumental-arch/\" target=\"_blank\" rel=\"noopener\">WLOX<\/a>, <a href=\"https://politicalwire.com/2026/11/06/judge-blocks-trumps-arch-after-federal-panel-approves-it/\" target=\"_blank\" rel=\"noopener\">Political Wire<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hang Seng falls on Friday but gains 5% on the week<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed at 24,481.86, down 1.27%, with the tech index down 1.83%, but it rose 5.10% over the week. Hong Kong also expects a strong cold front on Monday, with urban temperatures forecast to drop about 9 degrees.<br><strong>Why it matters:<\/strong> Hong Kong markets are swinging with US rates, tech sentiment and Iran headlines.<br><strong>Sources:<\/strong> <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347896/Night-Recap-November-8-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Bitcoin slips to about $76,000; Leeds beat Spurs<\/span><span class=\"cat\">Markets / Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bitcoin ended the week near $75,916, down 2.1%, after briefly hitting $81,196 on a post-election bounce, while gold was fixed around $4,113 on 5 November. In the Premier League, Leeds beat Tottenham 1-0 on Saturday and Everton beat Coventry 3-1 on Friday (single source, unconfirmed).<br><strong>Why it matters:<\/strong> Risk assets stay volatile as rate and war expectations shift.<br><strong>Sources:<\/strong> <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://english.ahram.org.eg/News/581763.aspx\" target=\"_blank\" rel=\"noopener\">Ahram Online<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,376.86, Dow 51,285.73, Nasdaq 24,579.42 (Fri 6 Nov): <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a><\/li><li>Hang Seng 24,481.86 (-1.27%): <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Bitcoin about $75,916 weekly close: <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><li>Gold $4,112.85 (LBMA fix, 5 Nov): <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><li>Brent around $97.79, WTI $90.18 (5 Nov): <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Russia-Ukraine-US talks in Abu Dhabi, 10-11 November.<\/li><li>COP31 climate summit opening in Antalya on 9 November.<\/li><li>Iran-US strikes and Qatar-led mediation; US inflation data later in the week.<\/li><\/ul>"}, "us": {"line": "Trump ordered a Justice Department probe of Democrats days after their midterm sweep, Stephen Miller's rise as chief of staff drew vows of oversight, and Oregon stunned Ohio State.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump orders DOJ to investigate Democrats over alleged threats to officials and donors<\/span><span class=\"cat\">Politics / Justice<\/span><\/h2>\n<p><strong>What happened:<\/strong> In a Truth Social post on Saturday, Trump said he was ordering the Justice Department to look into what he called a \"criminal act\", accusing Democrats of threatening Attorney General Todd Blanche and other officials with impeachment and of threatening donors. He gave no evidence, named only Sen. Elissa Slotkin and denied that any impeachable acts had occurred. The Justice Department had not said whether it will open an investigation.<br><strong>Why it matters:<\/strong> The order previews a clash over oversight once Democrats take Congress in January.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/7/trump-orders-doj-to-investigate-democrats-for-threatening-people\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.foxnews.com/politics/trump-orders-doj-probe-democrats-over-alleged-threats-against-admin-officials.amp\" target=\"_blank\" rel=\"noopener\">Fox News<\/a>, <a href=\"https://political.org/2026/11/07/trump-orders-justice-department-to-look-into-democrats-over-alleged-threats-against-attorney-general-todd-blanche-donors/\" target=\"_blank\" rel=\"noopener\">Political.org<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Democrats vow oversight and legal fights as Miller replaces Wiles<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump named Stephen Miller, the architect of his deportation campaign, White House chief of staff to start on 9 November, moving Susie Wiles to his political operation. Gov. Gavin Newsom accused Miller of driving a \"sadistic mass deportation regime\", House Oversight's Robert Garcia said he should \"lawyer up\", and Sen. Ruben Gallego said he \"better get ready to testify\". Vance and Rubio praised the pick.<br><strong>Why it matters:<\/strong> The personnel shake-up three days after the midterm rout sets up an investigation-heavy next Congress.<br><strong>Sources:<\/strong> <a href=\"https://political.org/2026/11/06/democrats-vow-oversight-and-legal-fights-against-stephen-miller-after-trump-names-him-white-house-chief-of-staff/\" target=\"_blank\" rel=\"noopener\">Political.org<\/a>, <a href=\"https://www.bostonglobe.com/2026/11/06/nation/susie-wiles-replaced-stephen-miller-white-house-chief-of-staff/\" target=\"_blank\" rel=\"noopener\">Boston Globe<\/a>, <a href=\"https://www.whitehouse.gov/releases/2026/11/president-trump-names-stephen-miller-as-33rd-white-house-chief-of-staff/?query-11-page=2\" target=\"_blank\" rel=\"noopener\">White House<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Midterms shake Wall Street: AI stocks fall, alcohol and homebuilders gain<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> AP reports data-center and AI stocks fell as data-center skeptics won seats, while beer, wine and liquor makers rose on hopes a Democratic Congress eases tariffs. D.R. Horton rose 4.9%, PulteGroup 4.4% and Home Depot 2.9%, while energy shares slipped on hopes the war ends. The S&amp;P 500 finished the week down 2.7% at 7,376.86 and the Nasdaq down 3.37% at 24,579.42.<br><strong>Why it matters:<\/strong> It was the S&amp;P 500's worst week since April 2025 and left it about 5.7% below its 6 October record.<br><strong>Sources:<\/strong> <a href=\"https://www.ajc.com/news/2026/11/from-high-flying-ai-stocks-to-tariff-hit-alcohol-companies-the-midterms-shook-up-wall-street/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a>, <a href=\"https://www.lpl.com/research/blog/weekly-market-performance-november-6-2026.html\" target=\"_blank\" rel=\"noopener\">LPL Research<\/a>, <a href=\"https://www.staradvertiser.com/2026/11/07/breaking-news/dizzying-week-for-investors-as-politics-ai-and-the-economy-collide/\" target=\"_blank\" rel=\"noopener\">Star-Advertiser<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Oregon routs No. 11 Ohio State; Utah beats BYU in Holy War<\/span><span class=\"cat\">Sports<\/span><\/h2>\n<p><strong>What happened:<\/strong> Oregon came back from a two-touchdown deficit to beat No. 11 Ohio State 41-28 in Columbus, probably ending the Buckeyes' hopes of a third straight playoff berth. No. 3 Utah stayed unbeaten with a 28-20 win over No. 7 BYU, with Devon Dampier producing 264 yards of offense.<br><strong>Why it matters:<\/strong> The results reshape the College Football Playoff race a few weeks before selection.<br><strong>Sources:<\/strong> <a href=\"https://www.opb.org/article/2026/11/07/oregon-storms-back-from-2-touchdown-deficit-to-hammer-no-11-ohio-state-41-28/\" target=\"_blank\" rel=\"noopener\">OPB (AP)<\/a>, <a href=\"https://www.ajc.com/news/2026/11/utah-and-ucla-stay-unbeaten-texas-pulls-out-win-at-missouri-as-the-playoff-race-begins-in-earnest/\" target=\"_blank\" rel=\"noopener\">AJC (AP)<\/a>, <a href=\"https://www.yourvalley.net/stories/no-3-utah-stays-perfect-ends-holy-war-skid-against-no-7-byu,738861\" target=\"_blank\" rel=\"noopener\">Your Valley (AP)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Record Georgia-Tennessee flood moves up the Atlantic coast<\/span><span class=\"cat\">Weather / Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> Storms that caused a catastrophic 1-in-1,000-year flood on the Tennessee-Georgia line moved up the East Coast on Friday. At least one person died, in Murray County, Georgia, Tennessee coordinated 68 swift-water rescues, the Toccoa River hit a record 18 feet, and Gov. Brian Kemp declared an emergency for four counties. It was the second major flood in three months for some of the towns.<br><strong>Why it matters:<\/strong> Communities still recovering from an August flood face a second round of losses.<br><strong>Sources:<\/strong> <a href=\"https://www.ajc.com/news/2026/11/storms-that-caused-1-in-1000-year-flood-event-in-tennessee-and-georgia-move-up-atlantic-coast/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a>, <a href=\"https://www.opb.org/article/2026/11/06/heavy-rains-flood-towns-dozens-rescued-on-georgia-tennessee-border/\" target=\"_blank\" rel=\"noopener\">OPB (AP)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Man with three guns arrested near White House after saying voices told him to kill Trump<\/span><span class=\"cat\">Crime / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Secret Service officers approached a man in a parked car on Constitution Avenue and found several firearms, including an AR-15-style weapon, a Mac-10 and a Glock. DHS identified him as a 26-year-old Venezuelan national who said he heard voices telling him to kill Trump, though a court affidavit does not include that statement. The car had been reported stolen.<br><strong>Why it matters:<\/strong> Secret Service Director Sean Curran described it as part of a heightened threat environment.<br><strong>Sources:<\/strong> <a href=\"https://www.wftv.com/news/politics/secret-service/BMVEQVWG5IYQ7J4TANRUCYQMJE/?outputType=amp\" target=\"_blank\" rel=\"noopener\">AP via WFTV<\/a>, <a href=\"https://www.kold.com/2026/11/06/man-arrested-with-guns-near-white-house-reported-voices-telling-him-kill-president-trump/\" target=\"_blank\" rel=\"noopener\">KOLD<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Iran reviews Qatari proposals as US enforces blockade<\/span><span class=\"cat\">Security / Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Two Middle East officials told AP that Iran is reviewing Qatari proposals on its nuclear program, though one said Tehran will not negotiate until Washington meets core conditions. A roundup says US forces disabled a commercial vessel trying to run the blockade and that Trump described limited strikes on an Iranian air defense system (details unconfirmed).<br><strong>Why it matters:<\/strong> The talks and blockade enforcement will decide whether the war de-escalates after the midterms.<br><strong>Sources:<\/strong> <a href=\"https://www.yahoo.com/news/videos/ap-top-stories-november-7-220103416.html\" target=\"_blank\" rel=\"noopener\">AP Top Stories, 7 Nov<\/a>, <a href=\"https://beforeitsnews.com/opinion-conservative/2026/11/news-and-weather-briefing-for-saturday-november-07-2026-3747384.html\" target=\"_blank\" rel=\"noopener\">News and Weather Briefing, 7 Nov<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Justice Department appeals dismissal of Alaska Senate certification suit<\/span><span class=\"cat\">Courts / Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US District Judge Sharon Gleason dismissed a Justice Department suit seeking to block certification of Alaska's Senate race if Republican Sen. Dan Sullivan lost to Democrat Mary Peltola, citing lack of standing and the states' constitutional role in elections. DOJ said it will appeal. The race remained uncalled with a large share of ballots outstanding.<br><strong>Why it matters:<\/strong> The case is a test of federal efforts to shape election outcomes after Democrats won both chambers.<br><strong>Sources:<\/strong> <a href=\"https://www.wowt.com/2026/11/02/judge-dismisses-lawsuit-seeking-block-certification-alaska-senate-race-if-gop-incumbent-loses/?outputType=amp\" target=\"_blank\" rel=\"noopener\">AP via WOWT<\/a>, <a href=\"https://www.axios.com/2026/11/01/trump-doj-delay-alaska-midterm-results-rejected-judge\" target=\"_blank\" rel=\"noopener\">Axios<\/a>, <a href=\"https://www.alaskasnewssource.com/2026/11/06/peltola-sullivan-campaigns-project-wins-while-quarter-ballots-are-outstanding/\" target=\"_blank\" rel=\"noopener\">Alaska's News Source<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">House Democrats plan vast oversight of the Trump administration<\/span><span class=\"cat\">Politics / Congress<\/span><\/h2>\n<p><strong>What happened:<\/strong> AP reports House Democrats are preparing investigations of Trump, his family and administration, with hearings, subpoenas and document requests, and letters already sent to companies and contractors. Impeachment is an option, though leaders say it would not be a first move and would more likely target Cabinet members. Garcia cited Trump family dealings, the Epstein investigation and ICE operations as priorities.<br><strong>Why it matters:<\/strong> A Democratic House from January will test whether the administration honors subpoenas.<br><strong>Sources:<\/strong> <a href=\"https://www.pbs.org/newshour/amp/politics/house-democrats-plan-vast-oversight-of-trump-administration-impeachment-is-an-option\" target=\"_blank\" rel=\"noopener\">PBS NewsHour (AP)<\/a>, <a href=\"https://www.inquirer.com/politics/house-democrats-majority-midterms-oversight-trump-administration-family-cabinet-impeachment-20260926.html\" target=\"_blank\" rel=\"noopener\">Inquirer<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hiring rebounds in October as unemployment dips to 4.1%<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Employers added 165,000 jobs in October, far above forecasts of about 65,000, and the unemployment rate fell to 4.1%. August and September were revised up by 84,000, though hourly wages rose just 3.1% from a year earlier and the broader U-6 measure rose to 7.9%.<br><strong>Why it matters:<\/strong> A stronger labor market adds to Fed rate-hike arguments just as inflation data approaches.<br><strong>Sources:<\/strong> <a href=\"https://abc7news.com/story/us-employers-added-surprising-165000-jobs-october-unemployment-rate-dipped-41/20020018/\" target=\"_blank\" rel=\"noopener\">ABC7 (AP)<\/a>, <a href=\"https://www.foxbusiness.com/economy/us-jobs-report-october-2026.amp\" target=\"_blank\" rel=\"noopener\">Fox Business<\/a>, <a href=\"https://www.industryweek.com/talent/news/55417255/october-jobs-report-us-adds-165000-jobs-as-unemployment-falls-slightly-to-41\" target=\"_blank\" rel=\"noopener\">Industry Week<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Friday 6 Nov close): 7,376.86 - <a href=\"https://thriveinmarkets.com/market-insights/weekend-recap-2026-11-08/\" target=\"_blank\" rel=\"noopener\">Thrive in Markets<\/a><\/li><li>Nasdaq Composite: 24,579.42 - <a href=\"https://www.lpl.com/research/blog/weekly-market-performance-november-6-2026.html\" target=\"_blank\" rel=\"noopener\">LPL Research<\/a><\/li><li>10-year Treasury yield: not found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Monday: Miller takes over as chief of staff; Trump meets Qatar's prime minister on Iran.<\/li><li>Alaska and Mississippi Senate counts.<\/li><li>October inflation data and the Fed's rate-hike path.<\/li><\/ul>"}, "asia": {"line": "New Zealand's election ends without a clear winner and Asia reels from a brutal AI-stock selloff that sent the Kospi and Nikkei down about 6% in a day.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">New Zealand election leaves no clear winner as leaders prepare for weeks of talks<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> After Saturday's vote, AP reported that neither the right nor the left secured a decisive win, with 131 seats elected and 66 needed for a majority. Luxon's National-led coalition appeared to be close to the slimmest possible return to power, by one seat on election night, with National and Labour both near 29% of the party vote; ACT won 13 seats, NZ First 12 and the Opportunity Party seven. Seat totals differ between outlets and are provisional.<br><strong>Why it matters:<\/strong> A hung result means weeks of coalition bargaining, with a fresh vote possible if no government can be formed.<br><strong>Sources:<\/strong> <a href=\"https://www.bostonglobe.com/2026/11/08/world/new-zealanders-wont-know-for-weeks-who-won-election/\" target=\"_blank\" rel=\"noopener\">AP via Boston Globe<\/a>, <a href=\"https://www.opb.org/article/2026/11/08/no-clear-winner-in-new-zealand-election-as-leaders-prepare-for-weeks-of-talks/\" target=\"_blank\" rel=\"noopener\">NPR via OPB<\/a>, <a href=\"https://thenightly.com.au/politics/world/new-zealand-election-results-vote-counting-continues-as-chris-luxon-says-goodbye-to-key-ministers-c-23130739\" target=\"_blank\" rel=\"noopener\">The Nightly<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Kospi and Nikkei plunge about 6% in worst AI-led rout in months<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Friday the Kospi closed down 6.02% at 5,059.69, its lowest close since March, after plunging as much as 8.5% intraday and triggering a trading halt. The Nikkei 225 lost 5.96% and briefly sat about 20% below its June peak. The selloff followed a roughly $3 trillion rout in US tech shares after Democratic gains in the US midterms raised fears over AI data-centre rules.<br><strong>Why it matters:<\/strong> Korea and Japan are the most AI-exposed large markets in Asia, and a sell-off of this size tests margin lending and retail positioning.<br><strong>Sources:<\/strong> <a href=\"https://invezz.com/news/2026/11/06/kospi-crash-trading-halt-november-6/\" target=\"_blank\" rel=\"noopener\">Invezz<\/a>, <a href=\"https://news.sbs.co.kr/english/article.do?news_id=N1008834281\" target=\"_blank\" rel=\"noopener\">SBS News<\/a>, <a href=\"https://www.newsonair.gov.in/all-major-asian-indices-fall-japans-nikkei-plunges-6-south-koreas-kospi-lost-3-79/\" target=\"_blank\" rel=\"noopener\">Business Standard / newsonair<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">AI stocks halt worldwide selloff as Wall Street trims weekly loss<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Wall Street rebounded Friday, with the Nasdaq up about 1.1% to 24,579.42 and the S&amp;P 500 up 0.31%, though the Nasdaq still fell 3.37% for the week, its fourth straight weekly loss. The Dow had plunged 3.44% on Thursday. Analysts questioned whether the bounce would hold into the new week.<br><strong>Why it matters:<\/strong> Asian markets did not share in Friday's bounce, so Monday's open is the next test of the AI trade.<br><strong>Sources:<\/strong> <a href=\"https://koreatimes.co.kr/world/20261107/ai-stocks-halt-brutal-worldwide-sell-off-as-wall-street-trims-its-loss-for-the-week\" target=\"_blank\" rel=\"noopener\">Korea Times (AP)<\/a>, <a href=\"https://theedgemalaysia.com/node/824942\" target=\"_blank\" rel=\"noopener\">The Edge Malaysia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">South Korea's opposition demands Lee apologise for Kospi plunge<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> South Korea's opposition demanded that President Lee Jae Myung apologise for the Kospi plunge, Seoul Economic Daily reported on 8 November. SBS dubbed the 6% drop a \"Blue Wave Shock\" tied to the US midterm results, and Kospi barely defended the 5,000 level after breaching it intraday.<br><strong>Why it matters:<\/strong> The market rout, after a long run-up in Korean shares, is turning into a political attack line against the government.<br><strong>Sources:<\/strong> <a href=\"https://en.sedaily.com/politics/2026/11/08/opposition-demands-lee-apologize-for-kospi-plunge\" target=\"_blank\" rel=\"noopener\">Seoul Economic Daily<\/a>, <a href=\"https://news.sbs.co.kr/english/article.do?news_id=N1008834281\" target=\"_blank\" rel=\"noopener\">SBS News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Taiwan authorises market intervention after Taiex falls 4.5%<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Taiwan's stabilisation fund committee authorised market intervention on Friday after the Taiex tumbled 1,873 points, or 4.51%, to close below 40,000, with foreign institutions heavy sellers. It was a 5.67% two-day drop on worries about heavy AI spending.<br><strong>Why it matters:<\/strong> The fund has been activated only a handful of times since 2000, a sign of how seriously Taipei treats the AI-driven swings.<br><strong>Sources:<\/strong> <a href=\"https://focustaiwan.tw/business/202611060020\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a>, <a href=\"https://www.siliconreport.com/taiwan-activates-market-stabilization-measures-to-stem-ai-selloff\" target=\"_blank\" rel=\"noopener\">Silicon Report<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">China pledges stock-market stabilisation; GE signs $12.9 billion at import expo [Economy] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A China business digest said the State Council pledged improved policy mechanisms to stabilise stock markets after another selloff, with CICC and China Galaxy Securities deploying funds under the third round of the central bank's securities swap facility. It also reported GE Aerospace signed record sales and service agreements worth more than $12.9 billion during the China International Import Expo in Shanghai. I could not confirm either item with a second source.<br><strong>Why it matters:<\/strong> Beijing is moving to cushion equity volatility while showcasing trade openness before APEC in Shenzhen.<br><strong>Sources:<\/strong> <a href=\"https://www.citynewsservice.cn/articles/china-biz-buzz/daily-buzz/weekend-buzz-7-8-november-2026-3n70vqym\" target=\"_blank\" rel=\"noopener\">City News Service: Weekend Buzz 7-8 Nov<\/a>, <a href=\"https://shenshiweioffical.substack.com/p/china-this-week-five-things-you-need-a31\" target=\"_blank\" rel=\"noopener\">China This Week newsletter<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Delhi building collapse: six dead, owner and contractors arrested<\/span><span class=\"cat\">Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> Police said on Saturday the death toll in the 5 November collapse of a three-storey under-construction building at Chawri Bazar in Old Delhi had reached six, and the owner and three contractors were arrested. Rescue teams from the NDRF, fire services and police continued searching, and an MCD official said no building plan had been sanctioned.<br><strong>Why it matters:<\/strong> The case highlights illegal construction in India's crowded old city areas and could prompt a crackdown.<br><strong>Sources:<\/strong> <a href=\"https://www.siasat.com/death-toll-in-delhi-building-collapse-rises-to-six-4-arrested-3571422/\" target=\"_blank\" rel=\"noopener\">Siasat<\/a>, <a href=\"https://www.theweek.in/wire-updates/national/2026/11/06/rescue-efforts-enter-2nd-day-at-old-delhi-building-collapse-site.html\" target=\"_blank\" rel=\"noopener\">The Week (PTI)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">US reportedly asks China to use influence with Tehran to end Iran war [Diplomacy] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A Times of Israel liveblog, citing a Washington Post columnist, reported that US Treasury Secretary Scott Bessent reached out to China to press Iran to end the war. This is secondhand reporting and no official confirmation was found.<br><strong>Why it matters:<\/strong> It points to Iran being on the Trump-Xi agenda at APEC in Shenzhen, and Asia is the region most hurt by Hormuz disruption.<br><strong>Sources:<\/strong> <a href=\"https://www.timesofisrael.com/liveblog-november-07-2026/\" target=\"_blank\" rel=\"noopener\">Times of Israel liveblog<\/a>, <a href=\"https://www.koreatimes.co.kr/world/20261107/china-confirms-discussions-underway-on-historic-xi-trump-putin-meeting\" target=\"_blank\" rel=\"noopener\">Korea Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">North Korea: Pyongyang rebuffs talks while leaving door ajar to US [Security] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Korean media reported in early November that North Korea claims no interest in talks while pairing threats with rhetoric aimed at Washington; Kim Jong Un oversaw a new missile test in October. Speculation has centred on a possible Trump-Kim contact around APEC on 18-19 November, which is not confirmed.<br><strong>Why it matters:<\/strong> Seoul and Tokyo fear being sidelined if Washington opens a channel to Pyongyang.<br><strong>Sources:<\/strong> <a href=\"https://www.koreadaily.com/article/20261103213806129\" target=\"_blank\" rel=\"noopener\">Korea Daily<\/a>, <a href=\"https://www.armscontrol.org/act/2026-10/news/pyongyang-launches-new-missile-after-seoul-urges-sanctions-relief\" target=\"_blank\" rel=\"noopener\">Arms Control Association<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Thailand tightens borders ahead of ASEAN talks on Myanmar [Security] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Thai media reported Thailand backs US-Myanmar talks before the November ASEAN summit and has stepped up border security after stray Myanmar fire injured a civilian in Mae Sot on 29 October. Thailand expects ASEAN leaders to discuss their approach to Myanmar in Manila.<br><strong>Why it matters:<\/strong> Myanmar's civil conflict and Thai-Cambodian border tensions are two live security issues for the region's summit.<br><strong>Sources:<\/strong> <a href=\"https://www.nationthailand.com/news/asean/40072668\" target=\"_blank\" rel=\"noopener\">The Nation Thailand<\/a>, <a href=\"https://www.nationthailand.com/news/asean/40073248\" target=\"_blank\" rel=\"noopener\">The Nation Thailand<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Kospi: closed 5,059.69 on 6 Nov, down 6.02% - <a href=\"https://invezz.com/news/2026/11/06/kospi-crash-trading-halt-november-6/\" target=\"_blank\" rel=\"noopener\">Invezz<\/a><\/li><li>Nikkei 225: down 5.96% on 6 Nov (level not confirmed) - <a href=\"https://www.newsonair.gov.in/all-major-asian-indices-fall-japans-nikkei-plunges-6-south-koreas-kospi-lost-3-79/\" target=\"_blank\" rel=\"noopener\">newsonair<\/a><\/li><li>Taiex: closed below 40,000 on 6 Nov, down 4.51% - <a href=\"https://focustaiwan.tw/business/202611060020\" target=\"_blank\" rel=\"noopener\">Focus Taiwan<\/a><\/li><li>Shanghai Composite and USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Monday's Asian open after Friday's AI-stock rout and Taiwan's intervention.<\/li><li>New Zealand special votes and coalition talks.<\/li><li>15-17 Nov ASEAN summit in Manila; 18-19 Nov APEC in Shenzhen.<\/li><\/ul>"}, "hk": {"line": "About 30 defective pillars at the Tung Chung West MTR station and a 28-arrest bid-rigging sweep led Saturday's news, while Alex Eala reached the Hong Kong Open final and a strong cold front was forecast.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">About 30 defective pillars found at Tung Chung West station<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> About 30 pillars at the Tung Chung West station, under construction, were found defective. The Buildings Department said an engineer first found a defective pillar in early October and that there was no immediate danger. The Highways Department said the contractor tried repairs with an unapproved method; MTR told the main contractor to stop work. The Transport and Logistics Bureau ordered MTR to report within two weeks. The 2029 opening target is unchanged.<br><strong>Why it matters:<\/strong> It raises questions about construction oversight on a new rail project.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347832/30-defective-pillars-found-at-Tung-Chung-West-station-as-MTR-ordered-to-report-within-two-weeks\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/transport/article/3373646/mtr-corporation-halts-unauthorised-remedial-works-station-after-column-concerns\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Task force arrests 28 in first bid-rigging operation after Tai Po fire<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A joint task force of police, the ICAC and the Competition Commission arrested 28 people on Friday, including directors and staff of at least six contractors and 10 consultant firms. A suspected triad-linked syndicate allegedly secured 12 works contracts at residential estates. A 24-hour reporting hotline was announced.<br><strong>Why it matters:<\/strong> It is the first operation of the task force set up after the Wang Fuk Court fire report.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/2026/11/07/hong-kong-arrests-28-in-building-bid-rigging-probe-rthk-says\" target=\"_blank\" rel=\"noopener\">The Star (RTHK)<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/law-and-crime/article/3373575/hong-kong-authorities-arrest-28-crackdown-bid-rigging-after-tai-po-fire\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">National security police arrest man over importing seditious books<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> National security police arrested a 34-year-old man, a company director, on suspicion of importing seditious publications from Taiwan for local bookstores in October. Officers searched his home and company and seized devices, documents and books. The Star reports he is the person in charge of the prisoner support group Waiting Bird; The Standard cites sources calling him a member. Waiting Bird said more than 60 ordered books went missing in a Taiwan shipment and denied seditious intent.<br><strong>Why it matters:<\/strong> It continues enforcement under the national security laws against publications and civil-society groups.<br><strong>Sources:<\/strong> <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/07/hong-kong-police-arrest-operator-of-prisoner-support-group-over-allegedly-seditious-books\" target=\"_blank\" rel=\"noopener\">The Star<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/347682/National-Security-Department-arrests-man-over-importing-seditious-books-for-local-bookstores\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Woman rescued from Tin Shui Wai flat fire; about 100 flee<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Police were alerted at 5.39pm on Saturday to smoke from a flat at Locwood Court, Kingswood Villas, Tin Shui Wai. Firefighters rescued a 67-year-old woman, who was taken to hospital, and about 100 residents fled. A preliminary investigation pointed to aromatherapy items as the ignition source.<br><strong>Why it matters:<\/strong> It is a fire-safety reminder in a city still reviewing the Tai Po blaze.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/hong-kong/society/article/3373665/woman-hurt-flat-fire-suspected-have-been-caused-aromatherapy-items\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">No. 3 alarm fire at Yuen Long paper offerings warehouse; 12 evacuated<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> A No. 3 alarm fire broke out around 11pm on Friday at a warehouse storing joss paper and paper offerings in Pak Sha Tsuen, off Kung Um Road. Twelve people were evacuated and no casualties were reported; the cause is under investigation.<br><strong>Why it matters:<\/strong> Such storage sites are a recurring fire risk in the New Territories.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347772/No-casualties-reported-after-paper-product-warehouse-in-Yuen-Long-hit-by-No-3-alarm-fire\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Eala beats Sakkari to reach Hong Kong Open final<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Second seed Alex Eala beat fourth seed Maria Sakkari 7-5, 3-6, 6-4 in a rain-interrupted semi-final lasting 2 hours 43 minutes. She meets American Claire Liu, who beat Alexandra Shubladze, in Sunday's final.<br><strong>Why it matters:<\/strong> The final decides the title at the city's WTA event.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/sports-updates/article/347787/Eala-to-face-Sakkari-in-HK-Tennis-Open-semi-final-after-rain-hit-win\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.wtatennis.com/news/4606011/eala-tops-sakkari-in-rain-impacted-semifinal-to-set-hong-kong-final-against-liu\" target=\"_blank\" rel=\"noopener\">WTA<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Strong cold front forecast to bring temperatures down to 16 degrees<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Observatory expected a strong cold front to cross the coast on Monday, with temperatures dropping to around 16 degrees in urban areas on Tuesday.<br><strong>Why it matters:<\/strong> It marks the first sharp cooling of the season for commuters and outdoor events.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347816/Hong-Kong-temperatures-to-drop-9-degrees-as-strong-cold-front-arrives-Mon\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong/health-environment/article/3373545/hong-kong-temperatures-fall-18-degrees-next-week-cold-front-hits\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hang Seng falls 1.27% on Friday to 24,481.86<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index fell 315.12 points, or 1.27%, on 6 November, on turnover of HK$247.428 billion. The Tech Index fell 1.83% to 4,078.23.<br><strong>Why it matters:<\/strong> It ends the week on a weak note ahead of APEC in Shenzhen.<br><strong>Sources:<\/strong> <a href=\"https://www.news.cn/fortune/20261106/9f4ade0f744643b69131fe558ccc94b4/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Tuen Mun estate cancels owners' meeting after ICAC notice<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Elegance Gardens cancelled a Friday-night special meeting to choose a repair contractor after an urgent ICAC notice. Sources said members of its maintenance consultant firm were among those arrested (unconfirmed).<br><strong>Why it matters:<\/strong> It shows the bid-rigging probe reaching individual estates.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347784/Tuen-Muns-Elegance-Gardens-cancels-owners-meeting-after-ICAC-notice-consultant-firm-members-reportedly-arrested\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Test of trust for new housing checks unit after Wang Fuk Court fire<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> SCMP published an analysis on 7 November on whether the government's new housing checks unit can earn public trust (headline only; unconfirmed).<br><strong>Why it matters:<\/strong> It bears on confidence in post-fire building-safety reforms.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/topics/hong-kong-fires-and-safety\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 24,481.86 (6 Nov), down 1.27% - <a href=\"https://www.news.cn/fortune/20261106/9f4ade0f744643b69131fe558ccc94b4/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Hang Seng Tech Index 4,078.23, down 1.83% - <a href=\"https://www.news.cn/fortune/20261106/9f4ade0f744643b69131fe558ccc94b4/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Weather: urban low of about 16 degrees forecast for Tuesday - <a href=\"https://www.thestandard.com.hk/news/article/347816/Hong-Kong-temperatures-to-drop-9-degrees-as-strong-cold-front-arrives-Mon\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/li><li>HIBOR and USD/HKD: no verifiable November 2026 figures found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Hong Kong Open final: Eala v Liu.<\/li><li>Cold front arrival on Monday.<\/li><li>MTR report on Tung Chung West due within two weeks.<\/li><\/ul>"}}}, {"date": "2026-11-07", "ed": {"world": {"line": "A blowout US jobs report, a Bank of England rate rise and fresh US strikes near Iran headlined a Friday that followed the week's AI-stock rout and Democratic midterm sweep.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US strikes Iran's Qeshm Island as Trump says talks are \"progressing very well\"<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump confirmed limited US strikes that destroyed Iranian air-defence artillery on Qeshm Island, in the Strait of Hormuz, calling them minor. Earlier on 6 November he said talks with Iranian representatives were going very well, while the IRGC Navy said Hormuz would stay closed until Iran's conditions are met. Qatar is pushing an interim deal to halt escalation, and dates for some Qeshm strikes differ across outlets.<br><strong>Why it matters:<\/strong> The simultaneous strikes and diplomacy show how fragile the Gulf standoff is for global energy supply.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/7/trump-confirms-new-us-strikes-on-irans-qeshm-island\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://scmp.com/news/world/middle-east/article/3373633/trump-confirms-fresh-iran-strikes-days-after-voters-punish-war-polls\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.rferl.org/a/iran-live-blog-trump-middle-east/33803414.html\" target=\"_blank\" rel=\"noopener\">RFE/RL<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US adds 165,000 jobs, well above forecasts<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> October payrolls rose 165,000 versus roughly 65,000 expected, and unemployment dipped from 4.2% to 4.1%. The dollar climbed and traders cut bets on near-term rate relief. The S&amp;P 500 closed at 7,376.86 (+0.31%), the Nasdaq at 24,579.42 (+1.09%) and the Dow at 51,285.73 (-0.46%).<br><strong>Why it matters:<\/strong> A hot labour market, with war-driven inflation, makes Fed easing unlikely and keeps borrowing costs high.<br><strong>Sources:<\/strong> <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a>, <a href=\"https://econotimes.com/U-S-Adds-165-000-Jobs-in-October-as-Wall-Street-Ends-Week-Lower-1772683\" target=\"_blank\" rel=\"noopener\">EconoTimes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Bank of England raises rates to 4%<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The BoE lifted Bank Rate by 25 basis points to 4.00%, its first hike since 2023, citing energy-driven inflation. Staff project inflation near 5% by mid-2027; reports differ on the vote (most say 8-1, one says 9-0). Sterling barely reacted.<br><strong>Why it matters:<\/strong> It shows major central banks tightening again because of the Middle East energy shock.<br><strong>Sources:<\/strong> <a href=\"https://tradingeconomics.com/united-kingdom/interest-rate/news/598618\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a>, <a href=\"https://kuwaittimes.com/article/53075/business/boe-lifts-rate-for-first-time-since-2023-to-curb-prices/\" target=\"_blank\" rel=\"noopener\">Kuwait Times<\/a>, <a href=\"https://www.babypips.com/analysis/headline-boe-hiked-rates-why-gbp-just-shrugged-2026-11-06\" target=\"_blank\" rel=\"noopener\">BabyPips<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Tech rebounds after Thursday's AI sell-off<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Chip and AI stocks recovered on Friday after a Thursday rout that reports put at over 5% for the Nasdaq, driven by fears a Democratic Congress will regulate AI and by valuation worries. Sources disagree on the size of Thursday's fall. For the week the Nasdaq lost 3.4%.<br><strong>Why it matters:<\/strong> AI shares carry huge weight in US indexes, so regulatory risk now moves broad markets.<br><strong>Sources:<\/strong> <a href=\"https://theedgemalaysia.com/node/824763\" target=\"_blank\" rel=\"noopener\">Edge Malaysia<\/a>, <a href=\"https://www.zacks.com/stock/news/3025392/stock-market-news-for-nov-6-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Democrats' Congress sweep reshapes Washington<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> With both chambers flipped, Hakeem Jeffries is set to be Speaker and House Democrats are on track for their largest majority in nearly two decades. Trump says he will veto Democratic bills; Jeffries urged him to end the Iran war before the new Congress starts. A White House request for $67 billion in Iran war funding is pending.<br><strong>Why it matters:<\/strong> The result limits Trump's ability to fund the war or pass his agenda.<br><strong>Sources:<\/strong> <a href=\"https://www.nbcsandiego.com/elections/election-day-after-2026-midterms-congress-results-live-updates/4096585/\" target=\"_blank\" rel=\"noopener\">NBC San Diego<\/a>, <a href=\"https://www.argusmedia.com/en/news-and-insights/latest-market-news/2901877-trump-faces-new-limits-after-midterms-blowout\" target=\"_blank\" rel=\"noopener\">Argus Media<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Judge halts Trump's planned triumphal arch for 14 days<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Judge Tanya Chutkan issued a temporary order after a federal planning commission approved the arch near Arlington Memorial Circle. She found construction likely to harm Washington and Virginia and said the arch is \"a tribute to Donald Trump.\"<br><strong>Why it matters:<\/strong> It tests the limits of executive power over federal land and building projects.<br><strong>Sources:<\/strong> <a href=\"https://www.wlox.com/2026/11/06/federal-judge-orders-14-day-delay-any-work-beginning-trumps-monumental-arch/\" target=\"_blank\" rel=\"noopener\">WLOX<\/a>, <a href=\"https://www.wwno.org/npr-news/2026-11-05/a-judge-blocked-construction-of-trumps-arch-at-the-11th-hour-whats-next\" target=\"_blank\" rel=\"noopener\">NPR via WWNO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">WHO: Ebola in DR Congo passes 10,600 cases<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> WHO's 6 November bulletin reported 10,668 confirmed cases and 5,198 deaths of the Bundibugyo strain, with 1,463 new cases in 21 days, mostly in Ituri and North Kivu. Cases have reached Uganda, Kenya and Nigeria; Kenya has begun a 42-day countdown toward being declared Ebola-free.<br><strong>Why it matters:<\/strong> It is the second-largest Ebola outbreak ever recorded and is still growing in the east.<br><strong>Sources:<\/strong> <a href=\"https://who.int/emergencies/disease-outbreak-news/item/2026-DON618\" target=\"_blank\" rel=\"noopener\">WHO<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hang Seng drops 1.27% after a big week<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng closed at 24,481.86, down 315 points, with the tech index off 1.83% on a HK$247 billion turnover. It still gained 5.1% over the week, helped by a 3.67% jump on Thursday to 24,796.98.<br><strong>Why it matters:<\/strong> Hong Kong stocks are swinging sharply with US tech and rate news.<br><strong>Sources:<\/strong> <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua (6 Nov)<\/a>, <a href=\"https://www.news.cn/fortune/20261105/30dca13060c845e8aeb2926ad0009301/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua (5 Nov)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Oil whipsaws on peace hopes; Bitcoin stuck near $76,000<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Oil crashed on hopes that Democrats will push an end to the war, then rebounded as talks stalled, with Brent near $98 on Thursday. Bitcoin hovered around $76,000 after a brief post-election spike above $81,000, and gold was fixed near $4,113 on Thursday.<br><strong>Why it matters:<\/strong> Energy and crypto both trade on war-and-politics headlines, feeding inflation worries.<br><strong>Sources:<\/strong> <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a>, <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Premier League: Everton beat Coventry 3-1<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Everton beat Coventry City 3-1 on Friday night in Matchday 10, with Leeds and Tottenham due to play on Saturday (single source, unconfirmed).<br><strong>Why it matters:<\/strong> The weekend fixtures shape the early-season table.<br><strong>Sources:<\/strong> <a href=\"https://english.ahram.org.eg/News/581763.aspx\" target=\"_blank\" rel=\"noopener\">Ahram Online<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,376.86, Dow 51,285.73, Nasdaq 24,579.42 (6 Nov): <a href=\"https://www.hl.co.uk/shares/stock-market-news/market-reports/us-close-tech-stocks-rebound-after-sell-off,-dow-slips-after-jobs-report\" target=\"_blank\" rel=\"noopener\">Hargreaves Lansdown<\/a><\/li><li>Hang Seng 24,481.86 (-1.27%): <a href=\"https://www.xinhuanet.com/20261106/e84e9fa5dde846c9b3eacfaa9ca7e983/c.html\" target=\"_blank\" rel=\"noopener\">Xinhua<\/a><\/li><li>Brent about $97.79, WTI $90.18 (5 Nov): <a href=\"https://pandaforecast.com/crypto-news/bitcoin-midterm-bounce-chip-rout-liquidations-etf-outflows/\" target=\"_blank\" rel=\"noopener\">Panda Forecast<\/a><\/li><li>Bitcoin about $76,000 (weekly close $75,916): <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><li>Gold $4,112.85 (LBMA fix, 5 Nov): <a href=\"https://www.bernama.com/en/news.php?id=2631215\" target=\"_blank\" rel=\"noopener\">Bernama<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Further US-Iran strikes and Qatar-led mediation over the weekend.<\/li><li>COP31 climate summit opening in Antalya on 9 November.<\/li><li>US-Russia-Ukraine talks in Abu Dhabi on 10-11 November.<\/li><\/ul>"}, "us": {"line": "Trump replaced his chief of staff with Stephen Miller days after the midterm rout, a stronger-than-expected jobs report raised Fed-hike bets, and a judge froze work on Trump's arch.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump names Stephen Miller chief of staff, replacing Susie Wiles<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump announced on Friday that Miller, the deputy chief of staff and architect of his mass-deportation campaign, will become White House chief of staff on 9 November. Susie Wiles, who said Friday was her last day, moves to the Trump political operation, and Trump told reporters \"I wanted to make a change.\" Newsom called Miller's regime \"sadistic\", and Democratic House members vowed investigations.<br><strong>Why it matters:<\/strong> The shake-up three days after Democrats won Congress points to a harder line on immigration and a confrontational posture toward oversight.<br><strong>Sources:<\/strong> <a href=\"https://www.ctvnews.ca/world/article/trump-replaces-susie-wiles-with-stephen-miller-as-chief-of-staff-after-gops-midterm-defeat/\" target=\"_blank\" rel=\"noopener\">CTV News<\/a>, <a href=\"https://www.bostonglobe.com/2026/11/06/nation/susie-wiles-replaced-stephen-miller-white-house-chief-of-staff/\" target=\"_blank\" rel=\"noopener\">Boston Globe<\/a>, <a href=\"https://www.whitehouse.gov/releases/2026/11/president-trump-names-stephen-miller-as-33rd-white-house-chief-of-staff/?query-11-page=2\" target=\"_blank\" rel=\"noopener\">White House<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Employers add 165,000 jobs in October; unemployment falls to 4.1%<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Payrolls rose 165,000, far above forecasts of about 65,000, and the unemployment rate dipped to 4.1% from 4.2%. Professional and business services added 70,000 jobs and health care 42,000, and August and September were revised up by 84,000. Hourly wages rose just 3.1% over the year, and the broader U-6 rate rose to 7.9%.<br><strong>Why it matters:<\/strong> The strong report solidifies expectations that the Federal Reserve will raise rates in December.<br><strong>Sources:<\/strong> <a href=\"https://abc7news.com/story/us-employers-added-surprising-165000-jobs-october-unemployment-rate-dipped-41/20020018/\" target=\"_blank\" rel=\"noopener\">ABC7 (AP)<\/a>, <a href=\"https://www.foxbusiness.com/economy/us-jobs-report-october-2026.amp\" target=\"_blank\" rel=\"noopener\">Fox Business<\/a>, <a href=\"https://www.bls.gov/news.release/empsit.nr0.htm?tc=ix\" target=\"_blank\" rel=\"noopener\">BLS<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Stocks rebound Friday but cap a bruising week for AI shares<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happene
