<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1b1d21; --muted:#6b6f78; --line:#e4e0d6;
  --accent:#b4441f; --accent-soft:#f6e6de; --chip:#efece4; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --card:#1f2228; --ink:#eceae4; --muted:#9a9ea8; --line:#2e323a;
    --accent:#f08a5d; --accent-soft:#3a2a22; --chip:#2a2e35; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.date-btn{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;font:inherit}
.date-btn .d{font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-btn .d svg{flex:none;opacity:.6}
.nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
.seg{max-width:720px;margin:10px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--chip);
  border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px/1 inherit;font-family:inherit;padding:9px 0;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4;cursor:default}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 40px)}
.oneline{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:4px 0 18px;font-size:16px}
.oneline b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.content h2.story{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:18px;line-height:1.35;margin:0;
  padding:16px 16px 6px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
.content h2.story + p{margin:-1px 0 14px;padding:0 16px 16px;background:var(--card);border:1px solid var(--line);border-top:0;
  border-radius:0 0 16px 16px;box-shadow:var(--shadow);font-size:15px}
.num{flex:none;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;min-width:1.4em}
.ht{flex:1 1 200px}
.cat{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  background:var(--chip);padding:3px 8px;border-radius:999px}
.content strong{font-weight:650}
.content h2:not(.story),.content h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 8px}
.content ul{margin:0 0 12px;padding:0 0 0 20px}
.content li{margin:4px 0}
.content > p{margin:0 0 12px}
.foot{color:var(--muted);font-size:13px;margin-top:28px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* date sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:var(--card);border-radius:20px 20px 0 0;z-index:21;
  transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sheet h3{margin:0;padding:16px 18px 10px;font-size:15px}
.sheet ul{list-style:none;margin:0;padding:0 8px 12px;overflow:auto}
.sheet li button{width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:10px 10px;border-radius:12px;cursor:pointer}
.sheet li button.cur{background:var(--accent-soft)}
.sheet li .sd{font-weight:650}
.sheet li .sl{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){ .sheet{left:50%;right:auto;width:480px;margin-left:-240px} }
</style>
</head>

<script>
const DATA = [{"date": "2026-11-16", "ed": {"world": {"line": "Tanker mine incidents near Hormuz and a possible Trump-Xi-Putin encounter in Shenzhen dominate a week that also brings Nvidia earnings, Anthropic's Nasdaq debut and the climax of COP31.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Tankers hit mines near the Strait of Hormuz<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Iran's Revolutionary Guard says two oil tankers hit mines near the Strait of Hormuz and caught fire, with one reportedly sinking. Reuters could not independently verify the claim. Iran also says talks with Oman on the strait's future are at the \"final stage\" (unconfirmed).<br><strong>Why it matters:<\/strong> Hormuz flows are far below pre-war levels, so each incident feeds oil prices and shipping insurance costs worldwide.<br><strong>Sources:<\/strong> <a href=\"https://arabnews.com/middle-east/irans-navy-says-oil-tanker-on-fire-after-hitting-mine-east-of-hormuz-3012121\" target=\"_blank\" rel=\"noopener\">Arab News<\/a>, <a href=\"https://www.anews.com.tr/middle-east/2026/11/15/iran-says-2-oil-tankers-hit-mines-near-strait-of-hormuz-1-sinks\" target=\"_blank\" rel=\"noopener\">A News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Trump, Xi and Putin expected at APEC in Shenzhen<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Kremlin says Putin, Xi and Trump will hold a trilateral meeting in Shenzhen on 19 November, during the APEC leaders' summit. Beijing had earlier appeared lukewarm and the format was not final, so treat the date as unconfirmed.<br><strong>Why it matters:<\/strong> A first three-way summit of the nuclear powers could touch on Ukraine, arms control and trade, and it takes place next to Hong Kong.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/amp/news/2026/11/6/what-a-trump-xi-putin-summit-would-mean-and-what-it-wouldnt\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.thestandard.com.hk/world/article/341603/Kremlin-says-Putin-Xi-and-Trump-may-hold-a-trilateral-meeting-in-November\" target=\"_blank\" rel=\"noopener\">The Standard HK<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Russia pounds Ukraine as peace diplomacy stalls<\/span><span class=\"cat\">Conflict<\/span><\/h2>\n<p><strong>What happened:<\/strong> Zelensky says Russia fired over 2,300 attack drones, 1,590 glide bombs and 15 missiles in a week, including a mass attack on Odesa region. Ukraine struck refineries in Tatarstan and airfields inside Russia. Zelensky also says Washington floated NATO membership in exchange for withdrawal from Donbas.<br><strong>Why it matters:<\/strong> Attacks on energy infrastructure and the stalled US-brokered talks shape Europe's security and energy outlook.<br><strong>Sources:<\/strong> <a href=\"https://kyivindependent.com/ukraine-war-latest-russia-launches-mass-attack-on-odesa-oblast-as-ukraine-strikes-airfield-drone-launch-site-in-russia/\" target=\"_blank\" rel=\"noopener\">Kyiv Independent<\/a>, <a href=\"https://www.cnn.com/world/europe/ukraine\" target=\"_blank\" rel=\"noopener\">CNN<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Nvidia earnings and Anthropic IPO headline the market week<\/span><span class=\"cat\">Markets / Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia reports fiscal Q3 results on 17 November after the close, with consensus near $108.7 billion in revenue, after a 13% weekly share drop. Anthropic is set to debut on Nasdaq on 19 November. Futures edged higher on Sunday.<br><strong>Why it matters:<\/strong> Together they test whether AI valuations hold up, and they could set the tone for global tech stocks.<br><strong>Sources:<\/strong> <a href=\"https://www.tradingview.com/news/moodys:45cad514d6c8f:0-wall-street-week-ahead-nvidia-earnings-anthropic-ipo-federal-reserve-minutes-retail-sales-top-things-to-watch/\" target=\"_blank\" rel=\"noopener\">TradingView News<\/a>, <a href=\"https://www.cnbc.com/2026/11/15/stock-market-today-live-updates.html\" target=\"_blank\" rel=\"noopener\">CNBC<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Fed rate-hike fears build<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Markets are pricing possible tightening. Governor Waller reportedly said he is open to a 50-basis-point hike. Chair Kevin Warsh speaks Monday and FOMC minutes are due Wednesday (single-source on Waller: unconfirmed).<br><strong>Why it matters:<\/strong> Higher US rates pressure equities, emerging markets and the Hong Kong dollar peg's funding costs.<br><strong>Sources:<\/strong> <a href=\"https://www.fxstreet.com/analysis/week-ahead-fed-minutes-inflation-data-and-nvidia-earnings-to-guide-investors-202611131033\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a>, <a href=\"https://www.tradingview.com/news/moodys:45cad514d6c8f:0-wall-street-week-ahead-nvidia-earnings-anthropic-ipo-federal-reserve-minutes-retail-sales-top-things-to-watch/\" target=\"_blank\" rel=\"noopener\">TradingView News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">US air traffic control outage disrupts flights<\/span><span class=\"cat\">Business / Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> The FAA says its air traffic control system is stable after a nationwide outage, but thousands of flights were expected to be cancelled as airlines recover (reported in one roundup only: unconfirmed).<br><strong>Why it matters:<\/strong> It points to fragile aviation infrastructure ahead of the holiday travel peak.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">COP31 in Antalya enters its final week<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> Talks run 9-20 November under a Turkey-Australia co-presidency, the first UN climate conference since the US withdrawal from the Paris Agreement took effect. Bowen has acknowledged differences over ambition, and a health-resilience initiative has been launched.<br><strong>Why it matters:<\/strong> The outcome will indicate whether climate action can advance without US participation in a year expected to be among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://enb.iisd.org/antalya-un-climate-change-conference-cop31-daily-report-9nov2026\" target=\"_blank\" rel=\"noopener\">Earth Negotiations Bulletin<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Gaza ceasefire strained by continued strikes<\/span><span class=\"cat\">Conflict<\/span><\/h2>\n<p><strong>What happened:<\/strong> Israeli forces killed a senior Hamas commander in an overnight strike in southern Gaza, despite the ceasefire's second phase. Gaza's health ministry says more than 900 people have been killed during the truce.<br><strong>Why it matters:<\/strong> Repeated targeted killings risk collapsing the truce and stalling reconstruction.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a>, <a href=\"https://thenightly.com.au/world/middle-east/israel-kills-senior-hamas-commander-in-gaza-airstrike-war-continues-amid-ceasefire-talks-c-19189531\" target=\"_blank\" rel=\"noopener\">The Nightly<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Asia-Pacific security and regional politics<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> ASEAN leaders extended a ban on Myanmar's leader attending regional summits, and the Philippines and Australia upgraded their defence pact (single roundup: unconfirmed). Hong Kong is preparing to host APEC delegates transiting to Shenzhen.<br><strong>Why it matters:<\/strong> It shows regional hedging as US-China-Russia summitry approaches.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a>, <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard HK<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Health: measles, Legionnaires' and a large outbreak in DR Congo<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> The CDC counts 2,371 US measles cases in 2026. New York City reported a seventh Legionnaires' death. In DR Congo, officials say deaths exceed 1,500 and cases 6,000, though the disease was not identified in my sources (unconfirmed).<br><strong>Why it matters:<\/strong> Falling vaccination and strained health systems keep outbreak risk elevated.<br><strong>Sources:<\/strong> <a href=\"https://www.cidrap.umn.edu/all-news?page=1\" target=\"_blank\" rel=\"noopener\">CIDRAP<\/a>, <a href=\"https://www.sciencedaily.com/terms/epidemiology.htm\" target=\"_blank\" rel=\"noopener\">ScienceDaily<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Last confirmed weekly figures (week to 6 Nov): S&amp;P 500 7,376.86, Nasdaq 24,579.42, WTI $90.83, gold about $4,070 - <a href=\"https://thriveinmarkets.com/market-insights/weekend-recap-2026-11-08/\" target=\"_blank\" rel=\"noopener\">Thrive in Markets<\/a><\/li><li>Bitcoin about $74,000 on 11 Nov - <a href=\"https://cointelegraph.com/markets/bitcoin-74k-stocks-us-bond-yield-inflation-cpi\" target=\"_blank\" rel=\"noopener\">Cointelegraph<\/a><\/li><li>Latest Friday 13 Nov closes, Hang Seng and USD/HKD: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>17 Nov: Nvidia earnings and US retail sales; 18 Nov: FOMC minutes.<\/li><li>18-19 Nov: APEC in Shenzhen and a possible Trump-Xi-Putin meeting; 19 Nov: Anthropic Nasdaq debut.<\/li><li>20 Nov: COP31 closes; 29 Nov: possible Cape Verde presidential runoff.<\/li><\/ul>"}, "us": {"line": "A post-midterm Washington is split over the Iran war and a year-end spending fight, while markets brace for Nvidia earnings and Fed minutes.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump signals he may hold off on new Iran strikes<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Reuters reports Trump told senior advisers he may hold off on attacking Iran if there are no new provocations from Tehran or the Houthis. He also posted that \"We don't need a deal with Iran.\" Bahrain said it intercepted Iranian attacks that Tehran said targeted US assets.<br><strong>Why it matters:<\/strong> The posture shift after the 3 November midterms shapes oil prices, US troop risk and the odds of a preliminary deal.<br><strong>Sources:<\/strong> <a href=\"https://www.usnews.com/news/world/articles/2026-11-14/trump-tells-advisers-he-may-hold-off-on-iran-attacks-barring-new-provocations-sources-say\" target=\"_blank\" rel=\"noopener\">US News / Reuters<\/a>, <a href=\"https://www.washingtontimes.com/news/2026/nov/14/shifting-iran-rhetoric-trump-leaves-mideast-limbo-path-ahead/\" target=\"_blank\" rel=\"noopener\">Washington Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Democrats vow to block war funding in the year-end spending deal<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Senators Bennet, Sanders, Van Hollen and Duckworth say they will not accept a year-end spending deal that fails to restrict the Iran war. The deadline is 11 December. Trump has urged Senate leaders to move a $350 billion military reconciliation bill.<br><strong>Why it matters:<\/strong> It sets up a possible shutdown fight weeks after the record 43-day shutdown ended.<br><strong>Sources:<\/strong> <a href=\"https://en.yenisafak.com/world/us-senate-democrats-vow-to-block-funding-for-trumps-iran-war-3725516\" target=\"_blank\" rel=\"noopener\">Yeni Safak<\/a>, <a href=\"https://www.cbsnews.com/live-updates/us-iran-war-trump-nuclear-material-no-deal/\" target=\"_blank\" rel=\"noopener\">CBS News live updates<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Post-midterm landscape: Democrats take Senate control<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Republicans lost badly on 3 November. A summary of the results says Democrats gained control of the Senate, and Republicans also lost state attorney general races in key states. Inflation, tariffs, affordability and the Hormuz crisis weighed on voters.<br><strong>Why it matters:<\/strong> Divided power changes the outlook for nominations, oversight, tariffs and war powers from January.<br><strong>Sources:<\/strong> <a href=\"https://en.wikipedia.org/wiki/2026_United_States_elections\" target=\"_blank\" rel=\"noopener\">Wikipedia: 2026 US elections<\/a>, <a href=\"https://www.ajc.com/news/2026/11/the-latest-white-house-claims-criminality-in-democratic-oversight/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">White House and Democrats trade accusations over oversight<\/span><span class=\"cat\">Politics / Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The White House has claimed \"criminality\" in Democratic oversight efforts, and a federal judge temporarily barred the administration from breaking ground on one project. Reuters also reports a prosecutor who oversaw past Trump probes resigned (details unconfirmed).<br><strong>Why it matters:<\/strong> Court fights over executive power are likely to intensify under divided government.<br><strong>Sources:<\/strong> <a href=\"https://www.ajc.com/news/2026/11/the-latest-white-house-claims-criminality-in-democratic-oversight/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a>, <a href=\"https://www.devdiscourse.com/article/international/4003502-reuters-us-domestic-news-summary\" target=\"_blank\" rel=\"noopener\">Reuters via Devdiscourse<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Nvidia earnings headline a big market week<\/span><span class=\"cat\">Economy / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia reports fiscal Q3 results on 17 November after the close, after a weak week for chip shares. Home Depot and Disney report the same day, Target on 18 November and Walmart on 19 November. Futures edged higher on Sunday.<br><strong>Why it matters:<\/strong> Results from the biggest AI bellwether and the major retailers will set the tone for equities and the holiday-spending outlook.<br><strong>Sources:<\/strong> <a href=\"https://www.regardsofwallstreet.com/newsletter/2026-11-08-week-ahead\" target=\"_blank\" rel=\"noopener\">Regards of Wall Street<\/a>, <a href=\"https://www.cnbc.com/2026/11/15/stock-market-today-live-updates.html\" target=\"_blank\" rel=\"noopener\">CNBC<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Fed rate-hike fears under Chair Warsh<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Markets are pricing possible tightening, and some officials reportedly want at least two more 25-basis-point hikes. Chair Kevin Warsh speaks on Monday and FOMC minutes are due Wednesday. The Fed held its policy rate at 3.75%-4.00% on 28 October according to one newsletter (conflicting reports on the level: unconfirmed).<br><strong>Why it matters:<\/strong> A hiking cycle would hit equities, mortgages and borrowing costs just as inflation dominates politics.<br><strong>Sources:<\/strong> <a href=\"https://www.fxstreet.com/analysis/week-ahead-fed-minutes-inflation-data-and-nvidia-earnings-to-guide-investors-202611131033\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a>, <a href=\"https://www.regardsofwallstreet.com/newsletter/2026-11-08-week-ahead\" target=\"_blank\" rel=\"noopener\">Regards of Wall Street<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Delayed retail sales data lands this week<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The September retail sales report, pushed back by the 43-day federal shutdown, is due this week. The National Retail Federation projects holiday sales above $1 trillion, up 3.7% to 4.2%.<br><strong>Why it matters:<\/strong> It is a first clean read on consumer strength after the shutdown and the inflation squeeze.<br><strong>Sources:<\/strong> <a href=\"https://thriveinmarkets.com/calendar/2026-11-16/\" target=\"_blank\" rel=\"noopener\">Thrive in Markets calendar<\/a>, <a href=\"https://seekingalpha.com/article/4960711-wall-street-week-ahead\" target=\"_blank\" rel=\"noopener\">Seeking Alpha<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Anthropic set for Nasdaq debut<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic is reported to be set to list on Nasdaq on 19 November, according to market previews. I could not independently confirm the date outside those previews (unconfirmed).<br><strong>Why it matters:<\/strong> A large AI listing would test investor appetite for AI valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.tradingview.com/news/moodys:45cad514d6c8f:0-wall-street-week-ahead-nvidia-earnings-anthropic-ipo-federal-reserve-minutes-retail-sales-top-things-to-watch/\" target=\"_blank\" rel=\"noopener\">TradingView News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Air traffic control outage disrupts flights<\/span><span class=\"cat\">Society / Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> The FAA says its air traffic control system is stable after a nationwide outage, though thousands of flights were expected to be cancelled as airlines recover (single roundup: unconfirmed).<br><strong>Why it matters:<\/strong> It highlights fragile aviation infrastructure ahead of holiday travel.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Health: measles and Legionnaires'<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> The CDC counts 2,371 US measles cases in 2026, and New York City reported a seventh Legionnaires' death.<br><strong>Why it matters:<\/strong> Lower vaccination and strained local health systems keep outbreak risk elevated.<br><strong>Sources:<\/strong> <a href=\"https://www.cidrap.umn.edu/all-news?page=1\" target=\"_blank\" rel=\"noopener\">CIDRAP<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Last confirmed weekly closes (week to 6 Nov): S&amp;P 500 7,376.86, Nasdaq 24,579.42 - <a href=\"https://thriveinmarkets.com/market-insights/weekend-recap-2026-11-08/\" target=\"_blank\" rel=\"noopener\">Thrive in Markets<\/a><\/li><li>WTI about $90.83 (week to 6 Nov) - <a href=\"https://thriveinmarkets.com/market-insights/weekend-recap-2026-11-08/\" target=\"_blank\" rel=\"noopener\">Thrive in Markets<\/a><\/li><li>Latest Friday close and 10-year yield: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>17 Nov: Nvidia, Home Depot and Disney earnings; 18 Nov: FOMC minutes and Target.<\/li><li>19 Nov: Trump-Xi-Putin meeting expected in Shenzhen, Walmart earnings, possible Anthropic listing.<\/li><li>11 Dec: government funding deadline.<\/li><\/ul>"}, "asia": {"line": "Manila's ASEAN and Quad diplomacy leads into APEC in Shenzhen, with oil shortages from the Iran war and US-China rivalry setting the backdrop.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">ASEAN summit opens in Manila amid oil shortages<\/span><span class=\"cat\">Politics / Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> The ASEAN summit runs 15-17 November in the Philippines. Southeast Asia continues to bear the brunt of oil shortages from the Iran war, and ASEAN and China again failed to conclude a South China Sea code of conduct.<br><strong>Why it matters:<\/strong> Energy security and the maritime dispute are the region's most pressing shared risks.<br><strong>Sources:<\/strong> <a href=\"https://aljazeera.com/news/2026/11/15/asean-summit-whos-attending-and-whats-at-stake\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261116\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Possible Quad leaders' meeting in Manila<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Leaders of Australia, India, Japan and the US are expected to meet in Manila, the first Quad leaders' summit in over two years. As of 16 November, confirmation from all four governments had not been independently verified (unconfirmed).<br><strong>Why it matters:<\/strong> It would signal Indo-Pacific security coordination just before the Shenzhen summit.<br><strong>Sources:<\/strong> <a href=\"https://asiapacificsecuritymagazine.com/quad-leaders-expected-to-meet-in-manila-amid-push-for-indo-pacific-security-cooperation\" target=\"_blank\" rel=\"noopener\">Asia Pacific Security Magazine<\/a>, <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261116\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">APEC leaders gather in Shenzhen 18-19 November<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The APEC leaders' meeting is set for 18-19 November in Shenzhen. The White House says Trump, Putin and Xi will meet on 19 November on the sidelines, and Trump intends to raise Iran. The Kremlin earlier said the trilateral format was not final.<br><strong>Why it matters:<\/strong> A first three-way summit of the nuclear powers could touch Ukraine, arms control and trade.<br><strong>Sources:<\/strong> <a href=\"https://en.wikipedia.org/wiki/APEC_China_2026\" target=\"_blank\" rel=\"noopener\">Wikipedia: APEC China 2026<\/a>, <a href=\"https://www.washingtontimes.com/news/2026/nov/14/shifting-iran-rhetoric-trump-leaves-mideast-limbo-path-ahead/\" target=\"_blank\" rel=\"noopener\">Washington Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Trump to meet Marcos; Japan seeks Takaichi-Trump talks<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump is set to hold a one-on-one with Philippine President Marcos in Manila. Japan reportedly sought a Takaichi-Trump meeting next week, reportedly over US defence spending demands, and plans to propose APEC language on supply-chain transparency.<br><strong>Why it matters:<\/strong> Allies are being asked to pay more for security while China presses its regional case.<br><strong>Sources:<\/strong> <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261116\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a>, <a href=\"https://aljazeera.com/news/2026/11/15/asean-summit-whos-attending-and-whats-at-stake\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Philippines and Australia sign defence pact<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Australia and the Philippines signed a defence pact amid South China Sea tensions (single-source detail: unconfirmed).<br><strong>Why it matters:<\/strong> Deepens a US-aligned network on China's southern flank.<br><strong>Sources:<\/strong> <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261113\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a>, <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Taiwan: Chinese survey ships and a possible arms package<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Taiwan News reports Chinese oceanographic vessels may be supporting submarine operations with surveys east of Taiwan. Xi called for dialogue on Taiwan with \"people of vision\", and AP reported Trump was weighing a Taiwan arms package after the May Beijing summit.<br><strong>Why it matters:<\/strong> Mixed signals before the Shenzhen meetings raise the stakes for the Taiwan Strait.<br><strong>Sources:<\/strong> <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261113\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a>, <a href=\"https://www.wdrb.com/news/national/ap-news-summary-at-7-47-a-m-edt/article_3c73e91b-af04-5b6f-881b-05880343888c.html\" target=\"_blank\" rel=\"noopener\">AP via WDRB<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">ASEAN extends curbs on Myanmar's leadership<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> ASEAN leaders extended a ban on Myanmar's leader attending regional summits (single roundup: unconfirmed).<br><strong>Why it matters:<\/strong> The bloc keeps pressure on the junta without a breakthrough on the civil conflict.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Tokyo-Seoul security cooperation questions<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Analysts are asking whether South Korea's nuclear-submarine plans can survive a Democrat-led US Congress, as Japan and Korea continue defence exchanges.<br><strong>Why it matters:<\/strong> US political change after the midterms could alter alliance projects across Northeast Asia.<br><strong>Sources:<\/strong> <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261116\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Regional markets watch the Fed and Nvidia<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Asian traders are focused on Fed minutes, hike expectations and Nvidia's 17 November results. Hong Kong's Hang Seng fell 1.55% on Friday, with tech down about 3% (see Hong Kong edition).<br><strong>Why it matters:<\/strong> Tech-heavy Asian bourses are highly sensitive to the AI trade and US rates.<br><strong>Sources:<\/strong> <a href=\"https://www.newsquawk.com/headlines/newsquawk-daily-asia-pac-opening-news---11th-november-2026\" target=\"_blank\" rel=\"noopener\">Newsquawk<\/a>, <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Rubio: economic pressure on Iran working<\/span><span class=\"cat\">Security / Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Rubio said economic pressure was working so well that major combat operations were not needed, a line that matters to Asian importers hit by Hormuz disruption.<br><strong>Why it matters:<\/strong> De-escalation would ease the oil supply squeeze across Asia.<br><strong>Sources:<\/strong> <a href=\"https://pcisguam.substack.com/p/pacific-winds-20261116\" target=\"_blank\" rel=\"noopener\">Pacific Winds<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng closed 23,637.60 on 13 Nov, down 1.55% - <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/li><li>Nikkei, Shanghai, Kospi and USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>15-17 Nov: ASEAN summit in Manila; possible Quad meeting.<\/li><li>18-19 Nov: APEC in Shenzhen; possible Trump-Xi-Putin meeting.<\/li><li>Possible Takaichi-Trump talks on the sidelines.<\/li><\/ul>"}, "hk": {"line": "The Hang Seng ended a losing week on a tech sell-off as Hong Kong gets ready to host APEC delegates and a sold-out football night at Kai Tak.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hang Seng falls 1.55% to end a weak week<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed at 23,637.60 on Friday 13 November, down 370.95 points, after a 1.26% fall on Thursday. It lost about 844 points over the week and ended below its major moving averages. The tech index fell about 3% on Nvidia-related jitters.<br><strong>Why it matters:<\/strong> Hong Kong's tech-heavy market is exposed to the AI trade, with Nvidia reporting on 17 November.<br><strong>Sources:<\/strong> <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a>, <a href=\"https://tradingeconomics.com/hong-kong/stock-market\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Hong Kong economy grew 5.2% in Q3<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Reports say Hong Kong's economy expanded 5.2% year on year in the third quarter.<br><strong>Why it matters:<\/strong> Strong growth supports the case for resilience even as stocks wobble and US rates look set to rise.<br><strong>Sources:<\/strong> <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Hong Kong prepares to host APEC delegates<\/span><span class=\"cat\">Society / Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Hong Kong is preparing for delegates transiting to the APEC leaders' meeting in Shenzhen on 18-19 November, where a Trump-Xi-Putin meeting is expected.<br><strong>Why it matters:<\/strong> It brings extra security, traffic and business attention to the city next door to the summit.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348090/Night-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.thestandard.com.hk/world/article/341603/Kremlin-says-Putin-Xi-and-Trump-may-hold-a-trilateral-meeting-in-November\" target=\"_blank\" rel=\"noopener\">The Standard on the trilateral<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Fed hike fears weigh on the HKD peg outlook<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Markets price possible US tightening, with FOMC minutes due 18 November. Hong Kong rates follow US rates under the peg.<br><strong>Why it matters:<\/strong> Higher funding costs would hit mortgages, property and small businesses.<br><strong>Sources:<\/strong> <a href=\"https://www.fxstreet.com/analysis/week-ahead-fed-minutes-inflation-data-and-nvidia-earnings-to-guide-investors-202611131033\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Abby Choi murder trial continues<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> Testimony continues in the Abby Choi murder trial, including Anthony Kwong's accusation against a sibling.<br><strong>Why it matters:<\/strong> The case has drawn intense public attention and tests the court's handling of a high-profile trial.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">LegCo passes crypto tax-reporting law<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> LegCo passed a law requiring crypto holders to report for tax purposes (reported 4 November). A bill prioritising land development in the Northern Metropolis is also in the headlines (details unconfirmed).<br><strong>Why it matters:<\/strong> It aligns Hong Kong with global tax-transparency rules as it markets itself as a digital-asset hub.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347657/Night-Recap-November-5-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Hong Kong ranks 11th in global digital and AI index<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Hong Kong placed 11th in the World Digital and AI Ranking 2026. Cathay Pacific also ordered 14 more aircraft.<br><strong>Why it matters:<\/strong> Supports the government's innovation push and the airline's capacity plans.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Government water-contract fraud case<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> A Xin Ding Xin Trade director was held in custody after he and the company pleaded guilty to 11 charges, including fraud over a government bottled-water contract.<br><strong>Why it matters:<\/strong> It is a procurement-integrity case involving public money.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/347657/Night-Recap-November-5-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Autumn cold front and weather<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> A cold front dropped temperatures by about 9 degrees around 9 November, with autumn weather continuing (no forecast for 16 November retrieved).<br><strong>Why it matters:<\/strong> It affects commuters and seasonal health demand.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348005/Morning-Recap-November-10-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong v Singapore Asian Cup qualifier sells out<\/span><span class=\"cat\">Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Tickets for the 18 November qualifier at Kai Tak sold out within about 38 minutes of going on sale.<br><strong>Why it matters:<\/strong> It shows strong appetite for local football and tests Kai Tak's crowd management.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/hong-kong-news/article/316232/Hong-Kong-vs-Singapore-Asian-Cup-Qualifier-tickets-snapped-up-in-under-90-minutes\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,637.60 (13 Nov), down 1.55% - <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/li><li>Q3 GDP growth 5.2% year on year - <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/li><li>HIBOR, USD/HKD and today's weather: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>17 Nov: Nvidia earnings; 18 Nov: FOMC minutes.<\/li><li>18 Nov: Hong Kong v Singapore at Kai Tak.<\/li><li>18-19 Nov: APEC in Shenzhen and a possible Trump-Xi-Putin meeting.<\/li><\/ul>"}}}, {"date": "2026-11-15", "ed": {"world": {"line": "A tightening US blockade of Iran, a 5% US bond yield with a December Fed hike priced in, and Nvidia's CEO exit shook markets ahead of a Trump-Xi-Putin encounter in Shenzhen and Anthropic's record IPO.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US blockade of Iran tightens as Bahrain drone clash escalates tension<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US CENTCOM says the naval blockade has turned away nearly 150 ships. On 13 November Iran's IRGC claimed it destroyed a US radar in Bahrain; the US denies any radar was lost and says it shot down two drones. Qatar and Pakistan continue to mediate, but Washington has called Iran's latest truce terms \"outrageous\".<br><strong>Why it matters:<\/strong> The Gulf standoff keeps oil near $96 Brent and risks a return to open fighting in a region central to global energy supply.<br><strong>Sources:<\/strong> <a href=\"https://euronews.com/2026/11/13/irgc-says-it-destroyed-us-radar-in-bahrain-after-attack-on-southern-iran\" target=\"_blank\" rel=\"noopener\">Euronews<\/a>, <a href=\"https://www.cbsnews.com/live-updates/iran-war-us-trump-deal-negotiations/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://www.israelnationalnews.com/news/436040\" target=\"_blank\" rel=\"noopener\">Israel National News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US 10-year yield tops 5% as a December Fed hike is priced in<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> After hot inflation data, the 10-year Treasury yield touched 5% this week and was near 5.1% on Friday. Futures price a December Fed rate hike as fully expected, with Governor Waller reportedly open to 50 bp.<br><strong>Why it matters:<\/strong> Higher US rates lift borrowing costs worldwide, strengthen the dollar and pressure equities and emerging markets; Hong Kong's pegged currency follows US rates.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://www.freepressjournal.in/business/us-bond-yield-crosses-5-as-inflation-surges-december-fed-rate-hike-fears-rattle-global-markets\" target=\"_blank\" rel=\"noopener\">Free Press Journal<\/a>, <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns; Asian tech stocks tumble<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia told the SEC that Huang resigned as CEO and director effective immediately after a board investigation into an admitted affair; CFO Colette Kress is interim CEO. A HSBC downgrade extended losses on Friday, the Nasdaq 100 fell 1.2%, and the Hang Seng Tech Index dropped about 3%.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether and a huge index weight, so leadership turmoil moves the whole sector ahead of its earnings.<br><strong>Sources:<\/strong> <a href=\"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm\" target=\"_blank\" rel=\"noopener\">SEC 8-K<\/a>, <a href=\"https://scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://investinglive.com/stock-market-update/asian-stocks-steady-as-nikkei-gains-1-4-hang-seng-slips-on-nvidia-leadership-fallout\" target=\"_blank\" rel=\"noopener\">Investinglive<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Anthropic nears record AI IPO<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic filed its S-1 on 26 October to list on Nasdaq as \"ANT\". Reports say the offering could raise over $100 billion at a valuation possibly above $2 trillion. Pricing and first-trade date are not confirmed.<br><strong>Why it matters:<\/strong> It would be among the largest listings ever and a test of investor appetite for AI valuations amid the Nvidia shock.<br><strong>Sources:<\/strong> <a href=\"https://techcrunch.com/2026/10/26/anthropic-officially-files-for-its-public-debut/\" target=\"_blank\" rel=\"noopener\">TechCrunch<\/a>, <a href=\"https://www.renaissancecapital.com/IPO-Center/News/122417/ai-model-developer-anthropic-pbc-files-for-an-estimated-75-billion-ipo\" target=\"_blank\" rel=\"noopener\">Renaissance Capital<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Trump, Xi and Putin expected at APEC in Shenzhen<\/span><span class=\"cat\">Geopolitics / Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump says he expects to meet Xi and Putin at the APEC summit in Shenzhen (18-19 November), and the White House reportedly says trilateral talks are planned for next week. China has confirmed discussions but appears lukewarm, and the format (joint or separate meetings) is unclear.<br><strong>Why it matters:<\/strong> A first-ever three-way meeting of the nuclear superpowers, on Chinese soil next to Hong Kong, could shape arms control, Ukraine and trade.<br><strong>Sources:<\/strong> <a href=\"https://www.ewn.co.za/2026/11/09/trump-says-likely-to-meet-putin-xi-in-china\" target=\"_blank\" rel=\"noopener\">EWN<\/a>, <a href=\"https://www.aljazeera.com/amp/news/2026/11/6/what-a-trump-xi-putin-summit-would-mean-and-what-it-wouldnt\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.scmp.com/news/china/diplomacy/article/3373292/what-one-big-thing-could-stop-xi-putin-and-trump-meeting-apec\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Ukraine peace diplomacy: Europe seeks a seat, Donbas still the sticking point<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Europe is reportedly settling on a five-nation team for talks with Moscow, and the Kremlin says it is open to a European role (unconfirmed). Zelenskiy says Washington floated Ukraine ceding Donbas in exchange for NATO membership; Kyiv refuses to cede territory, and earlier US outlines offered EU membership and investment for dropping the NATO bid.<br><strong>Why it matters:<\/strong> The outcome decides Europe's security order and whether the war nears a settlement.<br><strong>Sources:<\/strong> <a href=\"https://meduza.io/en/feature/2026/10/23/the-u-s-proposes-a-demilitarized-zone-in-donbas-kyiv-refuses-to-surrender-territory-putin-insists-it-was-russia-s-all-along\" target=\"_blank\" rel=\"noopener\">Meduza<\/a>, <a href=\"https://kyivindependent.com/kremlin-signals-possible-three-way-meeting-at-apec-summit-between-putin-trump-xi/\" target=\"_blank\" rel=\"noopener\">Kyiv Independent<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this virus species and second-largest Ebola outbreak ever. It remains a WHO emergency; Kenya reported an imported case in October.<br><strong>Why it matters:<\/strong> Regional spread and a high fatality rate strain health systems and raise travel and containment concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">COP31 climate talks under way in Antalya without the US<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The summit opened on 9 November and runs to 20 November, hosted by Turkey. Finance is the central issue, amid a hot year with a strong El Nino. The US sent no delegation after leaving the Paris Agreement.<br><strong>Why it matters:<\/strong> Climate finance outcomes shape emissions paths and adaptation funding for vulnerable countries.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Hong Kong stocks slide 1.55% even as city lifts growth forecast to 4.8%<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng closed at 23,637.60, down 1.55%, and Shanghai fell to 3,634.35 on the tech sell-off. Separately, the Hong Kong government raised its 2026 GDP growth forecast to 4.8%, the best since 2021 per SCMP.<br><strong>Why it matters:<\/strong> Local growth is firming, but US rate rises and AI-stock volatility are headwinds for the HKD-pegged market.<br><strong>Sources:<\/strong> <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-1-55-percent-lower-at-23-637-60-as-tech-stocks-slide/70504434\" target=\"_blank\" rel=\"noopener\">Ad-hoc-news<\/a>, <a href=\"https://thestandard.com.hk/news/article/348454/Night-Recap-November-13-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Turkey and Qatar sign mutual defense pact<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> At their High Strategic Committee in Istanbul, Turkey and Qatar signed five agreements, including a mutual defense pact (unconfirmed, single aggregator report).<br><strong>Why it matters:<\/strong> It deepens a Gulf-Turkey security alignment while Qatar mediates the Iran standoff.<br><strong>Sources:<\/strong> <a href=\"https://aa.com.tr/en/world/morning-briefing-nov-14-2026/4124855\" target=\"_blank\" rel=\"noopener\">Anadolu morning briefing via search<\/a> (single source, unconfirmed)<\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,637.60 (-1.55%), Hang Seng Tech -3.02%: <a href=\"https://www.ad-hoc-news.de/boerse/news/marktberichte/hang-seng-closes-1-55-percent-lower-at-23-637-60-as-tech-stocks-slide/70504434\" target=\"_blank\" rel=\"noopener\">Ad-hoc-news<\/a><\/li><li>S&amp;P 500 7,561.67 (-0.40%), Dow 52,347.55 (+0.10%): <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>Brent $95.84, WTI $88.56: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>Bitcoin about $68,000, below $70,000 for the first time since August: <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/li><li>US 10-year yield about 5.1%: <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/li><li>USD/HKD: not confirmed in sources found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Possible Trump-Xi-Putin meeting at APEC, Shenzhen, 18-19 November.<\/li><li>Anthropic IPO pricing and first trade; Nvidia earnings and CEO search.<\/li><li>COP31 finance deal by 20 November; December Fed meeting; Iran-Gulf escalation or truce talks.<\/li><\/ul>"}, "us": {"line": "A nationwide air-traffic ground stop left thousands of flights cancelled, Trump signalled restraint on Iran, and Wall Street ended a winning week under a cloud over Nvidia's CEO.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Thousands of flights cancelled after longest nationwide ground stop in 25 years<\/span><span class=\"cat\">Transport / Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> The FAA ordered a nationwide ground stop on Friday afternoon with about 3,500 flights in the air, the longest in 25 years. On Saturday FlightAware counted more than 4,100 cancellations, while other outlets reported higher totals. Transportation Secretary Sean Duffy blamed a router at an FAA site in El Dorado, Arkansas, being replaced by contractor L3Harris; air traffic controllers dispute that explanation.<br><strong>Why it matters:<\/strong> FAA chief Bryan Bedford said there was \"zero evidence\" of anything nefarious, but a fragile system and days of recovery land just before Thanksgiving travel.<br><strong>Sources:<\/strong> <a href=\"https://www.cnbc.com/2026/11/14/faa-ground-stop-flights-resume-delays.html\" target=\"_blank\" rel=\"noopener\">CNBC<\/a>, <a href=\"https://www.cbsnews.com/news/faa-ground-stop-canceled-flights-travelers-what-we-know/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://www.commondreams.org/news/duffy-ground-stop-explanation\" target=\"_blank\" rel=\"noopener\">Common Dreams<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Trump tells advisers he may hold off on attacking Iran<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Trump has told senior advisers he may refrain from new strikes on Iran if there are no fresh provocations. Secretary of State Marco Rubio said earlier in the week that the naval blockade and economic pressure make major combat operations unnecessary for now. Defense Secretary Pete Hegseth said kinetic strikes around the Strait of Hormuz are not ruled out.<br><strong>Why it matters:<\/strong> The posture shapes oil prices, US troop risk and the prospects for a negotiated settlement after the midterms.<br><strong>Sources:<\/strong> <a href=\"https://jewishinsider.com/2026/11/marco-rubio-iran-military-operations-unnecessary-negotiations/\" target=\"_blank\" rel=\"noopener\">Jewish Insider<\/a>, <a href=\"https://i24news.tv/en/news/international/americas/artc-us-has-no-immediate-plans-for-new-strikes-on-iran-report\" target=\"_blank\" rel=\"noopener\">i24NEWS<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Wall Street ends a winning week despite Friday slide<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Friday 13 November the S&amp;P 500 fell 0.4% to 7,561.67 and the Nasdaq fell 0.9% to 25,136.27, while the Dow edged up 0.1% to 52,347.55. For the week the S&amp;P gained 2.5%, its first winning week since October and best since August. Technology led the decline, with Nvidia sliding again a day after Jensen Huang's resignation.<br><strong>Why it matters:<\/strong> The rebound sets up a heavy week of Nvidia earnings, retail results and Fed commentary.<br><strong>Sources:<\/strong> <a href=\"https://wtop.com/national/2026/11/how-major-us-stock-indexes-fared-friday-11-13-2026/\" target=\"_blank\" rel=\"noopener\">How major US stock indexes fared (AP via WTOP)<\/a>, <a href=\"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-futures-tick-133734502.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Nvidia hunts for a CEO after Jensen Huang resigns amid scandal<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Huang resigned as president, CEO and board member effective immediately on 12 November, after a board probe into reported ties to an alleged Chinese intelligence operative and his admission of an affair. CFO Colette Kress is interim CEO, and the Financial Times reports the board has approached Arm CEO Rene Haas. Some staff are reportedly calling for his return, and Trump has suggested Apple's Tim Cook as a replacement.<br><strong>Why it matters:<\/strong> The world's most valuable AI chip company is leaderless days before its 17 November earnings report, and shares have been under heavy pressure.<br><strong>Sources:<\/strong> <a href=\"https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html\" target=\"_blank\" rel=\"noopener\">CNBC live updates<\/a>, <a href=\"https://www.aljazeera.com/news/2026/11/12/why-did-nvidia-ceo-jensen-huang-resign-and-who-is-colette-kress\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm\" target=\"_blank\" rel=\"noopener\">SEC 8-K<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Alaska Senate race still uncalled, Peltola ahead<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrat Mary Peltola led Republican Sen. Dan Sullivan by about 5,800 votes in the latest reports, and the race is uncalled. The official ranked-choice tabulation is set for 18 November after absentee ballots arrive. A second candidate named Dan Sullivan on the ballot adds confusion.<br><strong>Why it matters:<\/strong> One seat can decide how large Democrats' new Senate majority is.<br><strong>Sources:<\/strong> <a href=\"https://alaskabeacon.com/?p=30734\" target=\"_blank\" rel=\"noopener\">Alaska Beacon<\/a>, <a href=\"https://www.alaskasnewssource.com/2026/11/06/peltola-sullivan-campaigns-project-wins-while-quarter-ballots-are-outstanding/\" target=\"_blank\" rel=\"noopener\">Alaska's News Source<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">US reportedly loses measles elimination status [Health] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> One news roundup says health officials confirmed the US has lost its 26-year measles elimination status, with a 2026 toll of 10 deaths and more than 5,400 confirmed cases. I could not corroborate these figures in a second source, and other CDC counts cited this month are lower.<br><strong>Why it matters:<\/strong> Losing the status signals sustained transmission and lower vaccination, and it raises outbreak risk heading into winter gatherings.<br><strong>Sources:<\/strong> <a href=\"https://ru4people.substack.com/p/morning-news-update-november-14-2026\" target=\"_blank\" rel=\"noopener\">Morning News Update, 14 Nov<\/a>, <a href=\"https://kffhealthnews.org/public-health/measles-free-status-us-cdc-ralph-abraham-paho-who-outbreaks-vaccines/\" target=\"_blank\" rel=\"noopener\">KFF Health News (background)<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Trump administration rolls back Head Start wage and benefit rules [Policy] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A morning roundup reports the administration is rolling back Head Start staff wage and benefit requirements. HHS proposed the change in May, calling the 2024 standards costly and overly prescriptive; the wage rules alone were estimated at about $1.2 billion at full implementation.<br><strong>Why it matters:<\/strong> Supporters cite flexibility, while critics warn it will worsen workforce shortages in the early-childhood program.<br><strong>Sources:<\/strong> <a href=\"https://ru4people.substack.com/p/morning-news-update-november-14-2026\" target=\"_blank\" rel=\"noopener\">Morning News Update, 14 Nov<\/a>, <a href=\"https://policyrisk.com/federal-register/2026-09383\" target=\"_blank\" rel=\"noopener\">Policy Risk<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Tanker strikes docked paddlewheeler in New Orleans [Disaster] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> A morning roundup reports a tanker struck a docked paddlewheel vessel in New Orleans, injuring more than 30 people with no fatalities reported. I could not find independent coverage with further detail.<br><strong>Why it matters:<\/strong> The incident adds to scrutiny of busy Mississippi River traffic near tourist waterfront attractions.<br><strong>Sources:<\/strong> <a href=\"https://ru4people.substack.com/p/morning-news-update-november-14-2026\" target=\"_blank\" rel=\"noopener\">Morning News Update, 14 Nov<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Trump, Xi and Putin meeting planned on APEC sidelines<\/span><span class=\"cat\">Politics / Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> A planned joint meeting of the US, Chinese and Russian leaders on the sidelines of the APEC summit was among the day's leading items in AP's roundup. Details of the agenda were not available in my sources.<br><strong>Why it matters:<\/strong> A three-way summit would touch trade, Iran and Ukraine and the stalled tariff truce.<br><strong>Sources:<\/strong> <a href=\"https://www.nxplace.com/post/world-news-november-14-2026-morning-edition-794661323445\" target=\"_blank\" rel=\"noopener\">NXPlace world news roundup<\/a>, <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-15-2026/4125489\" target=\"_blank\" rel=\"noopener\">Anadolu Agency<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Rock and Roll Hall of Fame inducts Class of 2026 in Los Angeles<\/span><span class=\"cat\">Culture<\/span><\/h2>\n<p><strong>What happened:<\/strong> The ceremony was taped on Saturday at the Peacock Theater. Inductees include Oasis, Phil Collins, Billy Idol, Iron Maiden, Sade, Joy Division/New Order, Wu-Tang Clan and Luther Vandross. It airs in December on ABC and Disney+.<br><strong>Why it matters:<\/strong> One of the year's biggest music events, featuring several first-time nominees.<br><strong>Sources:<\/strong> <a href=\"https://rockhall.com/press-release/the-rock-roll-hall-of-fame-reveals-2026-inductees/\" target=\"_blank\" rel=\"noopener\">Rock Hall<\/a>, <a href=\"https://abc7.com/18882559/\" target=\"_blank\" rel=\"noopener\">ABC7<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Friday 13 Nov close): 7,561.67 - <a href=\"https://wtop.com/national/2026/11/how-major-us-stock-indexes-fared-friday-11-13-2026/\" target=\"_blank\" rel=\"noopener\">AP via WTOP<\/a><\/li><li>Nasdaq Composite: 25,136.27 - <a href=\"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-futures-tick-133734502.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance<\/a><\/li><li>10-year Treasury yield: no reliable Friday close found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>17 Nov: Nvidia reports earnings with an interim CEO and an open search for a permanent one.<\/li><li>18 Nov: Alaska's ranked-choice tabulation decides the Peltola-Sullivan Senate race.<\/li><li>Airlines' recovery from the ground stop ahead of Thanksgiving travel.<\/li><\/ul>"}, "asia": {"line": "A planned Trump-Xi-Putin meeting in Shenzhen and the ASEAN gathering in Manila frame the week, while Nvidia's leadership shock and a fragile US-China truce keep Asian tech nervous.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump, Xi and Putin set for rare three-way meeting in Shenzhen<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The White House said President Trump will hold a three-way meeting with Xi Jinping and Vladimir Putin in Shenzhen on the sidelines of the APEC summit next week. A US official said Iran will be on the agenda, while Ukraine is not expected to come up.<br><strong>Why it matters:<\/strong> It would be the first such trilateral among the three nuclear powers and could shape arms control, energy and trade talks across Asia.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-14-2026/4124855\" target=\"_blank\" rel=\"noopener\">Anadolu Agency morning briefing<\/a>, <a href=\"https://en.wikipedia.org/wiki/Portal:Current_events/2026_November_14\" target=\"_blank\" rel=\"noopener\">Wikipedia: Current events 14 November 2026<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">ASEAN leaders gather in the Philippines for the 49th summit<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Leaders and delegations converged on Manila for the 49th ASEAN Summit and related meetings, with live coverage of arrivals and sideline talks on 14 November. The agenda is dominated by regional energy supply, the South China Sea and Myanmar.<br><strong>Why it matters:<\/strong> The bloc is trying to show unity while members face fuel shortages and pressure from both Washington and Beijing.<br><strong>Sources:<\/strong> <a href=\"https://www.inquirer.net/495619/live-updates-asean-summit-2026-and-related-meetings-nov-14-2026/\" target=\"_blank\" rel=\"noopener\">Philippine Daily Inquirer live updates<\/a>, <a href=\"https://www.aljazeera.com/asia/\" target=\"_blank\" rel=\"noopener\">Al Jazeera Asia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Philippines and Canada conclude free-trade negotiations<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Canadian Prime Minister Mark Carney announced that negotiations for a free-trade agreement with the Philippines have concluded, with signing expected in 2027. The announcement came during the ASEAN meetings in Manila.<br><strong>Why it matters:<\/strong> It adds another Western trade link for Manila as Southeast Asian states diversify away from tariff-exposed US and China trade.<br><strong>Sources:<\/strong> <a href=\"https://en.wikipedia.org/wiki/Portal:Current_events/2026_November_14\" target=\"_blank\" rel=\"noopener\">Wikipedia: Current events 14 November 2026<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">China rejects US Nvidia spy claims as trade truce called fragile<\/span><span class=\"cat\">Politics / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> China said Washington was \"fabricating\" espionage claims tied to an Nvidia executive to justify a tech \"blockade\". Analysts quoted by regional media described the trade truce reached after the Xi-Trump summit as still fragile.<br><strong>Why it matters:<\/strong> Chip export controls are a central test for the truce just before the Shenzhen summit.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/china\" target=\"_blank\" rel=\"noopener\">South China Morning Post China section<\/a>, <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Nvidia CEO exit rattles Asian chip stocks<\/span><span class=\"cat\">Economy / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Asian shares were mixed to lower on Friday after Jensen Huang's exit as Nvidia CEO, with SK Hynix down about 3% and the Kospi off about 1% in AP's report. Nvidia fell more than 4% on Wall Street, and analysts linked worries to possible tighter US chip export rules.<br><strong>Why it matters:<\/strong> Korea, Taiwan and Japan are the core of the AI hardware supply chain, so Nvidia's leadership uncertainty feeds straight into their index levels.<br><strong>Sources:<\/strong> <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a>, <a href=\"https://investinglive.com/stock-market-update/asian-stocks-steady-as-nikkei-gains-1-4-hang-seng-slips-on-nvidia-leadership-fallout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">COMAC's CE-25A electric aircraft completes first piloted flight<\/span><span class=\"cat\">Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> COMAC's CE-25A, described as China's first domestically developed fixed-wing electric commercial aircraft, completed its first piloted test flight in Binzhou, Shandong, on 14 November. Separately, China released a plan to accelerate new energy storage during the 2026-2030 Five-Year Plan period.<br><strong>Why it matters:<\/strong> It is a symbolic step in China's push into low-altitude and electric aviation and in domestic industrial self-reliance.<br><strong>Sources:<\/strong> <a href=\"https://www.aerotime.aero/articles/chinas-comac-completes-first-piloted-flight-of-ce-25a-electric-aircraft\" target=\"_blank\" rel=\"noopener\">AeroTime<\/a>, <a href=\"https://www.scmp.com/news/china\" target=\"_blank\" rel=\"noopener\">South China Morning Post China section<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Umno sweeps Melaka state election<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Malaysia's Umno reportedly won 24 of 28 seats in the Melaka state election (single-source roundup: unconfirmed). The same roundup said former prime minister Najib Razak, under house arrest since 11 November, was reported at Friday prayers at Kajang Prison.<br><strong>Why it matters:<\/strong> A strong state result strengthens Umno's hand within the national unity coalition and fuels talk of early elections.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-14-2026/4124855\" target=\"_blank\" rel=\"noopener\">Anadolu Agency morning briefing<\/a>, <a href=\"https://en.wikipedia.org/wiki/Portal:Current_events/2026_November_14\" target=\"_blank\" rel=\"noopener\">Wikipedia: Current events 14 November 2026<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Philippines wins first Eurovision Song Contest Asia in Bangkok<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Philippines won the inaugural Eurovision Song Contest Asia held in Bangkok, with \"Sobra-Sobra\" performed by Carmelle.<br><strong>Why it matters:<\/strong> The launch of a pan-Asian contest is a major cultural-broadcast event, and the win comes as Manila hosts regional leaders.<br><strong>Sources:<\/strong> <a href=\"https://en.wikipedia.org/wiki/Eurovision_Song_Contest_Asia\" target=\"_blank\" rel=\"noopener\">Wikipedia: Eurovision Song Contest Asia<\/a>, <a href=\"https://en.wikipedia.org/wiki/Portal:Current_events/2026_November_14\" target=\"_blank\" rel=\"noopener\">Wikipedia: Current events 14 November 2026<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Bangladesh garment wage protests shut dozens of factories<\/span><span class=\"cat\">Society / Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Wage protests by garment workers forced the shutdown of 55 units and halted production at 147 others, and employers threatened indefinite closures (single-source roundup: unconfirmed).<br><strong>Why it matters:<\/strong> Bangladesh's export economy depends on garments, and prolonged stoppages would hit global brands and fragile state finances.<br><strong>Sources:<\/strong> <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-14-2026/4124855\" target=\"_blank\" rel=\"noopener\">Anadolu Agency morning briefing<\/a>, <a href=\"https://www.aljazeera.com/asia/\" target=\"_blank\" rel=\"noopener\">Al Jazeera Asia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Japan beat Brazil 3-2; South Korea lose to Saudi Arabia<\/span><span class=\"cat\">Sports<\/span><\/h2>\n<p><strong>What happened:<\/strong> In friendlies on 14 November, Japan beat Brazil 3-2 in Singapore, and South Korea, ranked 32nd, lost 3-2 to 55th-ranked Saudi Arabia. In cricket, New Zealand beat India by 244 runs in the fourth of five matches, leaving the series at 2-1 to India.<br><strong>Why it matters:<\/strong> The results give Japan a high-profile win over a top-ranked side and raise questions in Seoul, while the cricket series heads to a decider.<br><strong>Sources:<\/strong> <a href=\"https://en.sedaily.com/sports/2026/11/15/japan-beats-brazil-3-2-as-korea-falls-to-saudi-arabia\" target=\"_blank\" rel=\"noopener\">Seoul Economic Daily<\/a>, <a href=\"https://www.aa.com.tr/en/world/morning-briefing-nov-14-2026/4124855\" target=\"_blank\" rel=\"noopener\">Anadolu Agency morning briefing<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Nikkei 225: about 61,142 on 13 Nov (up 0.5% in AP's report, intraday) - <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a><\/li><li>Shanghai Composite: about 3,634 (down 0.6%, AP, intraday) - <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a><\/li><li>Kospi: about 5,290 (down 1%, AP, intraday) - <a href=\"https://investinglive.com/stock-market-update/asian-stocks-steady-as-nikkei-gains-1-4-hang-seng-slips-on-nvidia-leadership-fallout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/li><li>USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>15-17 Nov: ASEAN summit sessions in Manila and possible sideline meetings.<\/li><li>18-19 Nov: APEC in Shenzhen, with the Trump-Xi-Putin meeting.<\/li><li>Fallout from Nvidia's leadership change on chip export policy and Asian tech stocks.<\/li><\/ul>"}, "hk": {"line": "A theft of Disneyland ticket data, a coming police AI facial-recognition roll-out and a rail operator's cash warning lead a quiet weekend, after the Hang Seng ended a losing week.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hong Kong Disneyland suspends online sales after 17,000 ticket QR codes stolen<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Hong Kong Disneyland halted online ticket sales and hotel bookings after about 17,000 ticket QR codes were reported stolen (unconfirmed, single source summary).<br><strong>Why it matters:<\/strong> It is a data-security and consumer-protection test for one of the city's biggest tourist attractions.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Police to switch on AI facial recognition across SmartView network on Monday<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> The police chief said an AI roll-out across the expanding SmartView surveillance network would begin on Monday, and could help identify masked suspects and deter crime.<br><strong>Why it matters:<\/strong> It raises privacy and oversight questions alongside the policing benefits.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Rail operator warns of cash crunch despite Northern Metropolis land grant<\/span><span class=\"cat\">Economy / Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The city's rail operator warned of a cash shortfall even after receiving a land grant in the Northern Metropolis.<br><strong>Why it matters:<\/strong> Funding for new rail lines underpins the Northern Metropolis plan and future fares.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Hang Seng closes the week at 23,637.60<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed Friday 13 November at 23,637.60, down 1.55%, as the tech index fell about 3% on Nvidia-related worries. It lost about 844 points over the week.<br><strong>Why it matters:<\/strong> The tech-heavy market faces Nvidia earnings on 17 November and US rate worries.<br><strong>Sources:<\/strong> <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">All five defendants in San Po Kong
