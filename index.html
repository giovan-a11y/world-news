 subversion case intend to plead guilty<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The court heard that all five defendants in the San Po Kong subversion case intend to plead guilty.<br><strong>Why it matters:<\/strong> It points to a quick end to a national-security case and to sentencing ahead.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Northern Metropolis logistics cluster draws 16 expressions of interest<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Authorities said on Friday 13 November that 16 submissions came from developers, logistics operators, industry associations and professional services providers. They were not named.<br><strong>Why it matters:<\/strong> It is an early measure of market appetite for the Northern Metropolis plan.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Migrant worker activists push back on visa rejections over \"job-hopping\"<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Activists criticised visa rejections linked to what authorities describe as job-hopping.<br><strong>Why it matters:<\/strong> It bears on the position of the city's large domestic and migrant workforce.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Trump, Xi and Putin expected to meet in China<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The White House said a historic Trump-Xi-Putin meeting would be held in China, around the APEC leaders' meeting in Shenzhen on 18-19 November.<br><strong>Why it matters:<\/strong> It brings security, traffic and business attention to Hong Kong, next to the summit.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a>, <a href=\"https://en.wikipedia.org/wiki/APEC_China_2026\" target=\"_blank\" rel=\"noopener\">APEC China 2026<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Weekend events and racing<\/span><span class=\"cat\">Culture / Sport<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Shi Fu Miz open-air electronic music festival ran on Saturday at Tai Tong Organic Ecopark in Yuen Long. Sha Tin held a full racing card.<br><strong>Why it matters:<\/strong> Light weekend fare after a heavy news week.<br><strong>Sources:<\/strong> <a href=\"https://www.sassyhongkong.com/hong-kong-events-weekend-activities-things-to-do-whats-on/\" target=\"_blank\" rel=\"noopener\">Sassy Hong Kong<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Abby Choi murder trial in its sixth week<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The trial continued into mid-November, with Anthony Kwong accusing his brother Alex Kwong in testimony earlier in the week and one juror discharged, leaving eight.<br><strong>Why it matters:<\/strong> The case keeps drawing intense public attention.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,637.60 (13 Nov), down 1.55% - <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/li><li>HIBOR, USD/HKD and weather: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>16 Nov: police AI facial recognition begins.<\/li><li>17 Nov: Nvidia earnings; 18 Nov: FOMC minutes.<\/li><li>18-19 Nov: APEC in Shenzhen.<\/li><\/ul>"}}}, {"date": "2026-11-14", "ed": {"world": {"line": "A tightening US blockade of Iran, a bond sell-off pushing the 10-year yield to 5%, and a shock CEO exit at Nvidia dominate a week in which markets also await Anthropic's record IPO.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">US naval blockade of Iran tightens as drone clash hits Bahrain<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US CENTCOM says the blockade has turned away nearly 150 ships, and a new \"Task Force Iron Gate\" targets Iran's land and Caspian routes, though Iraq, Turkey and Pakistan are resisting. On 13 November Iran's IRGC claimed it destroyed a US radar in Bahrain; the US says it shot down two attack drones and denies any radar was lost. Qatar and Pakistan are still mediating, but Rubio called Iran's latest truce terms \"outrageous\".<br><strong>Why it matters:<\/strong> The Gulf standoff keeps oil prices elevated and risks a return to open fighting in a region carrying a large share of global energy supply.<br><strong>Sources:<\/strong> <a href=\"https://www.israelnationalnews.com/news/436040\" target=\"_blank\" rel=\"noopener\">Israel National News<\/a>, <a href=\"https://euronews.com/2026/11/13/irgc-says-it-destroyed-us-radar-in-bahrain-after-attack-on-southern-iran\" target=\"_blank\" rel=\"noopener\">Euronews<\/a>, <a href=\"https://www.cbsnews.com/live-updates/iran-war-us-trump-deal-negotiations/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">US 10-year yield tops 5% as a December Fed hike is priced in<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> After hot inflation data, the 10-year Treasury yield touched 5% this week and was around 5.1% on Friday; wholesale inflation is at a near four-year high annually. Futures price a December Fed hike as fully expected, with Governor Waller reportedly open to a 50 bp move.<br><strong>Why it matters:<\/strong> Higher US rates raise borrowing costs worldwide, strengthen the dollar, and pressure equities, emerging markets and Hong Kong, whose currency is pegged to the US dollar.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://www.freepressjournal.in/business/us-bond-yield-crosses-5-as-inflation-surges-december-fed-rate-hike-fears-rattle-global-markets\" target=\"_blank\" rel=\"noopener\">Free Press Journal<\/a>, <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns amid board investigation<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia told the SEC that Huang resigned as CEO and director effective immediately, with CFO Colette Kress as interim CEO. The board had opened an investigation after Huang admitted an affair; some reports mention alleged intelligence-linked contact, which the board said it had no reason to think compromised secrets (unconfirmed). Shares closed about 13% below their 6 November level.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether and a very large weight in US indexes, so leadership turmoil moves the whole tech sector. Earnings are due soon.<br><strong>Sources:<\/strong> <a href=\"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm\" target=\"_blank\" rel=\"noopener\">SEC 8-K<\/a>, <a href=\"https://scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Anthropic nears record AI IPO<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic filed its S-1 on 26 October to list on Nasdaq as \"ANT\". Reports say the offering could raise over $100 billion at a valuation possibly above $2 trillion; the filing shows $33.2 billion revenue for nine months to September. Pricing and first-trade date (between 16 November and Thanksgiving) are not confirmed.<br><strong>Why it matters:<\/strong> It would be among the largest listings ever and a test of investor appetite for AI valuations amid the Nvidia shock.<br><strong>Sources:<\/strong> <a href=\"https://techcrunch.com/2026/10/26/anthropic-officially-files-for-its-public-debut/\" target=\"_blank\" rel=\"noopener\">TechCrunch<\/a>, <a href=\"https://www.renaissancecapital.com/IPO-Center/News/122417/ai-model-developer-anthropic-pbc-files-for-an-estimated-75-billion-ipo\" target=\"_blank\" rel=\"noopener\">Renaissance Capital<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this virus species and second-largest Ebola outbreak ever. It remains a WHO emergency; Kenya reported an imported case on 6 October, while Uganda's outbreak was declared over in August.<br><strong>Why it matters:<\/strong> Regional spread and a high fatality rate strain health systems and raise travel and containment concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">COP31 climate talks under way in Antalya without the US<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> The summit opened on 9 November and runs to 20 November, with Turkey hosting and Australia leading negotiations. Finance is the central issue, amid a hot year with an exceptionally strong El Nino. The Trump administration sent no delegation after leaving the Paris Agreement.<br><strong>Why it matters:<\/strong> Climate finance outcomes shape emissions paths and adaptation funding for vulnerable countries, now without US participation.<br><strong>Sources:<\/strong> <a href=\"https://www.khaleejtimes.com/cop31-opens-leaders-pressure-tackle-climate-crisis\" target=\"_blank\" rel=\"noopener\">Khaleej Times<\/a>, <a href=\"https://balkangreenenergynews.com/cop31-opens-amid-warnings-that-2026-will-be-among-hottest-years-on-record/\" target=\"_blank\" rel=\"noopener\">Balkan Green Energy News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Russia and Ukraine agree prisoner swap after Abu Dhabi talks<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The two sides agreed to a large prisoner exchange after US-mediated talks in Abu Dhabi. Ukraine also opened a case over Russia's recruitment of foreign nationals, including from Bangladesh, who say they were sent to combat.<br><strong>Why it matters:<\/strong> Humanitarian exchanges are a rare sign of channel-keeping, though no ceasefire has been reported.<br><strong>Sources:<\/strong> <a href=\"https://rightsinrussia.substack.com/p/news-of-the-week-012\" target=\"_blank\" rel=\"noopener\">Rights in Russia weekly<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Hong Kong raises 2026 growth forecast to 4.8%<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The government lifted its full-year real GDP forecast to 4.8%, citing strong Q4 momentum; SCMP calls it the best growth since 2021, with external uncertainty remaining.<br><strong>Why it matters:<\/strong> It signals a firmer local recovery, though US rate rises and a strong dollar are headwinds for the HKD-pegged economy.<br><strong>Sources:<\/strong> <a href=\"https://thestandard.com.hk/news/article/348454/Night-Recap-November-13-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Oil caught between blockade and forecast surplus<\/span><span class=\"cat\">Energy<\/span><\/h2>\n<p><strong>What happened:<\/strong> WTI settled near $88.56 and Brent about $95.84. Traders weigh the Iran blockade against a forecast global surplus and rising US inventories.<br><strong>Why it matters:<\/strong> Energy prices feed directly into the inflation that is driving the rate-hike path.<br><strong>Sources:<\/strong> <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a>, <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Dollar near 19-month high, gold and Bitcoin slide<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The dollar hit about 19-month highs while gold fell roughly 2.5% and Bitcoin dropped to its lowest since August.<br><strong>Why it matters:<\/strong> Tightening financial conditions are hitting traditional and speculative havens alike.<br><strong>Sources:<\/strong> <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a>, <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,561.67 (-0.40%), Dow 52,347.55 (+0.10%), Nasdaq -0.91% on 13 Nov: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>WTI $88.56, Brent $95.84: <a href=\"https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-nov-13-2026\" target=\"_blank\" rel=\"noopener\">TheStreet<\/a><\/li><li>US 10-year yield about 5.1%: <a href=\"https://www.riotimesonline.com/global-economy-briefing-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Rio Times<\/a><\/li><li>Bitcoin at lowest since August (no level confirmed): <a href=\"https://eurasiabusinessnews.com/2026/11/14/stock-market-today-november-13-2026-tech-stocks-fall-as-nvidia-earnings-and-anthropic-ipo-loom/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a><\/li><li>USD/HKD and Hang Seng: not confirmed in sources found.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Anthropic IPO pricing and first trade, possibly from 16 November.<\/li><li>Nvidia earnings and further news on its CEO search.<\/li><li>COP31 finance negotiations through 20 November; December Fed meeting and Iran-Gulf escalation or truce talks.<\/li><\/ul>"}, "us": {"line": "A nationwide FAA ground stop grounded flights across the country, Nvidia's CEO quit amid scandal, and Senate Democrats opened a fight over their own leadership.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">FAA halts all US flights in longest nationwide ground stop in 25 years<\/span><span class=\"cat\">Transport / Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> The FAA ordered a nationwide ground stop at 3:36 p.m. ET Friday with about 3,500 flights airborne, blaming a communications outage. Flights resumed that evening after hours, but more than 2,000 Saturday flights were already cancelled per FlightAware. Homeland Security Secretary Markwayne Mullin said there was no sign of a national security threat but would not rule out any cause, including a cyberattack.<br><strong>Why it matters:<\/strong> A near-total halt to US aviation just before Thanksgiving travel raises fresh questions about the resilience of air traffic control systems.<br><strong>Sources:<\/strong> <a href=\"https://www.cnn.com/2026/11/13/us/live-news/flights-ground-stop-faa\" target=\"_blank\" rel=\"noopener\">CNN live<\/a>, <a href=\"https://www.cbsnews.com/news/faa-ground-stop-canceled-flights-travelers-what-we-know/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://www.cnbc.com/2026/11/14/faa-ground-stop-flights-resume-delays.html\" target=\"_blank\" rel=\"noopener\">CNBC<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns, CFO Colette Kress named interim chief<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia said Huang resigned as president, CEO and director effective immediately, days after a board investigation opened into reported ties to an alleged Chinese intelligence operative and his admission of an affair. Kress will serve as interim CEO while remaining CFO, and Harvey C. Jones becomes the first board chair. Trump suggested Apple's Tim Cook as a successor on social media.<br><strong>Why it matters:<\/strong> The exit of the AI boom's most prominent executive unsettled markets and raises questions over US chip policy.<br><strong>Sources:<\/strong> <a href=\"https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html\" target=\"_blank\" rel=\"noopener\">CNBC live updates<\/a>, <a href=\"https://www.aljazeera.com/news/2026/11/12/why-did-nvidia-ceo-jensen-huang-resign-and-who-is-colette-kress\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Stocks dip on Friday but major indexes post weekly gains<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The S&amp;P 500 fell 0.4% to 7,561.67 and the Nasdaq fell 0.9% to 25,136.27, with Nvidia and other tech names sinking, while the Dow edged up to 52,347.55. For the week the S&amp;P rose 2.5%, its first weekly gain since October, the Dow gained 2.1% and the Nasdaq 2.3%.<br><strong>Why it matters:<\/strong> A shaky finish to a rebound week leaves investors waiting on Nvidia earnings and inflation-driven Fed signals.<br><strong>Sources:<\/strong> <a href=\"https://wtop.com/national/2026/11/how-major-us-stock-indexes-fared-friday-11-13-2026/\" target=\"_blank\" rel=\"noopener\">How major US stock indexes fared (AP via WTOP)<\/a>, <a href=\"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-futures-tick-133734502.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">US downs Iranian drones as Iran claims strike on US radar in Bahrain<\/span><span class=\"cat\">Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The US military said it shot down two Iranian attack drones, while Iran claimed it struck a US radar in Bahrain. Treasury Secretary Scott Bessent said he would not be intimidated by Iranian threats against his life.<br><strong>Why it matters:<\/strong> The exchange tests Trump's reported willingness to hold off on new strikes while the naval blockade continues.<br><strong>Sources:<\/strong> <a href=\"https://www.yahoo.com/news/videos/ap-top-stories-november-13-113020882.html\" target=\"_blank\" rel=\"noopener\">AP News summary<\/a>, <a href=\"https://www.timesofisrael.com/liveblog-november-13-2026/\" target=\"_blank\" rel=\"noopener\">Times of Israel liveblog<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Senate Democrats grow their majority, then face a leadership fight<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrat Scott Colom's Mississippi win, as reported by Democracy Now, lifts Democrats' Senate majority to 55 and makes him the state's first Black senator since Reconstruction. Sen. Chris Van Hollen said he will challenge Chuck Schumer for Senate leader, and activists staged a sit-in in Schumer's office in which more than 50 were reportedly arrested.<br><strong>Why it matters:<\/strong> Democrats enter the new Congress with a larger Senate majority but divided over who leads it and whether to end the filibuster.<br><strong>Sources:<\/strong> <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now headlines<\/a>, <a href=\"https://www.democracynow.org/2026/11/12/scott_colom_victory_speech\" target=\"_blank\" rel=\"noopener\">Democracy Now: Colom<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Brooklyn building collapse prompts citywide inspections<\/span><span class=\"cat\">Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> A partial collapse of a three-story building at the edge of a construction site at 2625 Bedford Avenue in Flatbush on Wednesday killed at least one person and trapped others. NYC Mayor Zohran Mamdani ordered inspections at 100 sites.<br><strong>Why it matters:<\/strong> The crackdown puts construction-site safety and demolition oversight in the spotlight.<br><strong>Sources:<\/strong> <a href=\"https://www.fox9.com/news/brooklyn-building-collapse-fire-crews-work-rescue-multiple-people-trapped\" target=\"_blank\" rel=\"noopener\">Fox 9 / Fox News<\/a>, <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now headlines<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Microsoft outage disrupts communications in dozens of countries<\/span><span class=\"cat\">Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> A Microsoft outage disrupted services for companies and governments worldwide, with Democracy Now putting the reach at 74 countries. Microsoft was still working to restore services at last report.<br><strong>Why it matters:<\/strong> Dependence on a few cloud providers keeps producing outages that hit businesses and public services at once.<br><strong>Sources:<\/strong> <a href=\"https://www.yahoo.com/news/videos/ap-top-stories-november-13-113020882.html\" target=\"_blank\" rel=\"noopener\">AP top stories<\/a>, <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now headlines<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Supreme Court agrees to hear Trump's southern border asylum suspension [Courts / Immigration] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> AP's roundup says the court agreed to take up Trump's executive order suspending asylum access at the southern border. I could not find a second source confirming the grant.<br><strong>Why it matters:<\/strong> A ruling would define presidential power over asylum, one of the administration's central immigration policies.<br><strong>Sources:<\/strong> <a href=\"https://www.yahoo.com/news/videos/ap-top-stories-november-13-113020882.html\" target=\"_blank\" rel=\"noopener\">AP top stories<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">ICE custody deaths and detainee protests draw scrutiny<\/span><span class=\"cat\">Immigration<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democracy Now reports at least 62 immigrants have died in ICE custody since Trump returned to office, and detainees at California's Adelanto facility began another hunger strike. There were also protests over the ICE detention of a University of South Florida professor.<br><strong>Why it matters:<\/strong> Rising deaths and detention fights fuel oversight demands from a Democratic Congress.<br><strong>Sources:<\/strong> <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now headlines<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Nor'easter soaks the Northeast before a cold weekend<\/span><span class=\"cat\">Weather<\/span><\/h2>\n<p><strong>What happened:<\/strong> A developing nor'easter brought heavy rain and gusty winds to the New York area from Thursday into Friday, with higher-elevation snow in New England. Forecasters said the system would strengthen offshore Friday and clear by Saturday morning, leaving highs in the 30s and 40s.<br><strong>Why it matters:<\/strong> The first widespread cold of the season arrives for nearly 200 million people in the East.<br><strong>Sources:<\/strong> <a href=\"https://www.fox5ny.com/news/nyc-weather-noreaster-snow-rain-storm-forecast\" target=\"_blank\" rel=\"noopener\">Fox 5 NY<\/a>, <a href=\"https://www.natureworldnews.com/articles/73808/20261111/first-snow-coldest-air-since-spring-target-nearly-200-million-east-late-week-noreaster-forms.htm\" target=\"_blank\" rel=\"noopener\">Nature World News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Friday 13 Nov close): 7,561.67 - <a href=\"https://wtop.com/national/2026/11/how-major-us-stock-indexes-fared-friday-11-13-2026/\" target=\"_blank\" rel=\"noopener\">AP via WTOP<\/a><\/li><li>Nasdaq Composite: 25,136.27 - <a href=\"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-futures-tick-133734502.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance<\/a><\/li><li>10-year Treasury yield: no reliable Friday close found in my sources - <a href=\"https://tradingeconomics.com/united-states/government-bond-yield/news/579140\" target=\"_blank\" rel=\"noopener\">Trading Economics<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Airline recovery from the ground stop and any finding on its cause.<\/li><li>Nvidia's search for a permanent CEO and its 17 November earnings.<\/li><li>Senate Democratic leadership contest between Schumer and Van Hollen.<\/li><\/ul>"}, "asia": {"line": "US officials confirm a three-way Trump-Xi-Putin meeting in China, while Nvidia's leadership shock rattles Asian tech stocks and Indonesia's vice-president crisis deepens.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Trump to meet Putin and Xi in China next week, US officials say<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US officials said President Trump will take part in the first trilateral meeting of the US, Chinese and Russian leaders on the sidelines of APEC in Shenzhen next week. Officials said they did not expect Trump to raise with Xi the espionage allegations against tech executive Alice Huang, and that trade would be the focus. China's State Council confirmed Xi will attend the APEC leaders' meeting in Shenzhen.<br><strong>Why it matters:<\/strong> The format puts the three largest nuclear powers at one table, with Iran, trade and chip controls all in play.<br><strong>Sources:<\/strong> <a href=\"https://abcnews.com/Politics/trump-meet-putin-xi-china-week-us-officials/story?id=138128914\" target=\"_blank\" rel=\"noopener\">ABC News<\/a>, <a href=\"https://shenshiweioffical.substack.com/p/china-this-week-five-things-you-need-a31\" target=\"_blank\" rel=\"noopener\">China This Week newsletter<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Asian shares slip as Nvidia CEO's exit raises AI doubts<\/span><span class=\"cat\">Economy / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Asian shares were mixed to lower on Friday after Jensen Huang's exit as Nvidia CEO. AP had the Nikkei up about 0.5-0.8% near 61,100-61,300, the Kospi down about 1% near 5,290 with SK Hynix off 3%, and the Hang Seng down more than 1%. Nvidia shares fell over 4% in the US and analysts flagged fears of tighter US chip export rules before the Trump-Xi talks.<br><strong>Why it matters:<\/strong> Korea, Taiwan and Japan carry the AI hardware chain, so leadership uncertainty at its biggest customer spreads quickly through their markets.<br><strong>Sources:<\/strong> <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a>, <a href=\"https://investinglive.com/stock-market-update/asian-stocks-steady-as-nikkei-gains-1-4-hang-seng-slips-on-nvidia-leadership-fallout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">China's October data due as stimulus is switched on<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Official figures due Monday are expected to show slower growth in industrial output and retail consumption in October, according to Bloomberg's economist survey. The data is the first full scorecard since new stimulus measures took effect.<br><strong>Why it matters:<\/strong> It tests whether Beijing's support measures are lifting demand just before it hosts APEC.<br><strong>Sources:<\/strong> <a href=\"https://www.bloomberg.com/news/articles/2026-11-13/china-gets-first-economic-scorecard-with-stimulus-taps-turned-on\" target=\"_blank\" rel=\"noopener\">Bloomberg<\/a>, <a href=\"https://shenshiweioffical.substack.com/p/china-this-week-five-things-you-need-a31\" target=\"_blank\" rel=\"noopener\">China This Week newsletter<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Indonesia's vice-president crisis: Gibran's exit stirs coalition strain<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Vice President Gibran Rakabuming Raka told President Prabowo this week he intends to step down after court rulings on his education certificate; Reuters and Bloomberg reported he had resigned and Prabowo accepted it, while the palace described an intention to resign. Analysts say the episode strains Prabowo's alliances. The MPR must convene within 60 days to choose a successor from two nominees.<br><strong>Why it matters:<\/strong> Southeast Asia's largest economy faces an unusual succession fight with market and coalition implications.<br><strong>Sources:<\/strong> <a href=\"https://www.thejakartapost.com/indonesia/2026/11/11/gibran-offers-to-resign\" target=\"_blank\" rel=\"noopener\">The Jakarta Post<\/a>, <a href=\"https://www.scmp.com/week-asia/politics/article/3374034/indonesian-vp-resignation-drama-raises-stakes-prabowo-alliances-strain\" target=\"_blank\" rel=\"noopener\">South China Morning Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">ASEAN summit preparations finish in Manila<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> President Marcos conducted a final inspection of the ASEAN summit venues as Finance Secretary Recto oversaw last preparations, with the 49th summit opening this weekend. Indonesia and the Philippines had earlier agreed to deepen defence and economic cooperation.<br><strong>Why it matters:<\/strong> The summit will test the bloc's response to energy shortages and the South China Sea dispute.<br><strong>Sources:<\/strong> <a href=\"https://bernama.com/en/world/news.php?id=2633025\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://www.metrotvnews.com/read/b1oC6e33-indonesian-and-philippines-discuss-defense-modernization-and-protection-of-citizens\" target=\"_blank\" rel=\"noopener\">Metro TV<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Assam road crash reportedly kills at least 24 [Disaster] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Al Jazeera's Asia page listed a truck-bus crash near Kaziranga in Assam that killed at least 24 people. I could not find a second report with a confirmed toll.<br><strong>Why it matters:<\/strong> India's northeast highways have repeated mass-casualty crashes, putting road safety under scrutiny.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/asia/\" target=\"_blank\" rel=\"noopener\">Al Jazeera Asia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Delhi smog overtakes Lahore as world's worst<\/span><span class=\"cat\">Society / Environment<\/span><\/h2>\n<p><strong>What happened:<\/strong> Delhi was reported to have overtaken Lahore as the world's most polluted city as thick smog covered the capital region on 13 November.<br><strong>Why it matters:<\/strong> The winter pollution season brings health warnings and renewed pressure on authorities over crop burning and traffic curbs.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/asia/\" target=\"_blank\" rel=\"noopener\">Al Jazeera Asia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Pakistan says it killed 74 militants in raids [Security] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Pakistan's military said it killed 74 militants in raids, according to Al Jazeera's Asia listing. The figure comes from military statements and could not be independently verified.<br><strong>Why it matters:<\/strong> It signals an escalation in operations against militants along the Afghan border region.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/asia/\" target=\"_blank\" rel=\"noopener\">Al Jazeera Asia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">MSCI adds Chinese AI and energy names; China clears Lilly pill [Economy] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> MSCI will add Zhongji Innolight, Huadian New Energy and Yunnan Germanium to its China Index from 1 December. A weekly newsletter also says China approved Eli Lilly's first oral weight-loss drug; Lilly had said launch could come between late 2026 and early 2027.<br><strong>Why it matters:<\/strong> Index inclusion directs passive flows into AI optics and metals, and the approval opens a large obesity-drug market.<br><strong>Sources:<\/strong> <a href=\"https://shenshiweioffical.substack.com/p/china-this-week-five-things-you-need-a31\" target=\"_blank\" rel=\"noopener\">China This Week newsletter<\/a>, <a href=\"https://www.thestandard.com.hk/innovation/article/335473/China-approval-for-Eli-Lilly-GLP-1-pill-to-come-as-soon-as-2026-executive-says\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Cricket: New Zealand and India meet in fourth ODI in Tauranga<\/span><span class=\"cat\">Sports<\/span><\/h2>\n<p><strong>What happened:<\/strong> The fourth match of the New Zealand-India series was played in Tauranga on 13-14 November, with India leading the series going into the game.<br><strong>Why it matters:<\/strong> The result shapes the decider and India's standing in the series.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/asia/\" target=\"_blank\" rel=\"noopener\">Al Jazeera Asia<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Nikkei 225: about 61,142 on 13 Nov (up 0.5%, intraday per AP) - <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a><\/li><li>Shanghai Composite: about 3,634 (down 0.6%, intraday per AP) - <a href=\"https://www.ksat.com/business/2026/11/13/asian-shares-are-mixed-as-investors-assess-impact-of-nvidias-fallout-on-global-ai-development/\" target=\"_blank\" rel=\"noopener\">AP via KSAT<\/a><\/li><li>Kospi: about 5,290 (down 1%, intraday per AP) - <a href=\"https://investinglive.com/stock-market-update/asian-stocks-steady-as-nikkei-gains-1-4-hang-seng-slips-on-nvidia-leadership-fallout/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a><\/li><li>USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>15 Nov: China's October activity data (Bloomberg expects slower output and consumption).<\/li><li>Weekend ASEAN sessions in Manila and the MPR timetable to replace Indonesia's vice-president.<\/li><li>18-19 Nov: APEC in Shenzhen and the Trump-Xi-Putin meeting.<\/li><\/ul>"}, "hk": {"line": "LegCo passed a Northern Metropolis bill and the Hang Seng fell 1.55% on Friday, while police upgraded a Central assault to murder.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Hang Seng falls 1.55% to 23,637.60 on Friday<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index closed at 23,637.60 on 13 November, down 370.95 points, after a 1.26% fall on Thursday. The tech index fell about 3% on Nvidia-related worries.<br><strong>Why it matters:<\/strong> The tech-heavy market is exposed to the AI trade, with Nvidia reporting on 17 November.<br><strong>Sources:<\/strong> <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">LegCo passes bill to streamline Northern Metropolis development<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> Lawmakers passed a bill to speed up Northern Metropolis development (details of the bill not confirmed in my sources).<br><strong>Why it matters:<\/strong> It is a flagship land-supply and growth plan for the city.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Central wounding case reclassified as murder<\/span><span class=\"cat\">Society<\/span><\/h2>\n<p><strong>What happened:<\/strong> Police reclassified a wounding case in Central as murder after a 41-year-old Filipino man, assaulted on 7 November, died in hospital.<br><strong>Why it matters:<\/strong> It is a violent-crime case in a busy district; the investigation continues.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348388/Morning-Recap-November-13-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Five defendants in San Po Kong subversion case intend to plead guilty<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The court heard all five defendants intend to plead guilty. They were among 10 people arrested in December last year on suspicion of illegal weapons training in an industrial building in San Po Kong.<br><strong>Why it matters:<\/strong> The case moves towards sentencing under national-security law.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Queen Mary Hospital lift probe finds \"deficiencies\"<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> A probe into the Queen Mary Hospital lift scandal found \"deficiencies\" and possible illegal acts (headline only; details unconfirmed).<br><strong>Why it matters:<\/strong> It concerns safety and accountability at a major public hospital.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Police arrest 12 in illegal ride-hailing crackdown<\/span><span class=\"cat\">Transport<\/span><\/h2>\n<p><strong>What happened:<\/strong> Police arrested 12 men and seized 12 private cars in a citywide crackdown on illegal ride-hailing between 27 October and Friday.<br><strong>Why it matters:<\/strong> It signals continued enforcement against unlicensed passenger services.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348388/Morning-Recap-November-13-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Court rejects Ronson Chan's bid to take appeal to top court<\/span><span class=\"cat\">Courts<\/span><\/h2>\n<p><strong>What happened:<\/strong> The court rejected the former press union head's bid to take his police-obstruction appeal to the Court of Final Appeal (headline only; unconfirmed).<br><strong>Why it matters:<\/strong> It ends a case closely watched by journalists.<br><strong>Sources:<\/strong> <a href=\"https://hongkongfp.com/hong-kong-news/\" target=\"_blank\" rel=\"noopener\">Hong Kong Free Press<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Northern Metropolis logistics cluster draws 16 expressions of interest<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Authorities said on Friday that 16 submissions came from developers, logistics operators, industry associations and professional services providers.<br><strong>Why it matters:<\/strong> It tests market appetite for the Northern Metropolis plan.<br><strong>Sources:<\/strong> <a href=\"https://www.scmp.com/news/hong-kong\" target=\"_blank\" rel=\"noopener\">SCMP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Education bill to tighten teacher registration and national security rules<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> The government planned to gazette the Education (Amendment) Bill 2026, requiring teaching certificates and barring people convicted of national security offences from teaching (reported 12 November).<br><strong>Why it matters:<\/strong> It changes who can work in schools.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348346/Night-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Alphabet's first Hong Kong and Singapore dollar bonds draw about US$5 billion in orders<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Alphabet's first Hong Kong and Singapore dollar bond sales drew about US$5 billion in early orders.<br><strong>Why it matters:<\/strong> It signals depth in the city's debt market.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348346/Night-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Hang Seng 23,637.60 (13 Nov), down 1.55% - <a href=\"https://www.bbntimes.com/financial/hong-kong-stock-exchange-today-hang-seng-index-drops-1-55-to-23-637-60-as-tech-index-sinks-3-on-nvidia-fallout\" target=\"_blank\" rel=\"noopener\">BBN Times<\/a><\/li><li>HIBOR, USD/HKD and weather: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>17 Nov: Nvidia earnings; 18 Nov: FOMC minutes.<\/li><li>18-19 Nov: APEC in Shenzhen.<\/li><li>Gazetting of the Education (Amendment) Bill and a sex offences reform bill.<\/li><\/ul>"}}}, {"date": "2026-11-13", "ed": {"world": {"line": "Nvidia's CEO resigned and US stocks slipped as Treasury yields hit 5.1%, while Trump's rejection of an Iran deal pushed oil up and Anthropic's record IPO roadshow ran on.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns, leadership reset hits tech<\/span><span class=\"cat\">Technology<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia announced that Jensen Huang resigned as CEO after a board investigation into his conduct and alleged ties to a suspected Chinese spy; CFO Colette Kress is reported as interim chief. Shares plunged at the open, recovered much of the loss and closed down 4.34%.<br><strong>Why it matters:<\/strong> Nvidia is the AI-chip bellwether and a huge weight in US indexes, so a founder-CEO exit raises questions about AI spending and the company's direction ahead of earnings.<br><strong>Sources:<\/strong> <a href=\"https://eurasiabusinessnews.com/2026/11/13/stock-market-today-november-12-2026-dow-sp-500-and-nasdaq-fall-after-jensen-huang-resigns/\" target=\"_blank\" rel=\"noopener\">Eurasia Business News<\/a>, <a href=\"https://scmp.com/tech/article/3373724/nvidia-ceo-jensen-huang-admits-affair-board-orders-investigation\" target=\"_blank\" rel=\"noopener\">SCMP<\/a>, <a href=\"https://www.ibtimes.com/nvidia-jensen-huang-succession-plan-investigation-3809602\" target=\"_blank\" rel=\"noopener\">IBTimes<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Wall Street slips as 10-year Treasury yield hits 5.10%<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The S&amp;P 500 closed at about 7,592 (-0.35%), the Dow at 52,297 (-0.36%) and the Nasdaq at 25,366 (-0.39%), while small caps fell 1.66%. Treasury yields climbed to 5.10% and the S&amp;P 500 is still up about 2.9% on the week after a rebound.<br><strong>Why it matters:<\/strong> Rising long-term yields raise borrowing costs worldwide and weigh on valuations, especially in tech and small companies.<br><strong>Sources:<\/strong> <a href=\"https://vistapglobal.com/stock-market-today-november-12-2026-stocks-fall-as-treasury-yields-hit-5-10-oil-rises-and-nvidia-faces-leadership-reset-amd-crwv-eprx-googl-modd-msft-nvda-ser-spcx-ttek-ual/\" target=\"_blank\" rel=\"noopener\">Vista PGlobal<\/a>, <a href=\"https://krmg.com/2026/11/12/how-major-us-stock-indexes-fared-thursday-11-12-2026/\" target=\"_blank\" rel=\"noopener\">KRMG / AP<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Trump says he is no longer interested in a deal with Iran; oil rises<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Reports say President Trump said he is no longer interested in a deal with Iran, a sharp turn after talk earlier in the week of \"momentum\" following his meeting with Qatar's prime minister. Oil rose on the news.<br><strong>Why it matters:<\/strong> It lowers hopes for a negotiated end to the US-Iran confrontation and keeps risk of renewed fighting and energy disruption in the Gulf alive.<br><strong>Sources:<\/strong> <a href=\"https://vistapglobal.com/stock-market-today-november-12-2026-stocks-fall-as-treasury-yields-hit-5-10-oil-rises-and-nvidia-faces-leadership-reset-amd-crwv-eprx-googl-modd-msft-nvda-ser-spcx-ttek-ual/\" target=\"_blank\" rel=\"noopener\">Vista PGlobal<\/a>, <a href=\"https://www.aljazeera.com/news/liveblog/2026/11/9/iran-war-live-trump-says-war-effectively-over-iran-demands-surrender\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a> (single-source on the reversal, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">First Russia-Ukraine talks in nine months wrap up in Abu Dhabi<\/span><span class=\"cat\">Geopolitics<\/span><\/h2>\n<p><strong>What happened:<\/strong> US-mediated talks between Ukraine and Russia, with envoys Witkoff and Kushner present, ran 10-11 November, the first trilateral round since February. Rubio called them \"very productive\" but urged patience; territory and security guarantees remain the sticking points, and Russia objects to European involvement for now.<br><strong>Why it matters:<\/strong> A restart of direct negotiation is the first diplomatic opening in months, though no ceasefire has been announced.<br><strong>Sources:<\/strong> <a href=\"https://www.al-monitor.com/originals/2026/11/us-attempts-new-peace-push-first-russia-ukraine-talks-nine-months\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>, <a href=\"https://www.dailysabah.com/world/europe/russia-ukraine-resume-us-mediated-peace-talks-after-9-months/amp\" target=\"_blank\" rel=\"noopener\">Daily Sabah<\/a>, <a href=\"https://censor.net/en/news/3587095/russia-and-us-did-not-discuss-peace-plan-in-abu-dhabi-putin-s-aide-ushakov\" target=\"_blank\" rel=\"noopener\">Censor.net<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Anthropic's record IPO roadshow runs, shares set at $70-78<\/span><span class=\"cat\">Business<\/span><\/h2>\n<p><strong>What happened:<\/strong> Anthropic launched its roadshow on 10 November to sell 825 million shares at an expected $70 to $78 each, for a Nasdaq listing under \"ANT\". Pricing and trading are expected around 18-20 November, though no final price is confirmed.<br><strong>Why it matters:<\/strong> It is set to be among the largest listings ever and a test of investor appetite for AI valuations as Nvidia's turmoil unsettles the sector.<br><strong>Sources:<\/strong> <a href=\"https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=bn\" target=\"_blank\" rel=\"noopener\">RTTNews<\/a>, <a href=\"https://www.technobezz.com/news/anthropic-ipo-roadshow-shares-price-range\" target=\"_blank\" rel=\"noopener\">Technobezz<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Hot US inflation keeps a December Fed hike in view<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> October consumer prices came in above expectations, and a Treasury 10-year auction drew a high yield on weak demand. Traders are pricing a likely December rate hike by the Federal Reserve.<br><strong>Why it matters:<\/strong> A hiking Fed tightens financial conditions globally and strengthens the dollar, which pressures emerging markets and dollar-pegged Hong Kong.<br><strong>Sources:<\/strong> <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a>, <a href=\"https://www.zacks.com/stock/news/3027683/stock-market-news-for-nov-11-2026\" target=\"_blank\" rel=\"noopener\">Zacks<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">COP31 leaders' segment in Antalya focuses on finance<\/span><span class=\"cat\">Climate<\/span><\/h2>\n<p><strong>What happened:<\/strong> Day 4 of the UN climate summit (12 November) featured the second day of the Leaders' Summit, with a roundtable on accelerating Paris Agreement implementation and access to finance, plus a business forum. The presidency is split between Turkey and Australia, who have disagreed over who runs negotiations.<br><strong>Why it matters:<\/strong> Climate finance for vulnerable countries is the make-or-break issue, in a year forecast to rank among the hottest on record.<br><strong>Sources:<\/strong> <a href=\"https://unfccc.int/sites/default/files/resource/COP_31_Overview_Schedule.pdf\" target=\"_blank\" rel=\"noopener\">UNFCCC schedule<\/a>, <a href=\"https://enb.iisd.org/antalya-un-climate-change-conference-cop31\" target=\"_blank\" rel=\"noopener\">Earth Negotiations Bulletin<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Record Bundibugyo Ebola outbreak continues in DRC<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> UK monitoring data show 10,532 confirmed cases and 5,126 deaths in the DRC as of 1 November, the largest outbreak of this Ebola species. It remains a WHO emergency.<br><strong>Why it matters:<\/strong> The scale and high fatality rate strain health systems and raise regional spread concerns.<br><strong>Sources:<\/strong> <a href=\"https://www.gov.uk/government/publications/outbreaks-under-monitoring-in-2026/outbreaks-under-monitoring-week-44-week-ending-1-november-2026\" target=\"_blank\" rel=\"noopener\">UK Health Security Agency<\/a> (single source, unconfirmed)<\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">Bitcoin and gold weaken on rate-hike fears<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Bitcoin fell below $74,000 after a weekend sell-off and was around $74,000 on 10 November, with gold near $4,100. Both pulled back as US inflation data raised rate-hike expectations (latest levels found are from 10 November).<br><strong>Why it matters:<\/strong> Even traditional and speculative havens are losing ground as yields rise.<br><strong>Sources:<\/strong> <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a>, <a href=\"https://news.bitcoin.com/price-predictions/cathie-wood-gold-going-down-bitcoin/\" target=\"_blank\" rel=\"noopener\">Bitcoin.com<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Hong Kong shares soft, Cathay orders 14 more jets<\/span><span class=\"cat\">Asia<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng index was around 24,400 earlier in the week, and Cathay Pacific ordered 14 more aircraft; Hong Kong also readies its largest-ever WinterFest. Hong Kong news dated specifically 12 November was not found (unconfirmed timing).<br><strong>Why it matters:<\/strong> Hong Kong markets track US yields and the dollar peg, so US rate moves matter locally.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348211/Night-Recap-November-11-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://minkabu.jp/news/4655145\" target=\"_blank\" rel=\"noopener\">Minkabu<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 7,592.40 (-0.35%), Dow 52,297.09 (-0.36%), Nasdaq 25,366.09 (-0.39%), Nvidia -4.34%: <a href=\"https://krmg.com/2026/11/12/how-major-us-stock-indexes-fared-thursday-11-12-2026/\" target=\"_blank\" rel=\"noopener\">KRMG / AP<\/a><\/li><li>US Treasury yields up to about 5.10%: <a href=\"https://vistapglobal.com/stock-market-today-november-12-2026-stocks-fall-as-treasury-yields-hit-5-10-oil-rises-and-nvidia-faces-leadership-reset-amd-crwv-eprx-googl-modd-msft-nvda-ser-spcx-ttek-ual/\" target=\"_blank\" rel=\"noopener\">Vista PGlobal<\/a><\/li><li>Bitcoin about $74,000 and gold about $4,120 (10 Nov levels): <a href=\"https://www.mitrade.com/insights/news/live-news/article-2-2246094-20261110\" target=\"_blank\" rel=\"noopener\">Mitrade<\/a><\/li><li>Oil rose on 12 Nov; settlement levels not confirmed.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Anthropic IPO pricing and first trade, expected around 18-20 November.<\/li><li>Nvidia's CEO search and upcoming earnings.<\/li><li>COP31 finance talks to 20 November; US wholesale inflation data and December Fed meeting; any US-Iran escalation.<\/li><\/ul>"}, "us": {"line": "Nvidia's CEO resigned and shook Wall Street, Democrats flipped Mississippi to reach 55 Senate seats, and a deadly Brooklyn building collapse dominated the domestic news.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Jensen Huang resigns as Nvidia CEO<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia said Huang resigned as president, CEO and board member effective immediately on Thursday. CFO Colette Kress is interim CEO while the board searches for a permanent chief, and the Wall Street Journal had reported the board was preparing to oust him. Reuters tied the exit to reports of an affair with a Chinese businesswoman whom US authorities suspect of spying for Beijing.<br><strong>Why it matters:<\/strong> The departure of the face of the AI boom raises questions about the chipmaker's direction, US chip sales to China and AI valuations.<br><strong>Sources:<\/strong> <a href=\"https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html\" target=\"_blank\" rel=\"noopener\">CNBC live updates<\/a>, <a href=\"https://www.aljazeera.com/news/2026/11/12/why-did-nvidia-ceo-jensen-huang-resign-and-who-is-colette-kress\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm\" target=\"_blank\" rel=\"noopener\">SEC 8-K<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Wall Street slips as Nvidia tumbles and yields rise<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> On Thursday the S&amp;P 500 fell 0.35% to 7,592.40, the Nasdaq 0.39% to 25,366.09 and the Dow 0.36% to 52,297.09, per Reuters-based reports. Nvidia closed about 4.3% lower after sliding as much as 14.3% earlier, while AMD gained 5.9% and Broadcom 5.5%. Treasury yields rose.<br><strong>Why it matters:<\/strong> The market now faces Nvidia's earnings and hawkish Fed signals after a hot October inflation reading.<br><strong>Sources:<\/strong> <a href=\"https://live.euronext.com/en/financial-news/wall-street-ends-lower-nvidia-ceo-resigns-us-yields\" target=\"_blank\" rel=\"noopener\">Euronext / Reuters<\/a>, <a href=\"https://www.tradingkey.com/analysis/stocks/us-stocks/262303336-us-stock-nvidia-ceo-jensen-huang-resigns-nasdaq-falls-tradingkey\" target=\"_blank\" rel=\"noopener\">TradingKey<\/a>, <a href=\"https://sg.finance.yahoo.com/news/live/stock-market-today-thursday-november-12-sp-500-nasdaq-dow-nvidia-slides-jensen-huang-resigns-invest-165632931.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Democrat Scott Colom wins Mississippi Senate seat<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> The AP called the closest Senate race in the country for Colom over incumbent Republican Cindy Hyde-Smith after more than a week of counting absentee and provisional ballots, a margin of a few thousand votes. He becomes the state's first Black senator since Reconstruction and lifts Democrats to 55 seats.<br><strong>Why it matters:<\/strong> The win widens the Democratic Senate majority well beyond the bare control secured on 3 November.<br><strong>Sources:<\/strong> <a href=\"https://www.kunc.org/npr-news/2026-11-11/democrat-scott-colom-wins-mississippi-senate-race\" target=\"_blank\" rel=\"noopener\">NPR via KUNC<\/a>, <a href=\"https://www.fox4news.com/news/scott-colom-wins-senate-mississippi\" target=\"_blank\" rel=\"noopener\">Fox 4<\/a>, <a href=\"https://www.democracynow.org/2026/11/12/scott_colom_victory_speech\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Brooklyn building collapse kills several, many injured<\/span><span class=\"cat\">Disaster<\/span><\/h2>\n<p><strong>What happened:<\/strong> A three-story building at the edge of a construction site at 2625 Bedford Avenue in Flatbush collapsed on Wednesday afternoon, trapping people in the rubble. Early reports counted one dead; later roundups said at least two died with a dozen or more injured, including children, and an AP digest reported the toll had risen to eight (counts differ by source).<br><strong>Why it matters:<\/strong> Investigators are looking at excavation beside the building, putting construction oversight under scrutiny.<br><strong>Sources:<\/strong> <a href=\"https://www.cleveland19.com/2026/11/11/new-york-city-building-collapse-traps-people-rubble/\" target=\"_blank\" rel=\"noopener\">AP via Cleveland19<\/a>, <a href=\"https://sitkasentinel.com/stories/ap-news-digest-12-pm,185804\" target=\"_blank\" rel=\"noopener\">AP News digest (Sitka Sentinel)<\/a>, <a href=\"https://ru4people.substack.com/p/morning-news-update-november-12-2026\" target=\"_blank\" rel=\"noopener\">Morning News Update, 12 Nov<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Vance weighs direct talks with Iran's security chief as threats mount<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Wall Street Journal reported Vice President JD Vance is considering face-to-face talks with Iranian security chief Mohsen Rezaei, though US officials called the idea preliminary and Rezaei dismissed the reports. A roundup said Treasury Secretary Scott Bessent has moved to a military base after Iranian threats against his life, and that Trump would not hesitate to renew strikes.<br><strong>Why it matters:<\/strong> The parallel diplomatic and military tracks decide whether the Gulf conflict de-escalates after the midterms.<br><strong>Sources:<\/strong> <a href=\"https://jewishinsider.com/2026/11/vance-direct-talks-top-iranian-security-official-report/\" target=\"_blank\" rel=\"noopener\">Jewish Insider<\/a>, <a href=\"https://www.israelhayom.com/2026/11/11/report-vance-considers-face-to-face-meeting-with-irans-national-security-chief/\" target=\"_blank\" rel=\"noopener\">Israel Hayom<\/a>, <a href=\"https://www.democracynow.org/2026/11/13/headlines\" target=\"_blank\" rel=\"noopener\">Democracy Now<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Five shot at downtown Washington gym<\/span><span class=\"cat\">Crime<\/span><\/h2>\n<p><strong>What happened:<\/strong> Five people were shot in downtown Washington, DC, one fatally, at a gym, according to the AP digest. The suspect died by suicide. A separate roundup describes one death and four wounded.<br><strong>Why it matters:<\/strong> It is another high-casualty shooting in the capital, where federal policing has been a political flashpoint.<br><strong>Sources:<\/strong> <a href=\"https://sitkasentinel.com/stories/ap-news-digest-12-pm,185804\" target=\"_blank\" rel=\"noopener\">AP News digest (Sitka Sentinel)<\/a>, <a href=\"https://ru4people.substack.com/p/morning-news-update-november-12-2026\" target=\"_blank\" rel=\"noopener\">Morning News Update, 12 Nov<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Oklahoma executes James Pavatt for 2001 killing<\/span><span class=\"cat\">Crime / Justice<\/span><\/h2>\n<p><strong>What happened:<\/strong> Oklahoma put to death a man convicted of a 2001 killing, the first of two US executions that day per AP. James Pavatt, convicted of the 2001 murder of advertising executive Rob Andrew, had been denied clemency 3-2 by the state's parole board in October.<br><strong>Why it matters:<\/strong> It continues a high pace of executions in 2026, the state's fourth this year.<br><strong>Sources:<\/strong> <a href=\"https://sitkasentinel.com/stories/ap-news-digest-12-pm,185804\" target=\"_blank\" rel=\"noopener\">AP News digest (Sitka Sentinel)<\/a>, <a href=\"https://www.news9.com/crime/oklahoma-death-row-james-pavatt\" target=\"_blank\" rel=\"noopener\">News 9<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">Alaska Senate race: Peltola widens lead with 15% of ballots left<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Democrat Mary Peltola expanded her narrow lead over Republican Sen. Dan Sullivan, with about 15% of ballots still to be counted. The race is uncalled, and the ranked-choice tabulation is scheduled for 18 November.<br><strong>Why it matters:<\/strong> The outcome decides the final size of the Democratic Senate majority.<br><strong>Sources:<\/strong> <a href=\"https://washingtonstatestandard.com/2026/11/11/repub/with-25000-more-votes-counted-peltola-jkt-and-begich-near-victory-in-alaska-election/\" target=\"_blank\" rel=\"noopener\">Alaska Beacon / Washington State Standard<\/a>, <a href=\"https://ru4people.substack.com/p/morning-news-update-november-12-2026\" target=\"_blank\" rel=\"noopener\">Morning News Update, 12 Nov<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">US envoys meet Putin and Zelenskyy after Abu Dhabi talks<\/span><span class=\"cat\">Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> US envoys travelled to Moscow to brief Vladimir Putin after US-mediated talks in Abu Dhabi that produced a large prisoner exchange but no visible breakthrough on ending the war. They then met Ukrainian President Volodymyr Zelenskyy in Dublin.<br><strong>Why it matters:<\/strong> The talks are Washington's main channel on Ukraine as Trump prepares for a possible three-way meeting with Xi and Putin.<br><strong>Sources:<\/strong> <a href=\"https://www.ottumwacourier.com/news/national_news/ap-news-in-brief-at-12-04-a-m-est/article_b4d0c169-c0da-5066-b56b-cfef7164b364.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a>, <a href=\"https://www.justsecurity.org/164226/early-edition-november-12-2026/\" target=\"_blank\" rel=\"noopener\">Just Security<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">International panel weighs US measles elimination status<\/span><span class=\"cat\">Health<\/span><\/h2>\n<p><strong>What happened:<\/strong> International health officials met to decide whether the United States and Mexico have lost measles-elimination status, with a decision expected the following week. Elimination is lost when one strain spreads continuously for 12 months.<br><strong>Why it matters:<\/strong> A loss would formalise the setback after record US cases and weaker vaccination coverage.<br><strong>Sources:<\/strong> <a href=\"https://www.ottumwacourier.com/news/national_news/ap-news-in-brief-at-12-04-a-m-est/article_b4d0c169-c0da-5066-b56b-cfef7164b364.html\" target=\"_blank\" rel=\"noopener\">AP News in Brief<\/a>, <a href=\"https://kffhealthnews.org/public-health/measles-free-status-us-cdc-ralph-abraham-paho-who-outbreaks-vaccines/\" target=\"_blank\" rel=\"noopener\">KFF Health News<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>S&amp;P 500 (Thursday 12 Nov close): 7,592.40 - <a href=\"https://live.euronext.com/en/financial-news/wall-street-ends-lower-nvidia-ceo-resigns-us-yields\" target=\"_blank\" rel=\"noopener\">Euronext / Reuters<\/a><\/li><li>Nasdaq Composite: 25,366.09 - <a href=\"https://www.tradingkey.com/analysis/stocks/us-stocks/262303336-us-stock-nvidia-ceo-jensen-huang-resigns-nasdaq-falls-tradingkey\" target=\"_blank\" rel=\"noopener\">TradingKey<\/a><\/li><li>10-year Treasury yield: rose on the day, exact close not found in my sources - <a href=\"https://finance.yahoo.com/markets/stocks/articles/stock-market-today-nvidia-rebounds-141544786.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance<\/a><\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Alaska ranked-choice tabulation on 18 November in the Peltola-Sullivan race.<\/li><li>Nvidia's CEO search and its 17 November earnings.<\/li><li>Death toll and cause of the Brooklyn collapse.<\/li><\/ul>"}, "asia": {"line": "Nvidia CEO Jensen Huang resigns amid a China spy scandal, Beijing and Washington talk ahead of the Shenzhen summit, and Indonesia's vice-president quits.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Nvidia CEO Jensen Huang resigns amid China spy scandal<\/span><span class=\"cat\">Business / Tech<\/span><\/h2>\n<p><strong>What happened:<\/strong> Nvidia's board announced on Thursday that Jensen Huang resigned effective immediately, with CFO Colette Kress as interim chief executive. The exit follows reports tying him to Alice Huang, a Megaspeed executive US officials reportedly suspect was recruited by Chinese intelligence; China called the allegations baseless smears. Reports differ on the share drop: one outlet had Nvidia closing down 4.3% on Thursday, while CBS put losses near $500 billion in value over the week.<br><strong>Why it matters:<\/strong> Taiwan, Korea and Japan supply and depend on Nvidia, and the scandal feeds fears of tighter US chip export controls just before the US-China summit.<br><strong>Sources:<\/strong> <a href=\"https://www.aljazeera.com/news/2026/11/12/ai-titan-jensen-huang-out-as-nvidia-ceo\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://www.cbsnews.com/news/nvidia-ceo-jensen-huang-resigns/\" target=\"_blank\" rel=\"noopener\">CBS News<\/a>, <a href=\"https://abcnews.com/Business/nvidia-ceo-jensen-huang-resigns-amid-alleged-affair/story?id=138076256\" target=\"_blank\" rel=\"noopener\">ABC News<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Wang Yi and Rubio hold call ahead of Trump-Xi meeting<\/span><span class=\"cat\">Diplomacy<\/span><\/h2>\n<p><strong>What happened:<\/strong> China's foreign minister held a call with US Secretary of State Marco Rubio, Chinese state media reported, describing it as positive and constructive and expressing willingness to strengthen communication. The call came as the two sides prepared for the leaders' meeting at APEC in Shenzhen. A US-China political dialogue also took place in Beijing, hosted by the CPC International Department.<br><strong>Why it matters:<\/strong> Working-level channels are being used to keep the fragile trade truce on track before the leaders meet.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/world/article/348229/China&#x27;s-foreign-minister-holds-call-with-US-Rubio-China&#x27;s-state-media-reports\" target=\"_blank\" rel=\"noopener\">The Standard<\/a>, <a href=\"https://www.scmp.com/news/china/diplomacy/article/3374120/rubio-wang-hold-phone-call-trump-xi-meeting-next-week\" target=\"_blank\" rel=\"noopener\">South China Morning Post<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">3<\/span><span class=\"ht\">Xi renews Taiwan reunification pledge on Sun Yat-sen anniversary<\/span><span class=\"cat\">Politics / Security<\/span><\/h2>\n<p><strong>What happened:<\/strong> Speaking on 12 November, Xi urged Chinese people at home and abroad to unite more closely, carry forward Sun Yat-sen's legacy and pursue national rejuvenation, and Al Jazeera reported he said Taiwan's \"complete reunification\" will happen. I could not find a second source for the exact wording (unconfirmed).<br><strong>Why it matters:<\/strong> The rhetoric lands just days before Xi hosts Trump, with Taiwan arms sales still unresolved.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348252/Morning-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">Morning Recap, The Standard<\/a>, <a href=\"https://www.aljazeera.com/where/china/\" target=\"_blank\" rel=\"noopener\">Al Jazeera China<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">4<\/span><span class=\"ht\">Indonesia's vice-president Gibran resigns, stoking political uncertainty<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Reuters, citing political sources and an aide, reported that Vice President Gibran Rakabuming Raka had resigned after court rulings on his education certificate; the palace had earlier said he intended to resign. Bloomberg reported Prabowo accepted it. The MPR must convene within 60 days to elect a successor from two nominees.<br><strong>Why it matters:<\/strong> The succession fight tests Prabowo's coalition and investor confidence in Southeast Asia's largest economy.<br><strong>Sources:<\/strong> <a href=\"https://www.thejakartapost.com/indonesia/2026/11/11/gibran-offers-to-resign\" target=\"_blank\" rel=\"noopener\">The Jakarta Post<\/a>, <a href=\"https://www.thestar.com.my/news/world/2026/11/11/indonesia039s-vice-president-has-resigned-three-political-sources-say\" target=\"_blank\" rel=\"noopener\">The Star (Reuters)<\/a>, <a href=\"https://theedgemalaysia.com/node/825416\" target=\"_blank\" rel=\"noopener\">The Edge Malaysia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">5<\/span><span class=\"ht\">Asian markets shrug off Nvidia scandal as Nikkei holds near records<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> Asian equities largely absorbed the Nvidia news, with investingLive reporting that Asia shrugged off the scandal while oil steadied. Earlier in the week the Nikkei had climbed 1.3% to 61,248.59 on 11 November and the Kospi rebounded sharply from a tech-led selloff.<br><strong>Why it matters:<\/strong> Regional AI trades remain strong but sensitive to US chip policy and Nvidia's results due next week.<br><strong>Sources:<\/strong> <a href=\"https://investinglive.com/news/investinglive-asia-pacific-market-news-asia-shrugs-off-nvidia-scandal-oil-steadies/\" target=\"_blank\" rel=\"noopener\">investingLive<\/a>, <a href=\"https://www.ajc.com/news/2026/11/asian-shares-mostly-rise-on-ai-chip-demand-despite-wall-streets-retreat-on-inflation-data/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">6<\/span><span class=\"ht\">Premier Li Qiang calls for deeper social security reform<\/span><span class=\"cat\">Politics / Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> Premier Li Qiang called for further deepening social security reform, including a multi-tiered system covering urban and rural residents. The APEC leaders' meeting in Shenzhen is set for 18-19 November, and South Korea's president plans to attend.<br><strong>Why it matters:<\/strong> Pension and health coverage reform is central to boosting household consumption in the 15th Five-Year Plan.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348252/Morning-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">Morning Recap, The Standard<\/a>, <a href=\"https://en.wikipedia.org/wiki/APEC_China_2026\" target=\"_blank\" rel=\"noopener\">APEC China 2026, Wikipedia<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">7<\/span><span class=\"ht\">Japan: top court ruling on 2025 election and food tax cut debate [Politics] (unconfirmed)<\/span><\/h2>\n<p><strong>What happened:<\/strong> Jiji Press reported that Japan's top court ruled the 2025 election held in an unconstitutional state because of vote-value gaps, and the Upper House began debate on a bill to temporarily cut the consumption tax on food. NTT Docomo said a mobile network disruption was fully resolved. These items are dated 11 November (reported as of the 12th).<br><strong>Why it matters:<\/strong> The court ruling adds pressure on Prime Minister Takaichi to fix electoral malapportionment as she pursues tax relief.<br><strong>Sources:<\/strong> <a href=\"https://milled.com/japantimes-co-jp/todays-top-news-consumption-tax-cut-is-quickly-turning-into-a-headache-for-kVSDTD1bRAWam3MV\" target=\"_blank\" rel=\"noopener\">Jiji Press headlines via Japan Times digest<\/a>, <a href=\"https://japan.kantei.go.jp/news/\" target=\"_blank\" rel=\"noopener\">Japan PM Office news<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">8<\/span><span class=\"ht\">India: IndiGo extends Gulf flight suspensions; Mother Dairy raises milk prices<\/span><span class=\"cat\">Economy<\/span><\/h2>\n<p><strong>What happened:<\/strong> IndiGo extended suspension of flights to Jeddah and Madinah until 21 November and to Riyadh and Dammam until 30 November amid Houthi attacks. Mother Dairy raised milk prices by 2 to 4 rupees per litre, effective Thursday.<br><strong>Why it matters:<\/strong> Middle East conflict is raising costs and disrupting travel for Indian consumers and airlines.<br><strong>Sources:<\/strong> <a href=\"https://www.business-standard.com/current-affairs?time=1664981592\" target=\"_blank\" rel=\"noopener\">Business Standard<\/a>, <a href=\"https://telanganatoday.com/states/page/26\" target=\"_blank\" rel=\"noopener\">Telangana Today<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">9<\/span><span class=\"ht\">South Korea: justice minister nominee faces scrutiny over cases against President Lee<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> Justice minister nominee Lee Yong-cheol said it is time to focus on uncovering the truth in criminal cases against President Lee Jae Myung, without ruling out withdrawing the charges. A poll put the president's approval at 35.9%.<br><strong>Why it matters:<\/strong> The hearing stirs a partisan fight over prosecutorial independence.<br><strong>Sources:<\/strong> <a href=\"https://mbiz.heraldcorp.com/article/10934252\" target=\"_blank\" rel=\"noopener\">Herald Corp<\/a>, <a href=\"https://www.khan.co.kr/en/article/202611112233007\" target=\"_blank\" rel=\"noopener\">Kyunghyang Shinmun<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">10<\/span><span class=\"ht\">Philippines finishes ASEAN summit preparations; Marcos inspects venues<\/span><span class=\"cat\">Politics<\/span><\/h2>\n<p><strong>What happened:<\/strong> President Marcos conducted a final inspection of ASEAN summit venues and Finance Secretary Recto oversaw last preparations, as leaders including Trump prepared to arrive in Manila. SCMP said ASEAN's neutrality is set to be tested as the Philippines welcomes world leaders.<br><strong>Why it matters:<\/strong> The summit will showcase Manila's diplomatic weight while testing the bloc's balance between Washington and Beijing.<br><strong>Sources:<\/strong> <a href=\"https://bernama.com/en/world/news.php?id=2633025\" target=\"_blank\" rel=\"noopener\">Bernama<\/a>, <a href=\"https://www.scmp.com/news/asia\" target=\"_blank\" rel=\"noopener\">South China Morning Post Asia<\/a><\/p>\n<h2>Quick numbers<\/h2>\n<ul><li>Nikkei 225: 61,248.59 on 11 Nov (up 1.3%; latest verified close) - <a href=\"https://www.ajc.com/news/2026/11/asian-shares-mostly-rise-on-ai-chip-demand-despite-wall-streets-retreat-on-inflation-data/\" target=\"_blank\" rel=\"noopener\">AP via AJC<\/a><\/li><li>Kospi: about 5,278 on 11 Nov (up 0.8%, intraday per AFP) - <a href=\"https://www.bssnews.net/business/444417\" target=\"_blank\" rel=\"noopener\">BSS/AFP<\/a><\/li><li>Shanghai Composite: about 3,654 on 11 Nov (down 0.3%, intraday per AFP) - <a href=\"https://www.bssnews.net/business/444417\" target=\"_blank\" rel=\"noopener\">BSS/AFP<\/a><\/li><li>USD/CNY: not available from my sources.<\/li><\/ul>\n<h2>Worth watching next<\/h2>\n<ul><li>Nvidia's search for a permanent CEO and its earnings next week.<\/li><li>15 Nov: China's October activity data.<\/li><li>18-19 Nov: APEC in Shenzhen; ASEAN summit in Manila this weekend.<\/li><\/ul>"}, "hk": {"line": "The government is set to gazette a bill barring people convicted of national security offences from teaching, as the Hang Seng slid 1.26% on rate worries.", "html": "<h2 class=\"story\"><span class=\"num\">1<\/span><span class=\"ht\">Government to gazette bill tightening teacher registration<\/span><span class=\"cat\">Government<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Education (Amendment) Bill 2026 would require teaching certificates for all teachers and bar people convicted of national security offences from teaching.<br><strong>Why it matters:<\/strong> It changes who may work in schools and extends national-security rules into education.<br><strong>Sources:<\/strong> <a href=\"https://www.thestandard.com.hk/news/article/348346/Night-Recap-November-12-2026\" target=\"_blank\" rel=\"noopener\">The Standard<\/a><\/p>\n<h2 class=\"story\"><span class=\"num\">2<\/span><span class=\"ht\">Hang Seng falls 1.26% on Thursday<\/span><span class=\"cat\">Markets<\/span><\/h2>\n<p><strong>What happened:<\/strong> The Hang Seng Index fell 1.26% on 12 November, after closing at 24,315.92 on Wednesday
